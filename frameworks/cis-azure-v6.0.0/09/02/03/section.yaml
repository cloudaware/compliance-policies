---
name: "9.2.3 Ensure 'Versioning' is Set to 'Enabled' on Azure Blob Storage Storage Accounts (Automated)"
description: >
  Enabling blob versioning allows for the automatic retention of previous versions of 
  objects. With blob versioning enabled, earlier versions of a blob are accessible for data 
  recovery in the event of modifications or deletions.
