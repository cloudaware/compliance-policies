---
name: "9.3.2.2 Ensure that 'Public Network Access' is 'Disabled' for Storage Accounts (Automated)"
description: |-
  Disable public network access to prevent exposure to the internet and reduce the risk of 
  unauthorized access. Use private endpoints to securely manage access within trusted networks.

  Disallowing public network access for a storage account overrides the public access settings 
  for individual containers in that storage account.
