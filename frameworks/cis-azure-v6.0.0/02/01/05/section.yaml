name: "2.1.5 Ensure that Unity Catalog is Configured for Azure Databricks (Manual)"
description: >
  Unity Catalog is a centralized governance model for managing and securing data in Azure Databricks. 
  It provides fine-grained access control to databases, tables, and views using Microsoft Entra ID 
  identities. Unity Catalog also enhances data lineage, audit logging, and compliance monitoring, 
  making it a critical component for security and governance.
