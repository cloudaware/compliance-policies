---
name: "6.1.1.3 Ensure the Storage Account Containing the Container with Activity Logs is Encrypted with Customer-managed Key (CMK) (Manual)"
description: >
  Customer-managed keys introduce additional depth to security by providing a means to 
  manage access control for encryption keys. Where compliance and security frameworks 
  indicate the need, and organizational capacity allows, sensitive data at rest can be 
  encrypted using customer-managed keys (CMK) rather than Microsoft-managed keys.
