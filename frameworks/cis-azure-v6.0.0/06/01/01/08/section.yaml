name: "6.1.1.8 Ensure that a Microsoft Entra Diagnostic Setting Exists to Send Microsoft Entra Activity Logs to an Appropriate Destination (Manual)"
description: >
  Ensure that a Microsoft Entra diagnostic setting is configured to send Microsoft Entra activity logs to 
  a suitable destination, such as a Log Analytics workspace, storage account, or event hub. This enables 
  centralized monitoring and analysis of Microsoft Entra activity logs.
