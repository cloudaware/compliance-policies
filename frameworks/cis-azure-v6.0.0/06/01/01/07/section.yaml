---
name: "6.1.1.7 Ensure that a Microsoft Entra Diagnostic Setting Exists to Send Microsoft Graph Activity Logs to an Appropriate Destination (Manual)"
description: >
  Ensure that a Microsoft Entra diagnostic setting is configured to send Microsoft Graph activity logs to a 
  suitable destination, such as a Log Analytics workspace, storage account, or event hub. This enables 
  centralized monitoring and analysis of all HTTP requests that the Microsoft Graph service receives and 
  processes for a tenant.
