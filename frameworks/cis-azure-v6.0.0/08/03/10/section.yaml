---
name: "8.3.10 Ensure that Azure Key Vault Managed HSM is Used when Required (Manual)"
description: |-
  Azure Key Vault Managed HSM is a fully managed, highly available, single-tenant cloud 
  service that safeguards cryptographic keys using FIPS 140-2 Level 3 validated HSMs.

  Note: While an automated assessment procedure exists for this recommendation, the 
  assessment status remains manual, as this recommendation to use Managed HSM 
  applies only to scenarios where specific regulatory and compliance requirements 
  mandate the use of a dedicated hardware security module.
