---
name: "7.2 Ensure that SSH Access from the Internet is Evaluated and Restricted (Automated)"
description: >
  Network security groups should be periodically evaluated for port misconfigurations. 
  Where SSH is not explicitly required and narrowly configured for resources attached to 
  a network security group, Internet-level access to Azure resources should be restricted 
  or eliminated.
