---
name: "7.4 Ensure that HTTP(S) Access from the Internet is Evaluated and Restricted (Automated)"
description: >
  Network security groups should be periodically evaluated for port misconfigurations. 
  Where HTTP(S) is not explicitly required and narrowly configured for resources 
  attached to a network security group, Internet-level access to Azure resources should 
  be restricted or eliminated.
