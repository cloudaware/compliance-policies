name: >
  3.6.1.2 Secret and private keys used to encrypt/decrypt stored account 
  data are stored in one (or more) of the described forms at all times.
description: |-
  The following forms:

  - Encrypted with a key-encrypting key that is at least as strong as 
  the data-encrypting key, and that is stored separately from 
  the data-encrypting key.
  - Within a secure cryptographic device (SCD), such as a hardware security 
  module (HSM) or PTS-approved point-of-interaction device.
  - As at least two full-length key components or key shares, in accordance 
  with an industry-accepted method.
