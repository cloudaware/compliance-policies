name: >
  2.2.2 Vendor default accounts are managed.
description: |-
  As follows:

  - If the vendor default account(s) will be used, the default password is 
  changed per Requirement 8.3.6.
  - If the vendor default account(s) will not be used, the account is removed 
  or disabled.
