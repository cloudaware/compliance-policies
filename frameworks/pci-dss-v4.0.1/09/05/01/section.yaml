name: >
  9.5.1 POI devices that capture payment card data via direct physical 
  interaction with the payment card form factor are protected from tampering 
  and unauthorized substitution.
description: |-
  Including the following:

  - Maintaining a list of POI devices.
  - Periodically inspecting POI devices to look for tampering or unauthorized 
  substitution.
  - Training personnel to be aware of suspicious behavior and to report 
  tampering or unauthorized substitution of devices.
