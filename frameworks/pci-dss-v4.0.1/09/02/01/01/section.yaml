name: >
  9.2.1.1 Individual physical access to sensitive areas within the CDE 
  is monitored with either video cameras or physical access control mechanisms.
description: |-
  As follows:

  - Entry and exit points to/from sensitive areas within the CDE are monitored.
  - Monitoring devices or mechanisms are protected from tampering or disabling.
  - Collected data is reviewed and correlated with other entries.
  - Collected data is stored for at least three months, unless otherwise 
  restricted by law.
