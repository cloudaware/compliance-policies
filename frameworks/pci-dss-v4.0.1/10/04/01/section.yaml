name: >
  10.4.1 The audit logs are reviewed at least once daily.
description: |-
  The following logs:

  - All security events.
  - Logs of all system components that store, process, or transmit CHD and/or SAD.
  - Logs of all critical system components.
  - Logs of all servers and system components that perform security functions 
  (for example, network security controls, intrusion-detection 
  systems/intrusion-prevention systems (IDS/IPS), authentication servers).
