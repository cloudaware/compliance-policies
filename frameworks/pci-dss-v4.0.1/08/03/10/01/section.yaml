name: >
  8.3.10.1 If passwords/passphrases are used as the only authentication factor 
  for customer user access then either passwords/passphrases are changed at 
  least once every 90 days, or the security posture of accounts is 
  dynamically analyzed.
description: |-
  **Additional requirement for service providers only.**
