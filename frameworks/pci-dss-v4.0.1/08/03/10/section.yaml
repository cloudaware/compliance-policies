name: >
  8.3.10 If passwords/passphrases are used as the only authentication factor for 
  customer user access to cardholder data, then guidance is provided 
  to customer users.
description: |-
  **Additional requirement for service providers only.**

  Including:
  - Guidance for customers to change their user passwords/passphrases periodically.
  - Guidance as to when, and under what circumstances, passwords/passphrases 
  are to be changed.
