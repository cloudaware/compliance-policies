name: >
  12.4.1 Responsibility is established by executive management for the 
  protection of cardholder data and a PCI DSS compliance program.
description: |-
  **Additional requirement for service providers only.**
  
  Includes:

  - Overall accountability for maintaining PCI DSS compliance.
  - Defining a charter for a PCI DSS compliance program and communication 
  to executive management.
