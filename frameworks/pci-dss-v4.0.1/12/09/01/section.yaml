name: >
  12.9.1 TPSPs provide written agreements to customers that include 
  acknowledgments that TPSPs are responsible for the security of account data 
  the TPSP possesses or otherwise stores, processes, or transmits on behalf of 
  the customer, or to the extent that the TPSP could impact the security of the 
  customer's cardholder data and/or sensitive authentication data.
description: |-
  **Additional requirement for service providers only.**
