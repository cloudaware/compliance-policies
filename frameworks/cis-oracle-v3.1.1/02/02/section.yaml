name: 2.2 Ensure no security lists allow ingress from 0.0.0.0/0 to port 3389 - Level 1 (Automated)
description: >
  Security lists provide stateful and stateless filtering of ingress and egress
  network traffic to OCI resources on a subnet level. It is recommended that no
  security group allows unrestricted ingress access to port 3389.
