---
name: "5.2 Pod Security Policies"
description: "A Pod Security Policy (PSP) is a cluster-level resource that controls security settings for \
  \ pods. Your cluster may have multiple PSPs. You can query PSPs with the following \
  \ command: \
  \ kubectl get psp \
  \ PodSecurityPolicies are used in conjunction with the PodSecurityPolicy admission \
  \ controller plugin."
