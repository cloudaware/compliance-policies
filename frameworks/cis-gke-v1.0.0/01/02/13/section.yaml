---
name: "1.2.13 Ensure that the admission control plugin SecurityContextDeny is \
  \ set if PodSecurityPolicy is not used (Not Scored)"
description: "The SecurityContextDeny admission controller can be used to deny pods \
  \ which make use of some SecurityContext fields which could allow for privilege \
  \ escalation in the cluster. This should be used where PodSecurityPolicy is not \
  \ in place within the cluster."
