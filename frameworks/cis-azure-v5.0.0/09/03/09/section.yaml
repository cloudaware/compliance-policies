---
name: "9.3.9 Ensure Azure Resource Manager Delete locks are applied to Azure Storage Accounts (Manual)"
description: >
  Azure Resource Manager CannotDelete (Delete) locks can prevent users from 
  accidentally or maliciously deleting a storage account. This feature ensures that while 
  the Storage account can still be modified or used, deletion of the Storage account 
  resource requires removal of the lock by a user with appropriate permissions.

  This feature is a protective control for the availability of data. By ensuring that a storage 
  account or its parent resource group cannot be deleted without first removing the lock, 
  the risk of data loss is reduced.

  While an automated assessment procedure exists for this recommendation, the 
  assessment status remains manual. Determining storage accounts that require 
  CannotDelete locks depends on the context and requirements of each organization and 
  environment.
