---
name: "8.5 Ensure Azure DDoS Network Protection is enabled on virtual networks (Automated)"
description: >
  Azure DDoS Network Protection defends resources in virtual networks against 
  distributed denial-of-service (DDoS) attacks.

  While an automated assessment procedure exists for this recommendation, the 
  assessment status remains manual. Determining the appropriateness of enabling 
  Azure DDoS Network Protection depends on the context and requirements of each 
  organization and environment.
