---
name: "8.1.2.1 Ensure Microsoft Defender for APIs is set to 'On' (Automated)"
description: >
  Microsoft Defender for APIs offers full lifecycle protection, detection, and response 
  coverage for APIs.

  While an automated assessment procedure exists for this recommendation, the assessment 
  status remains manual. Due to its potentially high cost, Microsoft Defender for APIs 
  may not be suitable for all environments and should be evaluated carefully before 
  implementation.
