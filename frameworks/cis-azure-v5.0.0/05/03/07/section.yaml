---
name: "5.3.7 Ensure all non-privileged role assignments are periodically reviewed (Manual)"
description: >
  Perform a periodic review of non-privileged role assignments to ensure that the non-privileged 
  roles assigned to users are appropriate.

  Note: Determining 'appropriate' assignments requires a clear understanding of your organization's 
  personnel, systems, policies, and security requirements. This cannot be effectively prescribed in 
  a procedure.
