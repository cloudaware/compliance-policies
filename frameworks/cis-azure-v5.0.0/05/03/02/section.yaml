---
name: "5.3.2 Ensure that guest users are reviewed on a regular basis (Manual)"
description: >
  Microsoft Entra ID has native and extended identity functionality allowing you to invite people 
  from outside your organization to be guest users in your cloud account and sign in with their 
  own work, school, or social identities.

  While an automated assessment procedure exists for this recommendation, the assessment status 
  remains manual. Evaluating the appropriateness of guest users requires a manual review, as it 
  depends on the specific needs and context of each organization and environment.
