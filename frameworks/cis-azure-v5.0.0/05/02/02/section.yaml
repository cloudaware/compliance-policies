---
name: "5.2.2 Ensure that an exclusionary geographic Conditional Access policy is considered (Manual)"
description: >
  CAUTION: If these policies are created without first auditing and testing the result, misconfiguration 
  can potentially lock out administrators or create undesired access issues.

  Conditional Access Policies can be used to block access from geographic locations that are deemed 
  out-of-scope for your organization or application. The scope and variables for this policy should be 
  carefully examined and defined.
