---
name: "7.3 Ensure that UDP access from the Internet is evaluated and restricted (Automated)"
description: >
  Network security groups should be periodically evaluated for port misconfigurations. 
  Where UDP is not explicitly required and narrowly configured for resources attached to 
  a network security group, Internet-level access to Azure resources should be restricted 
  or eliminated.
