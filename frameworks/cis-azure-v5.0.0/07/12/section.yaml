---
name: "7.12 Ensure the SSL policy's 'Min protocol version' is set to 'TLSv1_2' or higher on Azure Application Gateway (Automated)"
description: >
  The TLS (Transport Layer Security) protocol secures the transmission of data over the 
  internet using standard encryption technology. Application gateways use TLS 1.2 for the 
  Min protocol version by default and allow for the use of TLS versions 1.0, 1.1, and 1.3. 
  NIST strongly suggests the use of TLS 1.2 and recommends the adoption of TLS 1.3.
