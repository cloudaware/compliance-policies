---
name: "7.7 Ensure that Public IP addresses are Evaluated on a Periodic Basis (Manual)"
description: >
  Public IP Addresses provide tenant accounts with Internet connectivity for resources 
  contained within the tenant. During the creation of certain resources in Azure, a Public 
  IP Address may be created. All Public IP Addresses within the tenant should be periodically 
  reviewed for accuracy and necessity.

  While an automated assessment procedure exists for this recommendation, the assessment status 
  remains manual. Evaluating the appropriateness of public IP addresses requires a manual review, 
  as it depends on the specific needs and context of each organization and environment.
