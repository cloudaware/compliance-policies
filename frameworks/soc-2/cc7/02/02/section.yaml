name: CC7.2-2 Designs Detection Measures
description: Detection measures are designed to identify anomalies that could result
  from actual or attempted (1) compromise of physical barriers; (2) unauthorized actions
  of authorized personnel; (3) use of compromised identification and authentication
  credentials; (4) unauthorized access from outside the system boundaries; (5) compromise
  of authorized external parties; and (6) implementation or connection of unauthorized
  hardware and software.
