---
name: >
  P2.1 The entity communicates choices available regarding the collection, use, 
  retention, disclosure, and disposal of personal information to the data 
  subjects and the consequences, if any, of each choice.
description: >
  Explicit consent for the collection, use, retention, disclosure, and disposal 
  of personal information is obtained from data subjects or other authorized 
  persons, if required. Such consent is obtained only for the intended purpose 
  of the information to meet the entity's objectives related to privacy. The 
  entity's basis for determining implicit consent for the collection, use, 
  retention, disclosure, and disposal of personal information is documented. 