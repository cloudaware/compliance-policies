---
name: PI1.1-3 Defines Information Necessary to Support the Use of a Good or Product
description: |-
  When information provided by the entity is needed to use the good or product in accordance
  with its specifications:

  1. The required information is available to the user of the good or product.

  2. The required information is clearly identifiable.

  3. The required information is validated for completeness and accuracy.
