---
name: >
  P5.2 The entity corrects, amends, or appends personal information based on 
  information provided by data subjects and communicates such information to 
  third parties, as committed or required, to meet the entity's objectives related to privacy.
description: >
  If a request for correction is denied, data subjects are informed of the denial 
  and reason for such denial to meet the entity's objectives related to privacy.