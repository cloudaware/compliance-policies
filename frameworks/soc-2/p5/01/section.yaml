---
name: >
  P5.1 The entity grants identified and authenticated data subjects the ability 
  to access their stored personal information for review and, upon request, 
  provides physical or electronic copies of that information to data subjects 
  to meet the entity's objectives related to privacy.
description: >
  If access is denied, data subjects are informed of the denial and reason for 
  such denial, as required, to meet the entity's objectives related to privacy.