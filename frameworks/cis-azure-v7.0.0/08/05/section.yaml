---
name: 8.5 Ensure Azure DDoS Protection is Enabled on Public IP Addresses (Automated)
description: A public IP address is covered by Azure DDoS Protection through IP Protection, enabled on
  the address, or Network Protection, inherited from its virtual network. Its protection mode is Enabled,
  VirtualNetworkInherited or Disabled. Addresses DDoS Protection does not support, such as those on a
  NAT gateway, are out of scope.
