---
name: 8.3.1.3 Ensure Keys in Azure Key Vault Premium are HSM-Protected (Automated)
description: A key in a Premium-tier key vault is software-protected, with key type RSA or EC, or HSM-protected,
  with key type RSA-HSM, EC-HSM, or oct-HSM. The key type chosen when each key is created selects between
  them. Keys that back certificates follow the certificate's key type and are out of scope.
