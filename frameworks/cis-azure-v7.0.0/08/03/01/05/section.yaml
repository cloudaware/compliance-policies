---
name: 8.3.1.5 Ensure 'Public Network Access' is 'Disabled' for Azure Key Vault Managed HSM (Automated)
description: 'A Managed HSM accepts data-plane connections from public networks, or only through private
  endpoints and trusted Microsoft services. The Public network access setting, Enabled or Disabled, selects
  between them. Prerequisites: Give every client that needs data-plane access an approved private endpoint
  with private DNS resolution before disabling public network access.'
