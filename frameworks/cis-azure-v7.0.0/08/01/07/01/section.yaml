name: 8.1.7.1 Ensure That Microsoft Defender for Azure Cosmos DB Is Set To 'On' (Automated)
description: Microsoft Defender for Azure Cosmos DB detects potential SQL injection attempts, known bad
  actors, and suspicious access patterns, and identifies potential exploitation of Azure Cosmos DB accounts
  through compromised identities or malicious insiders. It raises security alerts in Microsoft Defender
  for Cloud.
