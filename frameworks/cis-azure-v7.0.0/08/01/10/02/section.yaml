---
name: 8.1.10.2 Ensure that 'Suspicious prompt evidence' Component Status is Set to 'On' (Automated)
description: 'Microsoft Defender for AI Services alerts either include the suspicious segments of user
  prompts and model responses as evidence, with sensitive data redacted, or mask that content. The Enable
  user prompt evidence setting of the plan''s suspicious prompt evidence component selects between them,
  with values On and Off. Prerequisites: Complete the recommendation Ensure That Microsoft Defender for
  AI Services Is Set To ''On'' first, because this component can be configured only while the plan is
  on.'
