---
name: 8.4.2 Ensure 'Shareable Link' is Disabled on Azure Bastion Hosts (Automated)
description: Shareable Link lets anyone holding a Bastion-generated URL reach a virtual machine's RDP
  or SSH sign-in without signing in to the Azure portal. Each Standard or Premium Bastion host has Shareable
  Link Enabled or Disabled; Basic and Developer hosts lack the feature and are out of scope.
