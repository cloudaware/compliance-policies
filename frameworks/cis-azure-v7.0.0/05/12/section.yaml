---
name: 5.12 Ensure Role Assignment Management is Delegated with the 'Role Based Access Control Administrator'
  Role and Conditions (Automated)
description: 'Role assignment management is delegated through User Access Administrator, or through Role
  Based Access Control Administrator with or without a role assignment condition that limits the roles
  and principals the delegate can assign. Root-scope assignments are covered by ''Ensure That Use of the
  ''User Access Administrator'' Role is Restricted''. Prerequisites: Identify the roles and principal
  types each delegate assigns, including automation pipelines, so the condition does not block required
  assignments.'
