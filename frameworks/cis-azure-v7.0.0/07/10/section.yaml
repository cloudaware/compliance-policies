---
name: 7.10 Ensure Azure Web Application Firewall (WAF) is Enabled on Azure Front Door (Automated)
description: Azure Web Application Firewall (WAF) on Azure Front Door inspects incoming HTTP and HTTPS
  requests at the Microsoft network edge and blocks common exploits before they reach the origin. Ensure
  every domain served by an Azure Front Door Standard or Premium profile is associated with an enabled
  WAF policy.
