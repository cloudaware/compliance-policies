name: >
  11.2.2 Perform quarterly external vulnerability scans, 
  via an Approved Scanning Vendor (ASV) approved by 
  the Payment Card Industry Security Standards Council (PCI SSC).
description: |-
  Perform rescans as needed, until passing scans are achieved.

  Quarterly external vulnerability scans must be performed by an 
  Approved Scanning Vendor (ASV), approved by the Payment Card Industry 
  Security Standards Council (PCI SSC).
  
  Refer to the ASV Program Guide published on the PCI SSC website for scan 
  customer responsibilities, scan preparation, etc.
