---
name: >
  11.5 Deploy a change-detection mechanism to alert personnel to unauthorized 
  modification of critical system files, configuration files, or content files.
description: |-
  Configure the software to perform critical file comparisons at least weekly.

  For change-detection purposes, critical files are usually those that do not 
  regularly change, but the modification of which could indicate a system 
  compromise or risk of compromise. Change-detection mechanisms such as 
  file-integrity monitoring products usually come pre-configured with critical 
  files for the related operating system. Other critical files, such as those 
  for custom applications, must be evaluated and defined by the entity (that is, 
  the merchant or service provider).
