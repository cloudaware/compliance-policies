---
name: |-
  3.2.1 Do not store the full contents of any track after authorization.
description: |-
  This data is alternatively called full track, track, track 1, track 2, and 
  magnetic-stripe data.

  In the normal course of business, the following data elements from the 
  magnetic stripe may need to be retained:
  - The cardholder's name
  - Primary account number (PAN)
  - Expiration date
  - Service code
  
  To minimize risk, store only these data elements as needed for business.
