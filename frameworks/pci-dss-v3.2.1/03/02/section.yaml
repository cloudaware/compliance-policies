---
name: >
  3.2 Do not store sensitive authentication data after authorization (even if encrypted).
description: |-
  If sensitive authentication data is received, render all data unrecoverable 
  upon completion of the authorization process.

  It is permissible for issuers and companies that support issuing services to 
  store sensitive authentication data if:
  
  - There is a business justification and
  - The data is stored securely.
