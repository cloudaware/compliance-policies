---
name: |-
  3.5.3 Store secret and private keys used to encrypt/decrypt cardholder data in 
  one (or more) of the described forms at all times.
description: |-
  The forms includes:

  - Encrypted with a key-encrypting key that is at least as strong as the 
  data-encrypting key, and that is stored separately from the data-encrypting key
  - Within a secure cryptographic device (such as a hardware (host) security 
  module (HSM) or PTS-approved point-of-interaction device)
  - As at least two full-length key components or key shares, in accordance with 
  an industry-accepted method

  It is not required that public keys be stored in one of these forms.
