name: >
  3.5 Document and implement procedures to protect keys used to secure stored 
  cardholder data against disclosure and misuse.
description: |-
  This requirement applies to keys used to encrypt stored cardholder data, and 
  also applies to key-encrypting keys used to protect data-encrypting keys—such 
  key-encrypting keys must be at least as strong as the data-encrypting key.
