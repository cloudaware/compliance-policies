---
name: >
  3.6.5 Retirement or replacement of keys as deemed necessary when the integrity 
  of the key has been weakened, or keys are suspected of being compromised.
description: >
  If retired or replaced cryptographic keys need to be retained, these keys 
  must be securely archived (for example, by using a key-encryption key). 
  Archived cryptographic keys should only be used for decryption/verification 
  purposes.
