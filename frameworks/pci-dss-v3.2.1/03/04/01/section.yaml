---
name: >
  3.4.1 If disk encryption is used, logical access must be managed separately 
  and independently of native operating system authentication and access control 
  mechanisms.
description: |-
  Decryption keys must not be associated with user accounts.

  This requirement applies in addition to all other PCI DSS encryption and 
  key-management requirements.
