---
name: >
  9.9  Protect devices that capture payment card data via direct physical 
  interaction with the card from tampering and substitution.
description: >
  These requirements apply to card-reading devices used in card-present 
  transactions (that is, card swipe or dip) at the point of sale. This 
  requirement is not intended to apply to manual key-entry components such as 
  computer keyboards and POS keypads.
