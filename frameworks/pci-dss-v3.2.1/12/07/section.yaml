name: >
  12.7  Screen potential personnel prior to hire to minimize the risk of attacks 
  from internal sources.
description: |-
  Examples of background checks include previous employment history, criminal 
  record, credit history, and reference checks.

  For those potential personnel to be hired for certain positions such as store 
  cashiers who only have access to one card number at a time when facilitating 
  a transaction, this requirement is a recommendation only.
