name: >
  12.3.10 For personnel accessing cardholder data via remote-access technologies, 
  prohibit the copying, moving, and storage of cardholder data onto local 
  hard drives and removable electronic media, unless explicitly authorized for 
  a defined business need.
description: >
  Where there is an authorized business need, the usage policies must require 
  the data be protected in accordance with all applicable PCI DSS Requirements.
