name: 2.13 Ensure That Cloud DNS Logging Is Enabled for All VPC Networks - Level 1 (Automated)
description: >
  Cloud DNS logging records the queries from the name servers within your VPC to Stackdriver. Logged
  queries can come from Compute Engine VMs, GKE containers, or other GCP resources provisioned
  within the VPC.
