---
name: "COST07-BP01 Perform pricing model analysis"
description: |-
  Analyze each component of the workload. Determine if the component and resources 
  will be running for extended periods (for commitment discounts) or dynamic and 
  short-running (for spot or on-demand). Perform an analysis on the workload using 
  the recommendations in cost management tools and apply business rules to those 
  recommendations to achieve high returns.

  **Level of risk exposed if this best practice is not established:** High

  ## Implementation guidance

  AWS has multiple pricing models that allow you to pay for your resources in the most 
  cost-effective way that suits your organization’s needs and depending on product. 
  Work with your teams to determine the most appropriate pricing model. Often your 
  pricing model consists of a combination of multiple options, as determined by your 
  availability.

  **On-Demand Instances** allow you pay for compute or database capacity by the hour or 
  by the second (60 seconds minimum) depending on which instances you run, without 
  long-term commitments or upfront payments.

  **Savings Plans** are a flexible pricing model that offers low prices on Amazon EC2, 
  Lambda, and AWS Fargate usage, in exchange for a commitment to a consistent amount 
  of usage (measured in dollars per hour) over one year or three years terms.

  **Spot Instances** are an Amazon EC2 pricing mechanism that allows you request spare 
  compute capacity at discounted hourly rate (up to 90% off the on-demand price) 
  without upfront commitment.

  **Reserved Instances** allow you up to 75 percent discount by prepaying for capacity. 
  For more details, see Optimizing costs with reservations.

  You might choose to include a Savings Plans for the resources associated with the 
  production, quality, and development environments. Alternatively, because sandbox 
  resources are only powered on when needed, you might choose an on-demand model for 
  the resources in that environment. Use Amazon Spot Instances to reduce Amazon EC2 
  costs or use Compute Savings Plans to reduce Amazon EC2, Fargate, and Lambda cost. 
  The AWS Cost Explorer recommendations tool provides opportunities for commitment 
  discounts with Saving plans.

  If you have been purchasing Reserved Instances for Amazon EC2 in the past or have 
  established cost allocation practices inside your organization, you can continue 
  using Amazon EC2 Reserved Instances for the time being. However, we recommend 
  working on a strategy to use Savings Plans in the future as a more flexible cost 
  savings mechanism. You can refresh Savings Plans (SP) Recommendations in AWS Cost 
  Management to generate new Savings Plans Recommendations at any time. Use Reserved 
  Instances (RI) to reduce Amazon RDS, Amazon Redshift, Amazon ElastiCache, and 
  Amazon OpenSearch Service costs. Saving Plans and Reserved Instances are available 
  in three options: all upfront, partial upfront and no upfront payments. Use the 
  recommendations provided in AWS Cost Explorer RI and SP purchase recommendations.

  To find opportunities for Spot workloads, use an hourly view of your overall usage, 
  and look for regular periods of changing usage or elasticity. You can use Spot 
  Instances for various fault-tolerant and flexible applications. Examples include 
  stateless web servers, API endpoints, big data and analytics applications, 
  containerized workloads, CI/CD, and other flexible workloads.

  Analyze your Amazon EC2 and Amazon RDS instances whether they can be turned off 
  when you don’t use (after hours and weekends). This approach will allow you to 
  reduce costs by 70% or more compared to using them 24/7. If you have Amazon 
  Redshift clusters that only need to be available at specific times, you can pause 
  the cluster and later resume it. When the Amazon Redshift cluster or Amazon EC2 and 
  Amazon RDS Instance is stopped, the compute billing halts and only the storage 
  charge applies.

  Note that On-Demand Capacity reservations (ODCR) are not a pricing discount. 
  Capacity Reservations are charged at the equivalent On-Demand rate, whether you run 
  instances in reserved capacity or not. They should be considered when you need to 
  provide enough capacity for the resources you plan to run. ODCRs don't have to be 
  tied to long-term commitments, as they can be cancelled when you no longer need 
  them, but they can also benefit from the discounts that Savings Plans or Reserved 
  Instances provide.

  ### Implementation steps

  1. Analyze workload elasticity: Using the hourly granularity in Cost Explorer or a 
     custom dashboard, analyze your workload's elasticity. Look for regular changes 
     in the number of instances that are running. Short duration instances are 
     candidates for Spot Instances or Spot Fleet.

  2. Review existing pricing contracts: Review current contracts or commitments for 
     long term needs. Analyze what you currently have and how much those commitments 
     are in use. Leverage pre-existing contractual discounts or enterprise agreements. 
     Enterprise Agreements give customers the option to tailor agreements that best 
     suit their needs. For long term commitments, consider reserved pricing 
     discounts, Reserved Instances or Savings Plans for the specific instance type, 
     instance family, AWS Region, and Availability Zones.

  3. Perform a commitment discount analysis: Using Cost Explorer in your account, 
     review the Savings Plans and Reserved Instance recommendations.