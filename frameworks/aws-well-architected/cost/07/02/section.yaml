---
name: "COST07-BP02 Choose Regions based on cost"
description: |-
  Resource pricing may be different in each Region. Identify Regional cost differences 
  and only deploy in Regions with higher costs to meet latency, data residency and 
  data sovereignty requirements. Factoring in Region cost helps you pay the lowest 
  overall price for this workload.

  **Level of risk exposed if this best practice is not established:** Medium

  ## Implementation guidance

  The AWS Cloud Infrastructure is global, hosted in multiple locations world-wide, and 
  built around AWS Regions, Availability Zones, Local Zones, AWS Outposts, and 
  Wavelength Zones. A Region is a physical location in the world and each Region is a 
  separate geographic area where AWS has multiple Availability Zones. Availability 
  Zones, which are multiple isolated locations within each Region, consist of one or 
  more discrete data centers, each with redundant power, networking, and connectivity.

  Each AWS Region operates within local market conditions, and resource pricing is 
  different in each Region due to differences in the cost of land, fiber, electricity, 
  and taxes, for example. Choose a specific Region to operate a component of or your 
  entire solution so that you can run at the lowest possible price globally. Use AWS 
  Calculator to estimate the costs of your workload in various Regions by searching 
  services by location type (Region, Wavelength Zone, and Local Zone) and Region.

  When you architect your solutions, a best practice is to seek to place computing 
  resources closer to users to provide lower latency and strong data sovereignty. 
  Select the geographic location based on your business, data privacy, performance, 
  and security requirements. For applications with global end users, use multiple 
  locations.

  Use Regions that provide lower prices for AWS services to deploy your workloads if 
  you have no obligations in data privacy, security, and business requirements. For 
  example, if your default Region is Asia Pacific (Sydney) (ap-southwest-2), and if 
  there are no restrictions (data privacy, security, for example) to use other 
  Regions, deploying non-critical (development and test) Amazon EC2 instances in US 
  East (N. Virginia) (us-east-1) will cost you less.

  ### Implementation steps

  1. Review AWS Region pricing: Analyze the workload costs in the current Region. 
     Starting with the highest costs by service and usage type, calculate the costs in 
     other Regions that are available. If the forecasted saving outweighs the cost of 
     moving the component or workload, migrate to the new Region.

  2. Review requirements for multi-Region deployments: Analyze your business 
     requirements and obligations (data privacy, security, or performance) to find out 
     if there are any restrictions for you to not use multiple Regions. If there are 
     no obligations to restrict you to use a single Region, then use multiple Regions.

  3. Analyze required data transfer: Consider data transfer costs when selecting 
     Regions. Keep your data close to your customer and close to the resources. Select 
     less costly AWS Regions where data flows and where there is minimal data transfer. 
     Depending on your business requirements for data transfer, you can use Amazon 
     CloudFront, AWS PrivateLink, AWS Direct Connect, and AWS Virtual Private Network 
     to reduce your networking costs, improve performance, and enhance security.
