---
name: "COST04-BP05 Enforce data retention policies"
description: |-
  Define data retention policies on supported resources to handle object deletion
  per your organizations’ requirements. Identify and delete unnecessary or orphaned
  resources and objects that are no longer required.

  **Level of risk exposed if this best practice is not established:** Medium

  ## Implementation guidance

  Use data retention policies and lifecycle policies to reduce the associated costs
  of the decommissioning process and storage costs for the identified resources.
  Defining your data retention policies and lifecycle policies to perform automated
  storage class migration and deletion will reduce the overall storage costs during
  its lifetime. You can use Amazon Data Lifecycle Manager to automate the creation
  and deletion of Amazon Elastic Block Store snapshots and Amazon EBS-backed Amazon
  Machine Images (AMIs), and use Amazon S3 Intelligent-Tiering or an Amazon S3
  lifecycle configuration to manage the lifecycle of your Amazon S3 objects. You can
  also implement custom code using the API or SDK to create lifecycle policies and
  policy rules for objects to be deleted automatically.

  ### Implementation steps

  1. Use Amazon Data Lifecycle Manager: Use lifecycle policies on Amazon Data
     Lifecycle Manager to automate deletion of Amazon EBS snapshots and
     Amazon EBS-backed AMIs.

  2. Set up lifecycle configuration on a bucket: Use Amazon S3 lifecycle
     configuration on a bucket to define actions for Amazon S3 to take during an
     object's lifecycle, including automatic deletion at the end of the object's
     lifecycle, based on your business requirements.
