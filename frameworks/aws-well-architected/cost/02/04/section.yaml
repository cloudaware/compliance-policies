---
name: "COST02-BP04 Implement groups and roles"
description: |-
  Implement groups and roles that align to your policies and control who can create,
  modify, or decommission instances and resources in each group. For example,
  implement development, test, and production groups. This applies to AWS services
  and third-party solutions.

  **Level of risk exposed if this best practice is not established:** Low

  ## Implementation guidance

  User roles and groups are fundamental building blocks in the design and
  implementation of secure and efficient systems. Roles and groups help
  organizations balance the need for control with the requirement for flexibility
  and productivity, ultimately supporting organizational objectives and user needs.
  As recommended in Identity and access management section of AWS Well-Architected
  Framework Security Pillar, you need robust identity management and permissions in
  place to provide access to the right resources for the right people under the
  right conditions. Users receive only the access necessary to complete their tasks.
  This minimizes the risk associated with unauthorized access or misuse.

  After you develop policies, you can create logical groups and user roles within
  your organization. This allows you to assign permissions, control usage, and help
  implement robust access control mechanisms, preventing unauthorized access to
  sensitive information. Begin with high-level groupings of people. Typically, this
  aligns with organizational units and job roles (for example, a systems
  administrator in the IT Department, financial controller, or business analysts).
  The groups categorize people that do similar tasks and need similar access. Roles
  define what a group must do. It is easier to manage permissions for groups and
  roles than for individual users. Roles and groups assign permissions consistently
  and systematically across all users, preventing errors and inconsistencies.

  When a user’s role changes, administrators can adjust access at the role or group
  level, rather than reconfiguring individual user accounts. For example, a systems
  administrator in IT requires access to create all resources, but an analytics team
  member only needs to create analytics resources.

  ### Implementation steps

  1. Implement groups: Using the groups of users defined in your organizational
     policies, implement the corresponding groups, if necessary. For best practices
     on users, groups and authentication, see the Security Pillar of the AWS
     Well-Architected Framework.

  2. Implement roles and policies: Using the actions defined in your organizational
     policies, create the required roles and access policies. For best practices on
     roles and policies, see the Security Pillar of the AWS Well-Architected Framework.
