---
name: "COST06-BP01 Perform cost modeling"
description: |-
  Identify organization requirements (such as business needs and existing 
  commitments) and perform cost modeling (overall costs) of the workload and 
  each of its components. Perform benchmark activities for the workload under 
  different predicted loads and compare the costs. The modeling effort should 
  reflect the potential benefit. For example, time spent is proportional to 
  component cost.

  **Level of risk exposed if this best practice is not established:** High

  ## Implementation guidance

  Perform cost modelling for your workload and each of its components to 
  understand the balance between resources, and find the correct size for each 
  resource in the workload, given a specific level of performance. Understanding 
  cost considerations can inform your organizational business case and decision-
  making process when evaluating the value realization outcomes for planned 
  workload deployment.

  Perform benchmark activities for the workload under different predicted loads 
  and compare the costs. The modelling effort should reflect potential benefit; 
  for example, time spent is proportional to component cost or predicted saving. 
  For best practices, refer to the Review section of the Performance Efficiency 
  Pillar of the AWS Well-Architected Framework.

  As an example, to create cost modeling for a workload consisting of compute 
  resources, AWS Compute Optimizer can assist with cost modelling for running 
  workloads. It provides right-sizing recommendations for compute resources 
  based on historical usage. Make sure CloudWatch Agents are deployed to the 
  Amazon EC2 instances to collect memory metrics which help you with more accurate 
  recommendations within AWS Compute Optimizer. This is the ideal data source 
  for compute resources because it is a free service that uses machine learning 
  to make multiple recommendations depending on levels of risk.

  There are multiple services you can use with custom logs as data sources for 
  rightsizing operations for other services and workload components, such as AWS 
  Trusted Advisor, Amazon CloudWatch and Amazon CloudWatch Logs. AWS Trusted 
  Advisor checks resources and flags resources with low utilization which can 
  help you right size your resources and create cost modelling.

  The following are recommendations for cost modelling data and metrics:

  - The monitoring must accurately reflect the user experience. Select the 
    correct granularity for the time period and thoughtfully choose the maximum 
    or 99th percentile instead of the average.
  - Select the correct granularity for the time period of analysis that is 
    required to cover any workload cycles. For example, if a two-week analysis 
    is performed, you might be overlooking a monthly cycle of high utilization, 
    which could lead to under-provisioning.
  - Choose the right AWS services for your planned workload by considering your 
    existing commitments, selected pricing models for other workloads, and 
    ability to innovate faster and focus on your core business value.

  ### Implementation steps

  - Perform cost modeling for resources: Deploy the workload or a proof of 
     concept into a separate account with the specific resource types and sizes 
     to test. Run the workload with the test data and record the output results, 
     along with the cost data for the time the test was run. Afterwards, redeploy 
     the workload or change the resource types and sizes and run the test again. 
     Include license fees of any products you may use with these resources and 
     estimated operations (labor or engineer) costs for deploying and managing 
     these resources while creating cost modeling. Consider cost modeling for a 
     period (hourly, daily, monthly, yearly or three years).
