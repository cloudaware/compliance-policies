---
name: "Manage demand and supply resources"
description: >
  When you move to the cloud, you pay only for what you need. You can supply resources 
  to match the workload demand at the time they’re needed — eliminating the need 
  for costly and wasteful overprovisioning. You can also modify the demand using 
  a throttle, buffer, or queue to smooth the demand and serve it with less resources.