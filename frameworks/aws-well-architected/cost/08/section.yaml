---
name: "Plan for data transfer"
description: >
  An advantage of the cloud is that it is a managed network service. There is no 
  longer the need to manage and operate a fleet of switches, routers, and other 
  associated network equipment. Networking resources in the cloud are consumed 
  and paid for in the same way you pay for CPU and storage, you only pay for what 
  you use. Efficient use of networking resources is required for cost optimization 
  in the cloud.