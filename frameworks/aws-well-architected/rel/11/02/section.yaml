---
name: "REL11-BP02 Fail over to healthy resources"
description: |-
  If a resource failure occurs, healthy resources should continue to serve requests. 
  For location impairments (such as Availability Zone or AWS Region), ensure that you 
  have systems in place to fail over to healthy resources in unimpaired locations.

  When designing a service, distribute load across resources, Availability Zones, or 
  Regions. Therefore, failure of an individual resource or impairment can be mitigated 
  by shifting traffic to remaining healthy resources. Consider how services are discovered 
  and routed to in the event of a failure.

  Design your services with fault recovery in mind. At AWS, we design services to minimize 
  the time to recover from failures and impact on data. Our services primarily use data 
  stores that acknowledge requests only after they are durably stored across multiple 
  replicas within a Region. They are constructed to use cell-based isolation and use 
  the fault isolation provided by Availability Zones. We use automation extensively in 
  our operational procedures. We also optimize our replace-and-restart functionality to 
  recover quickly from interruptions.

  The patterns and designs that allow for the failover vary for each AWS platform service. 
  Many AWS native managed services are natively multiple Availability Zone (like Lambda 
  or API Gateway). Other AWS services (like EC2 and EKS) require specific best practice 
  designs to support failover of resources or data storage across AZs.

  Monitoring should be set up to check that the failover resource is healthy, track the 
  progress of the resources failing over, and monitor business process recovery.

  **Desired outcome:** Systems are capable of automatically or manually using new 
  resources to recover from degradation.

  **Common anti-patterns:**

  - Planning for failure is not part of the planning and design phase.
  - RTO and RPO are not established.
  - Insufficient monitoring to detect failing resources.
  - Proper isolation of failure domains.
  - Multi-Region fail over is not considered.
  - Detection for failure is too sensitive or aggressive when deciding to failover.
  - Not testing or validating failover design.
  - Performing auto healing automation, but not notifying that healing was needed.
  - Lack of dampening period to avoid failing back too soon.

  **Benefits of establishing this best practice:** You can build more resilient systems 
  that maintain reliability when experiencing failures by degrading gracefully and recovering 
  quickly.

  **Level of risk exposed if this best practice is not established:** High

  ## Implementation guidance

  AWS services, such as Elastic Load Balancing and Amazon EC2 Auto Scaling, help 
  distribute load across resources and Availability Zones. Therefore, failure of an 
  individual resource (such as an EC2 instance) or impairment of an Availability Zone 
  can be mitigated by shifting traffic to remaining healthy resources.

  For multi-Region workloads, designs are more complicated. For example, cross-Region 
  read replicas allow you to deploy your data to multiple AWS Regions. However, failover 
  is still required to promote the read replica to primary and then point your traffic 
  to the new endpoint. Amazon Route 53, Amazon Application Recovery Controller (ARC), 
  Amazon CloudFront, and AWS Global Accelerator can help route traffic across AWS Regions.

  AWS services, such as Amazon S3, Lambda, API Gateway, Amazon SQS, Amazon SNS, Amazon 
  SES, Amazon Pinpoint, Amazon ECR, AWS Certificate Manager, EventBridge, or Amazon 
  DynamoDB, are automatically deployed to multiple Availability Zones by AWS. In case 
  of failure, these AWS services automatically route traffic to healthy locations. Data 
  is redundantly stored in multiple Availability Zones and remains available.

  For Amazon RDS, Amazon Aurora, Amazon Redshift, Amazon EKS, or Amazon ECS, Multi-AZ 
  is a configuration option. AWS can direct traffic to the healthy instance if failover 
  is initiated. This failover action may be taken by AWS or as required by the customer.

  For Amazon EC2 instances, Amazon Redshift, Amazon ECS tasks, or Amazon EKS pods, you 
  choose which Availability Zones to deploy to. For some designs, Elastic Load Balancing 
  provides the solution to detect instances in unhealthy zones and route traffic to the 
  healthy ones. Elastic Load Balancing can also route traffic to components in your 
  on-premises data center.

  For Multi-Region traffic failover, rerouting can leverage Amazon Route 53, Amazon 
  Application Recovery Controller, AWS Global Accelerator, Route 53 Private DNS for VPCs, 
  or CloudFront to provide a way to define internet domains and assign routing policies, 
  including health checks, to route traffic to healthy Regions. AWS Global Accelerator 
  provides static IP addresses that act as a fixed entry point to your application, then 
  route to endpoints in AWS Regions of your choosing, using the AWS global network instead 
  of the internet for better performance and reliability.

  ### Implementation steps

  - Create failover designs for all appropriate applications and services. Isolate each 
    architecture component and create failover designs meeting RTO and RPO for each 
    component.
  - Configure lower environments (like development or test) with all services that are 
    required to have a failover plan. Deploy the solutions using infrastructure as code 
    (IaC) to ensure repeatability.
  - Configure a recovery site such as a second Region to implement and test the failover 
    designs. If necessary, resources for testing can be configured temporarily to limit 
    additional costs.
  - Determine which failover plans are automated by AWS, which can be automated by a 
    DevOps process, and which might be manual. Document and measure each service's RTO 
    and RPO.
  - Create a failover playbook and include all steps to failover each resource, application, 
    and service.
  - Create a failback playbook and include all steps to failback (with timing) each 
    resource, application, and service.
  - Create a plan to initiate and rehearse the playbook. Use simulations and chaos testing 
    to test the playbook steps and automation.
  - For location impairment (such as Availability Zone or AWS Region), ensure you have 
    systems in place to fail over to healthy resources in unimpaired locations. Check 
    quota, autoscaling levels, and resources running before failover testing.
