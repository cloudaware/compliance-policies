---
name: "REL11-BP03 Automate healing on all layers"
description: |-
  Upon detection of a failure, use automated capabilities to perform actions to remediate. 
  Degradations may be automatically healed through internal service mechanisms or require 
  resources to be restarted or removed through remediation actions.

  For self-managed applications and cross-Region healing, recovery designs and automated 
  healing processes can be pulled from existing best practices.

  The ability to restart or remove a resource is an important tool to remediate failures. 
  A best practice is to make services stateless where possible. This prevents loss of data 
  or availability on resource restart. In the cloud, you can (and generally should) replace 
  the entire resource (for example, a compute instance or serverless function) as part of 
  the restart. The restart itself is a simple and reliable way to recover from failure. 
  Many different types of failures occur in workloads. Failures can occur in hardware, 
  software, communications, and operations.

  Restarting or retrying also applies to network requests. Apply the same recovery approach 
  to both a network timeout and a dependency failure where the dependency returns an error. 
  Both events have a similar effect on the system, so rather than attempting to make either 
  event a special case, apply a similar strategy of limited retry with exponential backoff 
  and jitter. Ability to restart is a recovery mechanism featured in recovery-oriented 
  computing and high availability cluster architectures.

  **Desired outcome:** Automated actions are performed to remediate detection of a failure.

  **Common anti-patterns:**

  - Provisioning resources without autoscaling.
  - Deploying applications in instances or containers individually.
  - Deploying applications that cannot be deployed into multiple locations without using 
    automatic recovery.
  - Manually healing applications that automatic scaling and automatic recovery fail to 
    heal.
  - No automation to failover databases.
  - Lack automated methods to reroute traffic to new endpoints.
  - No storage replication.

  **Benefits of establishing this best practice:** Automated healing can reduce your mean 
  time to recovery and improve your availability.

  **Level of risk exposed if this best practice is not established:** High

  ## Implementation guidance

  Designs for Amazon EKS or other Kubernetes services should include both minimum and 
  maximum replica or stateful sets and the minimum cluster and node group sizing. These 
  mechanisms provide a minimum amount of continually-available processing resources while 
  automatically remediating any failures using the Kubernetes control plane.

  Design patterns that are accessed through a load balancer using compute clusters should 
  leverage Auto Scaling groups. Elastic Load Balancing (ELB) automatically distributes 
  incoming application traffic across multiple targets and virtual appliances in one or 
  more Availability Zones (AZs).

  Clustered compute-based designs that do not use load balancing should have their size 
  designed for loss of at least one node. This will allow for the service to maintain 
  itself running in potentially reduced capacity while it's recovering a new node. Example 
  services are Mongo, DynamoDB Accelerator, Amazon Redshift, Amazon EMR, Cassandra, Kafka, 
  MSK-EC2, Couchbase, ELK, and Amazon OpenSearch Service. Many of these services can be 
  designed with additional auto healing features. Some cluster technologies must generate 
  an alert upon the loss a node triggering an automated or manual workflow to recreate a 
  new node. This workflow can be automated using AWS Systems Manager to remediate issues 
  quickly.

  Amazon EventBridge can be used to monitor and filter for events such as CloudWatch 
  alarms or changes in state in other AWS services. Based on event information, it can then 
  invoke AWS Lambda, Systems Manager Automation, or other targets to run custom remediation 
  logic on your workload. Amazon EC2 Auto Scaling can be configured to check for EC2 
  instance health. If the instance is in any state other than running, or if the system 
  status is impaired, Amazon EC2 Auto Scaling considers the instance to be unhealthy and 
  launches a replacement instance. For large-scale replacements (such as the loss of an 
  entire Availability Zone), static stability is preferred for high availability.

  ### Implementation steps

  - Use Auto Scaling groups to deploy tiers in a workload. Auto Scaling can perform self-healing 
    on stateless applications and add or remove capacity.

  - For compute instances noted previously, use load balancing and choose the appropriate 
    type of load balancer.

  - Consider healing for Amazon RDS. With standby instances, configure for auto failover 
    to the standby instance. For Amazon RDS Read Replica, automated workflow is required 
    to make a read replica primary.

  - Implement automatic recovery on EC2 instances that have applications deployed that 
    cannot be deployed in multiple locations, and can tolerate rebooting upon failures. 
    Automatic recovery can be used to replace failed hardware and restart the instance 
    when the application is not capable of being deployed in multiple locations. The instance 
    metadata and associated IP addresses are kept, as well as the EBS volumes and mount 
    points to Amazon Elastic File System or File Systems for Lustre and Windows. Using 
    AWS OpsWorks, you can configure automatic healing of EC2 instances at the layer level.

  - Implement automated recovery using AWS Step Functions and AWS Lambda when you cannot 
    use automatic scaling or automatic recovery, or when automatic recovery fails. When 
    you cannot use automatic scaling, and either cannot use automatic recovery or automatic 
    recovery fails, you can automate the healing using AWS Step Functions and AWS Lambda.
    
  - Amazon EventBridge can be used to monitor and filter for events such as CloudWatch 
    alarms or changes in state in other AWS services. Based on event information, it can 
    then invoke AWS Lambda (or other targets) to run custom remediation logic on your workload.
