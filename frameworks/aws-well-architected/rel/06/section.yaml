---
name: "Monitor workload resources"
description: |-
  Logs and metrics are powerful tools to gain insight into the health of your workload. 
  You can configure your workload to monitor logs and metrics and send notifications 
  when thresholds are crossed or significant events occur. Monitoring allows your 
  workload to recognize when low-performance thresholds are crossed or failures 
  occur, so it can recover automatically in response.