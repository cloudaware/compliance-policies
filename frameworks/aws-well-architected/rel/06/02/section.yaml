---
name: "REL06-BP02 Define and calculate metrics (Aggregation)"
description: |-
  Collect metrics and logs from your workload components and calculate relevant aggregate 
  metrics from them. These metrics provide broad and deep observability of your workload 
  and can significantly improve your resilience posture.

  Observability is more than just collecting metrics from workload components and being 
  able to view and alert on them. It's about having a holistic understanding about your 
  workload's behavior. This behavioral information comes from all components in your 
  workloads, which includes the cloud services on which they depend, well-crafted logs, 
  and metrics. This data gives you oversight on your workload's behavior as a whole, as 
  well as an understanding of every component's interaction with every unit of work at 
  a fine level of detail.

  **Desired outcome**

  - You collect logs from your workload components and AWS service dependencies, and 
    you publish them to a central location where they can be easily accessed and 
    processed.
  - Your logs contain high-fidelity and accurate timestamps.
  - Your logs contain relevant information about the processing context, such as a 
    trace identifier, user or account identifier, and remote IP address.
  - You create aggregate metrics from your logs that represent your workload's behavior 
    from a high-level perspective.
  - You are able to query your aggregated logs to gain deep and relevant insights about 
    your workload and identify actual and potential problems.

  **Common anti-patterns**

  - You don't collect relevant logs or metrics from the compute instances your workloads 
    run on or the cloud services they use.
  - You overlook the collection of logs and metrics related to your business key 
    performance indicators (KPIs).
  - You analyze workload-related telemetry in isolation without aggregation and 
    correlation.
  - You allow metrics and logs to expire too quickly, which hinders trend analysis and 
    recurring issue identification.

  **Benefits of establishing these best practices**

  You can detect more anomalies and correlate events and metrics between different 
  components of your workload. You can create insights from your workload components 
  based on information contained in logs that frequently aren't available in metrics 
  alone. You can determine causes of failure more quickly by querying your logs at scale.

  **Level of risk exposed if these best practices are not established:** High

  ## Implementation guidance

  Identify the sources of telemetry data that are relevant for your workloads and their 
  components. This data comes not only from components that publish metrics, such as 
  your operating system (OS) and application runtimes such as Java, but also from 
  application and cloud service logs. For example, web servers typically log each 
  request with detailed information such as the timestamp, processing latency, user ID, 
  remote IP address, path, and query string. The level of detail in these logs helps 
  you perform detailed queries and generate metrics that may not have been otherwise 
  available.

  Collect the metrics and logs using appropriate tools and processes. Logs generated by 
  applications running on Amazon EC2 instance can be collected by an agent such as the 
  Amazon CloudWatch Agent and published to a central storage service such as Amazon 
  CloudWatch Logs. AWS-managed compute services such as AWS Lambda and Amazon Elastic 
  Container Service publish logs to CloudWatch Logs for you automatically. Enable log 
  collection for AWS storage and processing services used by your workloads such as 
  Amazon CloudFront, Amazon S3, Elastic Load Balancing, and Amazon API Gateway.

  Enrich your telemetry data with dimensions that can help you see behavioral patterns 
  more clearly and isolate correlated problems to groups of related components. Once 
  added, you can observe component behavior at a finer level of detail, detect 
  correlated failures, and take appropriate remedial steps. Examples of useful 
  dimensions include Availability Zone, EC2 instance ID, and container task or Pod ID.

  Once you have collected the metrics and logs, you can write queries and generate 
  aggregate metrics from them that provide useful insights into both normal and 
  anomalous behavior. For example, you can use Amazon CloudWatch Logs Insights to derive 
  custom metrics from your application logs, Amazon CloudWatch Metrics Insights to query 
  your metrics at scale, Amazon CloudWatch Container Insights to collect, aggregate and 
  summarize metrics and logs from your containerized applications and microservices, 
  or Amazon CloudWatch Lambda Insights if you're using AWS Lambda functions. To create 
  an aggregate error rate metric, you can increment a counter each time an error 
  response or message is found in your component logs or calculate the aggregate value 
  of an existing error rate metric. You can use this data to generate histograms that 
  show tail behavior, such as the worst-performing requests or processes. You can also 
  scan this data in real time for anomalous patterns using solutions such as CloudWatch 
  Logs anomaly detection. These insights can be placed on dashboards to keep them 
  organized according to your needs and preferences.

  Querying logs can help you understand how specific requests were handled by your 
  workload components and reveal request patterns or other context that has an impact 
  on your workload's resilience. It can be useful to research and prepare queries in 
  advance, based on your knowledge of how your applications and other components 
  behave, so you can more easily run them as needed. For example, with CloudWatch Logs 
  Insights, you can interactively search and analyze your log data stored in CloudWatch 
  Logs. You can also use Amazon Athena to query logs from multiple sources, including 
  many AWS services, at petabyte scale.

  When you define a log retention policy, consider the value of historical logs. 
  Historical logs can help identify long-term usage and behavioral patterns, 
  regressions, and improvements in your workload's performance. Permanently deleted logs 
  cannot be analyzed later. However, the value of historical logs tends to diminish 
  over long periods of time. Choose a policy that balances your needs as appropriate 
  and is compliant with any legal or contractual requirements you might be subject to.

  ### Implementation steps

  1. Choose collection, storage, analysis, and display mechanisms for your observability 
     data.

  2. Install and configure metric and log collectors on the appropriate components of 
     your workload (for example, on Amazon EC2 instances and in sidecar containers). 
     Configure these collectors to restart automatically if they unexpectedly stop. 
     Enable disk or memory buffering for the collectors so that temporary publication 
     failures don't impact your applications or result in lost data.

  3. Enable logging on AWS services you use as a part of your workloads, and forward 
     those logs to the storage service you selected if needed. Refer to the respective 
     services' user or developer guides for detailed instructions.

  4. Define the operational metrics relevant to your workloads that are based on your 
     telemetry data. These could be based on direct metrics emitted from your workload 
     components, which can include business KPI related metrics, or the results of 
     aggregated calculations such as sums, rates, percentiles, or histograms. 
     Calculate these metrics using your log analyzer, and place them on dashboards as 
     appropriate.

  5. Prepare appropriate log queries to analyze workload components, requests, or 
     transaction behavior as needed.
     
  6. Define and enable a log retention policy for your component logs. Periodically 
     delete logs when they become older than the policy permits.
