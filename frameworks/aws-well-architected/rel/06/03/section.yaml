name: "REL06-BP03 Send notifications (Real-time processing and alarming)"
description: |-
  When organizations detect potential issues, they send real-time notifications and 
  alerts to the appropriate personnel and systems in order to respond quickly and 
  effectively to these issues.

  **Desired outcome**

  Rapid responses to operational events are possible through configuration of relevant 
  alarms based on service and application metrics. When alarm thresholds are breached, 
  the appropriate personnel and systems are notified so they can address underlying 
  issues.

  **Common anti-patterns**

  - Configuring alarms with an excessively high threshold, resulting in the failure to 
    send vital notifications.
  - Configuring alarms with a threshold that is too low, resulting in inaction on 
    important alerts due to the noise of excessive notifications.
  - Not updating alarms and their threshold when usage changes.
  - For alarms best addressed through automated actions, sending the notification to 
    personnel instead of generating the automated action results in excessive 
    notifications being sent.

  **Benefits of establishing this best practice**

  Sending real-time notifications and alerts to the appropriate personnel and systems 
  allows for early detection of issues and rapid responses to operational incidents.

  **Level of risk exposed if this best practice is not established:** High

  ## Implementation guidance

  Workloads should be equipped with real-time processing and alarming to improve the 
  detectability of issues that could impact the availability of the application and 
  serve as triggers for automated response. Organizations can perform real-time 
  processing and alarming by creating alerts with defined metrics in order to receive 
  notifications whenever significant events occur or a metric exceeds a threshold.

  Amazon CloudWatch allows you to create metric and composite alarms using CloudWatch 
  alarms based on static threshold, anomaly detection, and other criteria. For more 
  detail on the types of alarms you can configure using CloudWatch, see the alarms 
  section of the CloudWatch documentation.

  You can construct customized views of metrics and alerts of your AWS resources for 
  your teams using CloudWatch dashboards. The customizable home pages in the CloudWatch 
  console allow you to monitor your resources in a single view across multiple Regions.

  Alarms can perform one or more actions, like sending a notification to an Amazon SNS 
  topic, performing an Amazon EC2 action or an Amazon EC2 Auto Scaling action, or 
  creating an OpsItem or incident in AWS Systems Manager.

  Amazon CloudWatch uses Amazon SNS to send notifications when the alarm changes state, 
  providing message delivery from the publishers (producers) to the subscribers 
  (consumers).

  CloudWatch sends EventBridge events whenever a CloudWatch alarm is created, updated, 
  deleted, or its state changes. You can use EventBridge with these events to create 
  rules that perform actions, such as notifying you whenever the state of an alarm 
  changes or automatically triggering events in your account using Systems Manager 
  automation.

  Stay informed with AWS Health. AWS Health is the authoritative source of information 
  about the health of your AWS Cloud resources. Use AWS Health to get notified of any 
  confirmed service events so you can quickly take steps to mitigate any impact. Create 
  purpose-fit AWS Health event notifications to e-mail and chat channels through AWS 
  User Notifications and integrate programmatically with your monitoring and alerting 
  tools through Amazon EventBridge. If you use AWS Organizations, aggregate AWS Health 
  events across accounts.

  **When should you use EventBridge or Amazon SNS?**

  Both EventBridge and Amazon SNS can be used to develop event-driven applications, and 
  your choice will depend on your specific needs.

  Amazon EventBridge is recommended when you want to build an application that reacts 
  to events from your own applications, SaaS applications, and AWS services. EventBridge 
  is the only event-based service that integrates directly with third-party SaaS 
  partners. EventBridge also automatically ingests events from over 200 AWS services 
  without requiring developers to create any resources in their account.

  EventBridge uses a defined JSON-based structure for events, and helps you create rules 
  that are applied across the entire event body to select events to forward to a target. 
  EventBridge currently supports over 20 AWS services as targets, including AWS Lambda, 
  Amazon SQS, Amazon SNS, Amazon Kinesis Data Streams, and Amazon Data Firehose.

  Amazon SNS is recommended for applications that need high fan out (thousands or 
  millions of endpoints). A common pattern we see is that customers use Amazon SNS as a 
  target for their rule to filter the events that they need, and fan out to multiple 
  endpoints.

  Messages are unstructured and can be in any format. Amazon SNS supports forwarding 
  messages to six different types of targets, including Lambda, Amazon SQS, HTTP/S 
  endpoints, SMS, mobile push, and email. Amazon SNS typical latency is under 30 
  milliseconds. A wide range of AWS services send Amazon SNS messages by configuring 
  the service to do so (more than 30, including Amazon EC2, Amazon S3, and Amazon RDS).

  ### Implementation steps

  1. Create an alarm using Amazon CloudWatch alarms.

      - A metric alarm monitors a single CloudWatch metric or an expression dependent on 
      CloudWatch metrics. The alarm initiates one or more actions based on the value of 
      the metric or expression in comparison to a threshold over a number of time 
      intervals. The action may consist of sending a notification to an Amazon SNS topic, 
      performing an Amazon EC2 action or an Amazon EC2 Auto Scaling action, or creating 
      an OpsItem or incident in AWS Systems Manager.

      - A composite alarm consists of a rule expression that considers the alarm conditions 
      of other alarms you've created. The composite alarm only enters alarm state if all 
      rule conditions are met. The alarms specified in the rule expression of a composite 
      alarm can include metric alarms and additional composite alarms. Composite alarms 
      can send Amazon SNS notifications when their state changes and can create Systems 
      Manager OpsItems or incidents when they enter the alarm state, but they cannot 
      perform Amazon EC2 or Auto Scaling actions.

  2. Set up Amazon SNS notifications. When creating a CloudWatch alarm, you can include 
     an Amazon SNS topic to send a notification when the alarm changes state.

  3. Create rules in EventBridge that matches specified CloudWatch alarms. Each rule 
     supports multiple targets, including Lambda functions. For example, you can define 
     an alarm that initiates when available disk space is running low, which triggers a 
     Lambda function through an EventBridge rule, to clean up the space.