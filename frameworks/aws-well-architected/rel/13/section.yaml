---
name: "Plan for Disaster Recovery (DR)"
description: |-
  Having backups and redundant workload components in place is the start of your 
  DR strategy. RTO and RPO are your objectives for restoration of your workload. 
  Set these based on business needs. Implement a strategy to meet these objectives, 
  considering locations and function of workload resources and data. The probability 
  of disruption and cost of recovery are also key factors that help to inform the 
  business value of providing disaster recovery for a workload.