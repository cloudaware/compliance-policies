---
name: "Manage service quotas and constraints"
description: |-
  For cloud-based workload architectures, there are service quotas (which are 
  also referred to as service limits). These quotas exist to prevent accidentally 
  provisioning more resources than you need and to limit request rates on API 
  operations so as to protect services from abuse. There are also resource constraints, 
  for example, the rate that you can push bits down a fiber-optic cable, or the 
  amount of storage on a physical disk.