---
name: "REL04-BP02 Implement loosely coupled dependencies"
description: |-
  Dependencies such as queuing systems, streaming systems, workflows, and load 
  balancers are loosely coupled. Loose coupling helps isolate behavior of a 
  component from other components that depend on it, increasing resiliency and 
  agility.

  Decoupling dependencies, such as queuing systems, streaming systems, and 
  workflows, help minimize the impact of changes or failure on a system. This 
  separation isolates a component's behavior from affecting others that depend on 
  it, improving resilience and agility.

  In tightly coupled systems, changes to one component can necessitate changes in 
  other components that rely on it, resulting in degraded performance across all 
  components. Loose coupling breaks this dependency so that dependent components 
  only need to know the versioned and published interface. Implementing loose 
  coupling between dependencies isolates a failure in one from impacting another.

  Loose coupling allows you to modify code or add features to a component while 
  minimizing risk to other components that depend on it. It also allows for 
  granular resilience at a component level where you can scale out or even change 
  underlying implementation of the dependency.

  To further improve resiliency through loose coupling, make component 
  interactions asynchronous where possible. This model is suitable for any 
  interaction that does not need an immediate response and where an acknowledgment 
  that a request has been registered will suffice. It involves one component that 
  generates events and another that consumes them. The two components do not 
  integrate through direct point-to-point interaction but usually through an 
  intermediate durable storage layer, such as an Amazon SQS queue, a streaming 
  data platform such as Amazon Kinesis, or AWS Step Functions.

  Amazon SQS queues and AWS Step Functions are just two ways to add an 
  intermediate layer for loose coupling. Event-driven architectures can also be 
  built in the AWS Cloud using Amazon EventBridge, which can abstract clients 
  (event producers) from the services they rely on (event consumers). Amazon 
  Simple Notification Service (Amazon SNS) is an effective solution when you need 
  high-throughput, push-based, many-to-many messaging. Using Amazon SNS topics, 
  your publisher systems can fan out messages to a large number of subscriber 
  endpoints for parallel processing.

  While queues offer several advantages, in most hard real-time systems, requests 
  older than a threshold time (often seconds) should be considered stale (the 
  client has given up and is no longer waiting for a response), and not processed. 
  This way more recent (and likely still valid requests) can be processed instead.

  **Desired outcome:** Implementing loosely coupled dependencies allows you to 
  minimize the surface area for failure to a component level, which helps diagnose 
  and resolve issues. It also simplifies development cycles, allowing teams to 
  implement changes at a modular level without affecting the performance of other 
  components that depend on it. This approach provides the capability to scale out 
  at a component level based on resource needs, as well as utilization of a 
  component contributing to cost-effectiveness.

  **Common anti-patterns:**

  - Deploying a monolithic workload.
  - Directly invoking APIs between workload tiers with no capability of failover 
    or asynchronous processing of the request.
  - Tight coupling using shared data. Loosely coupled systems should avoid sharing 
    data through shared databases or other forms of tightly coupled data storage, 
    which can reintroduce tight coupling and hinder scalability.
  - Ignoring back pressure. Your workload should have the ability to slow down or 
    stop incoming data when a component can't process it at the same rate.

  **Benefits of establishing this best practice:** Loose coupling helps isolate 
  behavior of a component from other components that depend on it, increasing 
  resiliency and agility. Failure in one component is isolated from others.

  **Level of risk exposed if this best practice is not established:** High

  ## Implementation guidance

  Implement loosely coupled dependencies. There are various solutions that allow 
  you to build loosely coupled applications. These include services for 
  implementing fully managed queues, automated workflows, react to events, and 
  APIs among others which can help isolate behavior of components from other 
  components, and as such increasing resilience and agility.

  - Build event-driven architectures: Amazon EventBridge helps you build loosely 
  coupled and distributed event-driven architectures.
  - Implement queues in distributed systems: You can use Amazon Simple Queue Service 
  (Amazon SQS) to integrate and decouple distributed systems.
  - Containerize components as microservices: Microservices allow teams to build 
  applications composed of small independent components which communicate over 
  well-defined APIs. Amazon Elastic Container Service (Amazon ECS), and Amazon 
  Elastic Kubernetes Service (Amazon EKS) can help you get started faster with 
  containers.
  - Manage workflows with Step Functions: Step Functions help you coordinate 
  multiple AWS services into flexible workflows.
  - Leverage publish-subscribe (pub/sub) messaging architectures: Amazon Simple 
  Notification Service (Amazon SNS) provides message delivery from publishers to 
  subscribers (also known as producers and consumers).

  ### Implementation steps

  - Components in an event-driven architecture are initiated by events. Events are 
  actions that happen in a system, such as a user adding an item to a cart. When 
  an action is successful, an event is generated that actuates the next component 
  of the system.
  - Distributed messaging systems have three main parts that need to be implemented 
  for a queue based architecture. They include components of the distributed 
  system, the queue that is used for decoupling (distributed on Amazon SQS 
  servers), and the messages in the queue. A typical system has producers which 
  initiate the message into the queue, and the consumer which receives the message 
  from the queue. The queue stores messages across multiple Amazon SQS servers for 
  redundancy.
  - Microservices, when well-utilized, enhance maintainability and boost 
  scalability, as loosely coupled components are managed by independent teams. It 
  also allows for the isolation of behaviors to a single component in case of 
  changes.
  - With AWS Step Functions you can build distributed applications, automate 
  processes, orchestrate microservices, among other things. The orchestration of 
  multiple components into an automated workflow allows you to decouple 
  dependencies in your application.
