---
name: "Design interactions in a distributed system to prevent failures"
description: |-
  Distributed systems rely on communications networks to interconnect components, 
  such as servers or services. Your workload must operate reliably despite data 
  loss or latency in these networks. Components of the distributed system must 
  operate in a way that does not negatively impact other components or the workload. 
  These best practices prevent failures and improve mean time between failures (MTBF).