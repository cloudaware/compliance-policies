---
name: "Design interactions in a distributed system to mitigate or withstand failures"
description: |-
  Distributed systems rely on communications networks to interconnect components 
  (such as servers or services). Your workload must operate reliably despite data 
  loss or latency over these networks. Components of the distributed system must 
  operate in a way that does not negatively impact other components or the workload. 
  These best practices allow workloads to withstand stresses or failures, more 
  quickly recover from them, and mitigate the impact of such impairments. The 
  result is improved mean time to recovery (MTTR).