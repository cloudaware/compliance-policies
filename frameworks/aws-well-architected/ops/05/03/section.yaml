---
name: "OPS05-BP03 Use configuration management systems"
description: |-
  Use configuration management systems to make and track configuration changes. These 
  systems reduce errors caused by manual processes and reduce the level of effort to deploy 
  changes.

  Static configuration management sets values when initializing a resource that are expected 
  to remain consistent throughout the resource’s lifetime. Dynamic configuration management 
  sets values at initialization that can or are expected to change during the lifetime of a 
  resource. For example, you could set a feature toggle to activate functionality in your code 
  through a configuration change, or change the level of log detail during an incident.

  Configurations should be deployed in a known and consistent state. You should use automated 
  inspection to continually monitor resource configurations across environments and regions. 
  These controls should be defined as code and management automated to ensure rules are 
  consistently applied across environments. Changes to configurations should be updated 
  through agreed change control procedures and applied consistently, honoring version control. 
  Application configuration should be managed independently of application and infrastructure 
  code. This allows for consistent deployment across multiple environments. Configuration 
  changes do not result in rebuilding or redeploying the application.

  **Desired outcome**

  - You configure, validate, and deploy as part of your continuous integration, continuous 
    delivery (CI/CD) pipeline.
  - You monitor to validate configurations are correct.
  - This minimizes any impact to end users and customers.

  **Common anti-patterns**

  - You manually update the web server configuration across your fleet and a number of 
    servers become unresponsive due to update errors.
  - You manually update your application server fleet over the course of many hours. The 
    inconsistency in configuration during the change causes unexpected behaviors.
  - Someone has updated your security groups and your web servers are no longer accessible. 
    Without knowledge of what was changed, you spend significant time investigating the issue, 
    extending your time to recovery.
  - You push a pre-production configuration into production through CI/CD without validation. 
    You expose users and customers to incorrect data and services.

  **Benefits of establishing this best practice**

  - Adopting configuration management systems reduces the level of effort to make and track 
    changes, and the frequency of errors caused by manual procedures.
  - Configuration management systems provide assurances with regards to governance, 
    compliance, and regulatory requirements.

  **Level of risk exposed if this best practice is not established:** Medium

  ## Implementation guidance

  Configuration management systems are used to track and implement changes to application 
  and environment configurations. Configuration management systems are also used to reduce 
  errors caused by manual processes, make configuration changes repeatable and auditable, and 
  reduce the level of effort.

  On AWS, you can use AWS Config to continually monitor your AWS resource configurations 
  across accounts and Regions. It helps you to track their configuration history, understand 
  how a configuration change would affect other resources, and audit them against expected or 
  desired configurations using AWS Config Rules and AWS Config Conformance Packs.

  For dynamic configurations in your applications running on Amazon EC2 instances,   AWS Lambda, 
  containers, mobile applications, or IoT devices, you can use AWS AppConfig to configure, 
  validate, deploy, and monitor them across your environments.

  ### Implementation steps

  1. Identify configuration owners.

      1. Make configuration owners aware of any compliance, governance, or regulatory needs.

  2. Identify configuration items and deliverables.

      1. Configuration items are all application and environmental configurations affected by a 
        deployment within your CI/CD pipeline.
      2. Deliverables include success criteria, validation, and what to monitor.

  3. Select tools for configuration management based on your business requirements and 
     delivery pipeline.

  4. Consider weighted deployments such as canary deployments for significant configuration 
     changes to minimize the impact of incorrect configurations.

  5. Integrate your configuration management into your CI/CD pipeline.

  6. Validate all changes pushed.
