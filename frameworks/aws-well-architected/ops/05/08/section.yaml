---
name: "OPS05-BP08 Use multiple environment"
description: |-
  Use multiple environments to experiment, develop, and test your workload. Use increasing levels of 
  controls as environments approach production to gain confidence your workload operates as intended 
  when deployed.

  **Desired outcome:** You have multiple environments that reflect your compliance 
  and governance needs. You test and promote code through environments on your 
  path to production.

  1. Your organization does this through the establishment of a landing zone, which provides governance, 
  controls, account automations, networking, security, and operational observability. Manage these 
  landing zone capabilities by using multiple environments. A common example is a sandbox organization 
  for developing and testing changes to an AWS Control Tower-based landing zone, which includes AWS IAM 
  Identity Center and policies such as service control policies (SCPs). All of these elements can 
  significantly impact the access to and operation of AWS accounts within the landing zone.
  2. In addition to these services, your teams extend the landing zone capabilities with solutions published 
  by AWS and AWS partners or as custom solutions developed within your organization. Examples of solutions 
  published by AWS include Customizations for AWS Control Tower (CfCT) and AWS Control Tower Account Factory 
  for Terraform (AFT).
  3. Your organization applies the same principles of testing, promoting code, and policy changes for the 
  landing zone through environments on your path to production. This strategy provides a stable and secure 
  landing zone environment for your application and workload teams.

  **Common anti-patterns**

  - You are performing development in a shared development environment and another developer overwrites 
    your code changes.
  - The restrictive security controls on your shared development environment are preventing you from 
    experimenting with new services and features.
  - You perform load testing on your production systems and cause an outage for your users.
  - A critical error resulting in data loss has occurred in production. In your production environment, 
    you attempt to recreate the conditions that lead to the data loss so that you can identify how it 
    happened and prevent it from happening again. To prevent further data loss during testing, you are 
    forced to make the application unavailable to your users.
  - You are operating a multi-tenant service and are unable to support a customer request for a dedicated 
    environment.
  - You may not always test, but when you do, you test in your production environment.
  - You believe that the simplicity of a single environment overrides the scope of impact of changes within 
    the environment.
  - You upgrade a key landing zone capability, but the change impairs your team's ability to vend accounts 
    for either new projects or your existing workloads.
  - You apply new controls to your AWS accounts, but the change impacts your workload team's ability to 
    deploy changes within their AWS accounts.

  **Benefits of establishing this best practice**

  - When you deploy multiple environments, you can support multiple simultaneous development, testing, 
    and production environments without creating conflicts between developers or user communities.
  - For complex capabilities such as landing zones, it significantly reduces the risk of changes, 
    simplifies the improvement process, and reduces the risk of critical updates to the environment.
  - Organizations that use landing zones naturally benefit from multi-accounts in their AWS environment, 
    with account structure, governance, network, and security configurations.
  - Over time, as your organization grows, the landing zone can evolve to secure and organize your workloads 
    and resources.

  **Level of risk exposed if this best practice is not established:** Medium

  ## Implementation guidance

  Use multiple environments and provide developers sandbox environments with minimized controls to aid 
  in experimentation. Provide individual development environments to help work in parallel, increasing 
  development agility. Implement more rigorous controls in the environments approaching production to 
  allow developers to innovate. Use infrastructure as code and configuration management systems to deploy 
  environments that are configured consistent with the controls present in production to ensure systems 
  operate as expected when deployed. When environments are not in use, turn them off to avoid costs 
  associated with idle resources (for example, development systems on evenings and weekends). Deploy 
  production equivalent environments when load testing to improve valid results.

  Teams such as platform engineering, networking, and security operations often manage capabilities at the 
  organization level with distinct requirements. A separation of accounts alone is insufficient to provide 
  and maintain separate environments for experimentation, development, and testing. In such cases, create 
  separate instances of AWS Organizations.
