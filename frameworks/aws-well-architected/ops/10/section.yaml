---
name: "Responding to events"
description: |-
  You should anticipate operational events, both planned (for example, sales 
  promotions, deployments, and failure tests) and unplanned (for example, surges 
  in utilization and component failures). You should use your existing runbooks 
  and playbooks to deliver consistent results when you respond to alerts. Defined 
  alerts should be owned by a role or a team that is accountable for the response 
  and escalations. You will also want to know the business impact of your system 
  components and use this to target efforts when needed. You should perform a root 
  cause analysis (RCA) after events, and then prevent recurrence of failures or 
  document workarounds.