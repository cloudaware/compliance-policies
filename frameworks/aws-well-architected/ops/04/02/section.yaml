---
name: "OPS04-BP02 Implement application telemetry"
description: |-
  Application telemetry serves as the foundation for observability of your workload. 
  It's crucial to emit telemetry that offers actionable insights into the state of your 
  application and the achievement of both technical and business outcomes. From 
  troubleshooting to measuring the impact of a new feature or ensuring alignment with 
  business key performance indicators (KPIs), application telemetry informs the way you 
  build, operate, and evolve your workload.

  Metrics, logs, and traces form the three primary pillars of observability. These serve 
  as diagnostic tools that describe the state of your application. Over time, they assist 
  in creating baselines and identifying anomalies. However, to ensure alignment between 
  monitoring activities and business objectives, it's pivotal to define and monitor KPIs. 
  Business KPIs often make it easier to identify issues compared to technical metrics alone.

  Other telemetry types, like real user monitoring (RUM) and synthetic transactions, 
  complement these primary data sources. RUM offers insights into real-time user 
  interactions, whereas synthetic transactions simulate potential user behaviors, 
  helping detect bottlenecks before real users encounter them.

  **Desired outcome:** Derive actionable insights into the performance of your 
  workload. These insights allow you to make proactive decisions about performance 
  optimization, achieve increased workload stability, streamline CI/CD processes, 
  and utilize resources effectively.

  **Common anti-patterns**

  - Incomplete observability: Neglecting to incorporate observability at every layer of 
    the workload, resulting in blind spots that can obscure vital system performance and 
    behavior insights.
  - Fragmented data view: When data is scattered across multiple tools and systems, it 
    becomes challenging to maintain a holistic view of your workload's health and 
    performance.
  - User-reported issues: A sign that proactive issue detection through telemetry and 
    business KPI monitoring is lacking.

  **Benefits of establishing this best practice**

  - Informed decision-making: With insights from telemetry and business KPIs, you can 
    make data-driven decisions.
  - Improved operational efficiency: Data-driven resource utilization leads to 
    cost-effectiveness.
  - Enhanced workload stability: Faster detection and resolution of issues leading to 
    improved uptime.
  - Streamlined CI/CD processes: Insights from telemetry data facilitate refinement of 
    processes and reliable code delivery.

  **Level of risk exposed if this best practice is not established:** High

  ## Implementation guidance

  To implement application telemetry for your workload, use AWS services like Amazon 
  CloudWatch and AWS X-Ray. Amazon CloudWatch provides a comprehensive suite of 
  monitoring tools, allowing you to observe your resources and applications in AWS and 
  on-premises environments. It collects, tracks, and analyzes metrics, consolidates and 
  monitors log data, and responds to changes in your resources, enhancing your 
  understanding of how your workload operates. In tandem, AWS X-Ray lets you trace, 
  analyze, and debug your applications, giving you a deep understanding of your workload's 
  behavior. With features like service maps, latency distributions, and trace timelines, 
  AWS X-Ray provides insights into your workload's performance and the bottlenecks 
  affecting it.

  ### Implementation steps

  1. Identify what data to collect: Ascertain the essential metrics, logs, and traces that 
     would offer substantial insights into your workload's health, performance, and 
     behavior.

  2. Deploy the CloudWatch agent: The CloudWatch agent is instrumental in procuring 
     system and application metrics and logs from your workload and its underlying 
     infrastructure. The CloudWatch agent can also be used to collect OpenTelemetry or 
     X-Ray traces and send them to X-Ray.

  3. Implement anomaly detection for logs and metrics: Use CloudWatch Logs anomaly 
     detection and CloudWatch Metrics anomaly detection to automatically identify 
     unusual activities in your application's operations. These tools use machine 
     learning algorithms to detect and alert on anomalies, which enhances your monitoring 
     capabilities and speeds up response time to potential disruptions or security 
     threats. Set up these features to proactively manage application health and security.

  4. Secure sensitive log data: Use Amazon CloudWatch Logs data protection to mask 
     sensitive information within your logs. This feature helps maintain privacy and 
     compliance through automatic detection and masking of sensitive data before it is 
     accessed. Implement data masking to securely handle and protect sensitive details 
     such as personally identifiable information (PII).

  5. Define and monitor business KPIs: Establish custom metrics that align with your 
     business outcomes.

  6. Instrument your application with AWS X-Ray: In addition to deploying the CloudWatch 
     agent, it's crucial to instrument your application to emit trace data. This process 
     can provide further insights into your workload's behavior and performance.

  7. Standardize data collection across your application: Standardize data collection 
     practices across your entire application. Uniformity aids in correlating and 
     analyzing data, providing a comprehensive view of your application's behavior.

  8. Implement cross-account observability: Enhance monitoring efficiency across 
     multiple AWS accounts with Amazon CloudWatch cross-account observability. With this 
     feature, you can consolidate metrics, logs, and alarms from different accounts into 
     a single view, which simplifies management and improves response times for identified 
     issues across your organization's AWS environment.

  9. Analyze and act on the data: Once data collection and normalization are in place, 
     use Amazon CloudWatch for metrics and logs analysis, and AWS X-Ray for trace 
     analysis. Such analysis can yield crucial insights into your workload's health, 
     performance, and behavior, guiding your decision-making process.

  **Level of effort for the implementation plan:** High
