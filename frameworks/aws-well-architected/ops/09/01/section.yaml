---
name: "OPS09-BP01 Measure operations goals and KPIs with metrics"
description: |-
  Obtain goals and KPIs that define operations success from your organization and
  determine that metrics reflect these. Set baselines as a point of reference and
  reevaluate regularly. Develop mechanisms to collect these metrics from teams for
  evaluation. The DevOps Research and Assessment (DORA) metrics provide a popular
  method to measure progress towards DevOps practices of software delivery.

  **Desired outcome**

  - The organization publishes and shares the goals and KPIs for the operations teams.
  - You establish metrics that reflect these KPIs. Examples may include:

      - Ticket queue depth or average age of ticket
      - Ticket count grouped by type of issue
      - Time spent working issues with or without a standardized operating procedure
        (SOP)
      - Amount of time spent recovering from a failed code push
      - Call volume

  **Common anti-patterns**

  - Deployment deadlines are missed because developers are pulled away to perform
    troubleshooting tasks. Development teams argue for more personnel, but cannot
    quantify how many they need because the time taken away cannot be measured.
  - A Tier 1 desk was set up to handle user calls. Over time, more workloads were
    added, but no headcount was allocated to the Tier 1 desk. Customer satisfaction
    suffers as call times increase and issues go longer without resolution, but
    management sees no indicators of such, preventing any action.
  - A problematic workload has been handed off to a separate operations team for
    upkeep. Unlike other workloads, this new one was not supplied with proper
    documentation and runbooks. As such, teams spend longer troubleshooting and
    addressing failures. However, there are no metrics documenting this, which makes
    accountability difficult.

  **Benefits of establishing this best practice**

  - Where workload monitoring shows the state of our applications and services,
    monitoring operations teams provides owners insight into changes among the
    consumers of those workloads, such as shifting business needs.
  - Measure the effectiveness of these teams and evaluate them against business goals
    by creating metrics that can reflect the state of operations.
  - Metrics can highlight support issues or identify when drifts occur away from a
    service level target.

  **Level of risk exposed if this best practice is not established:** Medium

  ## Implementation guidance

  Schedule time with business leaders and stakeholders to determine what the overall
  goals of the service will be. Determine what the tasks of various operations
  teams should be and what challenges they could be approached with.
  Using these, brainstorm key performance indicators (KPIs) that might reflect these
  operations goals. These might be customer satisfaction, time from feature
  conception to deployment, average issue resolution time, or cost efficiencies.
  
  Working from KPIs, identify the metrics and sources of data that might reflect
  these goals best. Customer satisfaction may be a combination of various metrics
  such as call wait or response times, satisfaction scores, and types of issues
  raised.
  Deployment times may be the sum of time needed for testing and deployment, plus
  any post-deployment fixes that needed to be added.
  Statistics showing the time spent on different types of issues (or the counts of
  those issues) can provide a window into where targeted effort is needed.
