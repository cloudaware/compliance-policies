---
name: "OPS07-BP04 Use playbooks to investigate issues"
description: |-
  Playbooks are step-by-step guides used to investigate an incident. When incidents
  happen, playbooks are used to investigate, scope impact, and identify a root
  cause. Playbooks are used for a variety of scenarios, from failed deployments to
  security incidents. In many cases, playbooks identify the root cause that a
  runbook is used to mitigate. Playbooks are an essential component of your
  organization's incident response plans.

  A good playbook has several key features. It guides the user, step by step,
  through the process of discovery. Thinking outside-in, what steps should someone
  follow to diagnose an incident? Clearly define in the playbook if special tools
  or elevated permissions are needed in the playbook. Having a communication plan
  to update stakeholders on the status of the investigation is a key component. In
  situations where a root cause can't be identified, the playbook should have an
  escalation plan. If the root cause is identified, the playbook should point to a
  runbook that describes how to resolve it. Playbooks should be stored centrally
  and regularly maintained. If playbooks are used for specific alerts, provide
  your team with pointers to the playbook within the alert.

  As your organization matures, automate your playbooks. Start with playbooks that
  cover low-risk incidents. Use scripting to automate the discovery steps. Make
  sure that you have companion runbooks to mitigate common root causes.

  **Desired outcome**

  - Your organization has playbooks for common incidents. The playbooks are stored
    in a central location and available to your team members.
  - Playbooks are updated frequently.
  - For any known root causes, companion runbooks are built.

  **Common anti-patterns**

  - There is no standard way to investigate an incident.
  - Team members rely on muscle memory or institutional knowledge to troubleshoot a
    failed deployment.
  - New team members learn how to investigate issues through trial and error.
  - Best practices for investigating issues are not shared across teams.

  **Benefits of establishing this best practice**

  - Playbooks boost your efforts to mitigate incidents.
  - Different team members can use the same playbook to identify a root cause in a
    consistent manner.
  - Known root causes can have runbooks developed for them, speeding up recovery
    time.
  - Playbooks help team members to start contributing sooner.
  - Teams can scale their processes with repeatable playbooks.

  **Level of risk exposed if this best practice is not established:** Medium

  ## Implementation guidance

  How you build and use playbooks depends on the maturity of your organization. If
  you are new to the cloud, build playbooks in text form in a central document
  repository. As your organization matures, playbooks can become semi-automated with
  scripting languages like Python. These scripts can be run inside a Jupyter
  notebook to speed up discovery. Advanced organizations have fully automated
  playbooks for common issues that are auto-remediated with runbooks.

  Start building your playbooks by listing common incidents that happen to your
  workload. Choose playbooks for incidents that are low risk and where the root
  cause has been narrowed down to a few issues to start. After you have playbooks
  for simpler scenarios, move on to the higher risk scenarios or scenarios where
  the root cause is not well known.

  Your text playbooks should be automated as your organization matures. Using
  services like AWS Systems Manager Automations, flat text can be transformed into
  automations. These automations can be run against your workload to speed up
  investigations. These automations can be activated in response to events,
  reducing the mean time to discover and resolve incidents.

  Customers can use AWS Systems Manager Incident Manager to respond to incidents.
  This service provides a single interface to triage incidents, inform stakeholders
  during discovery and mitigation, and collaborate throughout the incident. It
  uses AWS Systems Manager Automations to speed up detection and recovery.

  **Customer example**

  A production incident impacted AnyCompany Retail. The on-call engineer used a
  playbook to investigate the issue. As they progressed through the steps, they
  kept the key stakeholders, identified in the playbook, up to date. The engineer
  identified the root cause as a race condition in a backend service. Using a
  runbook, the engineer relaunched the service, bringing AnyCompany Retail back
  online.

  ### Implementation steps

  If you don't have an existing document repository, we suggest creating a
  version control repository for your playbook library. You can build your
  playbooks using Markdown, which is compatible with most playbook automation
  systems. If you are starting from scratch, use the following example playbook
  template.

  1. If you don't have an existing document repository or wiki, create a new version
     control repository for your playbooks in your version control system.
  2. Identify a common issue that requires investigation. This should be a scenario
     where the root cause is limited to a few issues and resolution is low risk.
  3. Using the Markdown template, fill in the Playbook Name section and the fields
     under Playbook Info.
  4. Fill in the troubleshooting steps. Be as clear as possible on what actions to
     perform or what areas you should investigate.
  5. Give a team member the playbook and have them go through it to validate it. If
     there's anything missing or something isn't clear, update the playbook.
  6. Publish your playbook in your document repository and inform your team and any
     stakeholders.
  7. This playbook library will grow as you add more playbooks. Once you have several
     playbooks, start automating them using tools like AWS Systems Manager
     Automations to keep automation and playbooks in sync.

  **Level of effort for the implementation plan:** Low. Your playbooks should be text
  documents stored in a central location. More mature organizations will move
  towards automating playbooks.
