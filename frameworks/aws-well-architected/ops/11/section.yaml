---
name: "Learn, share, and improve"
description: |-
  It’s essential that you regularly provide time for analysis of operations 
  activities, analysis of failures, experimentation, and making improvements. 
  When things fail, you will want to ensure that your team, as well as your larger 
  engineering community, learns from those failures. You should analyze failures 
  to identify lessons learned and plan improvements. You will want to regularly 
  review your lessons learned with other teams to validate your insights.