---
name: "SEC03-BP01 Define access requirements"
description: |-
  Each component or resource of your workload needs to be accessed by administrators, 
  end users, or other components. Have a clear definition of who or what should have 
  access to each component, choose the appropriate identity type and method of 
  authentication and authorization.

  **Common anti-patterns**

  - Hard-coding or storing secrets in your application.
  - Granting custom permissions for each user.
  - Using long-lived credentials.

  **Level of risk exposed if this best practice is not established:** High

  ## Implementation guidance

  Each component or resource of your workload needs to be accessed by administrators, 
  end users, or other components. Have a clear definition of who or what should have 
  access to each component, choose the appropriate identity type and method of 
  authentication and authorization.

  Regular access to AWS accounts within the organization should be provided using 
  federated access or a centralized identity provider. You should also centralize your 
  identity management and ensure that there is an established practice to integrate 
  AWS access to your employee access lifecycle. For example, when an employee changes 
  to a job role with a different access level, their group membership should also 
  change to reflect their new access requirements.

  When defining access requirements for non-human identities, determine which 
  applications and components need access and how permissions are granted. Using IAM 
  roles built with the least privilege access model is a recommended approach. AWS 
  Managed policies provide predefined IAM policies that cover most common use cases.

  AWS services, such as AWS Secrets Manager and AWS Systems Manager Parameter Store, 
  can help decouple secrets from the application or workload securely in cases where 
  it's not feasible to use IAM roles. In Secrets Manager, you can establish automatic 
  rotation for your credentials. You can use Systems Manager to reference parameters 
  in your scripts, commands, SSM documents, configuration, and automation workflows 
  by using the unique name that you specified when you created the parameter.

  You can use AWS IAM Roles Anywhere to obtain temporary security credentials in IAM 
  for workloads that run outside of AWS. Your workloads can use the same IAM policies 
  and IAM roles that you use with AWS applications to access AWS resources.

  Where possible, prefer short-term temporary credentials over long-term static 
  credentials. For scenarios in which you need users with programmatic access and 
  long-term credentials, use access key last used information to rotate and remove 
  access keys.

  Users need programmatic access if they want to interact with AWS outside of the AWS 
  Management Console. The way to grant programmatic access depends on the type of user 
  that's accessing AWS.
