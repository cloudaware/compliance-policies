---
name: "Permissions management"
description: |-
  Manage permissions to control access to human and machine identities that require 
  access to AWS and your workloads. Permissions allow you to control who can access 
  what, and under what conditions. By setting permissions to specific human and 
  machine identities, you grant them access to specific service actions on specific 
  resources. Additionally, you can specify conditions that must be true for access 
  to be granted.