---
name: "Protecting Networks"
description: |-
  Users, both in your workforce and your customers, can be located anywhere. 
  You need to pivot from traditional models of trusting anyone and anything that 
  has access to your network. When you follow the principle of applying security 
  at all layers, you employ a Zero Trust approach. Zero Trust security is a model 
  where application components or microservices are considered discrete from each 
  other and no component or microservice trusts any other.