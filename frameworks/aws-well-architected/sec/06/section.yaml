---
name: "Protecting Compute"
description: |-
  Compute resources include EC2 instances, containers, AWS Lambda functions, 
  database services, IoT devices, and more. Each of these compute resource types 
  require different approaches to secure them. However, they do share common 
  strategies that you need to consider: defense in depth, vulnerability management, 
  reduction in attack surface, automation of configuration and operation, and 
  performing actions at a distance. In this section, you will find general guidance 
  for protecting your compute resources for key services. For each AWS service 
  used, it’s important for you to check the specific security recommendations in 
  the service documentation.