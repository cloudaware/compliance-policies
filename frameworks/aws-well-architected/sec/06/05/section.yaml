
---
name: "SEC06-BP05 Automate compute protection"
description: |-
  Automate compute protection operations to reduce the need for human intervention. Use 
  automated scanning to detect potential issues within your compute resources, and remediate 
  with automated programmatic responses or fleet management operations. Incorporate 
  automation in your CI/CD processes to deploy trustworthy workloads with up-to-date 
  dependencies.

  **Desired outcome**

  Automated systems perform all scanning and patching of compute resources. 
  You use automated verification to check that software images and dependencies come 
  from trusted sources, and have not been tampered with. 
  Workloads are automatically checked for up-to-date dependencies, and are signed to 
  establish trustworthiness in AWS compute environments. 
  Automated remediations are initiated when non-compliant resources are detected. 

  **Common anti-patterns**

  - Following the practice of immutable infrastructure, but not having a solution in place 
    for emergency patching or replacement of production systems.
  - Using automation to fix misconfigured resources, but not having a manual override 
    mechanism in place. Situations may arise where you need to adjust the requirements, 
    and you may need to suspend automations until you make these changes.

  **Benefits of establishing this best practice**

  Automation can reduce the risk of unauthorized access and use of your compute resources.
  It helps to prevent misconfigurations from making their way into production environments,
  and detecting and fixing misconfigurations should they occur.
  Automation also helps to detect unauthorized access and use of compute resources to 
  reduce your time to respond. This in turn can reduce the overall scope of impact from 
  the issue.

  **Level of risk exposed if this best practice is not established:** Medium

  ## Implementation guidance

  You can apply the automations described in the Security Pillar practices for protecting 
  your compute resources. SEC06-BP01 Perform vulnerability management describes how you 
  can use Amazon Inspector in both your CI/CD pipelines and for continually scanning your 
  runtime environments for known Common Vulnerabilities and Exposures (CVEs). 

  You can use AWS Systems Manager to apply patches or redeploy from fresh images through 
  automated runbooks to keep your compute fleet updated with the latest software and libraries. 
  Use these techniques to reduce the need for manual processes and interactive access to 
  your compute resources. See SEC06-BP03 Reduce manual management and interactive access 
  to learn more.

  Automation also plays a role in deploying workloads that are trustworthy, described in 
  SEC06-BP02 Provision compute from hardened images and SEC06-BP04 Validate software integrity. 
  You can use services such as EC2 Image Builder, AWS Signer, AWS CodeArtifact, and Amazon 
  Elastic Container Registry (ECR) to download, verify, construct, and store hardened and 
  approved images and code dependencies. Alongside Inspector, each of these can play a role 
  in your CI/CD process so your workload makes its way to production only when it is confirmed 
  that its dependencies are up-to-date and from trusted sources. Your workload is also signed 
  so AWS compute environments, such as AWS Lambda and Amazon Elastic Kubernetes Service (EKS), 
  can verify it hasn't been tampered with before allowing it to run.

  Beyond these preventative controls, you can use automation in your detective controls for 
  your compute resources as well. As one example, AWS Security Hub offers the NIST 800-53 Rev. 5 
  standard that includes checks such as [EC2.8] EC2 instances should use Instance Metadata 
  Service Version 2 (IMDSv2). IMDSv2 uses the techniques of session authentication, blocking 
  requests that contain an X-Forwarded-For HTTP header, and a network TTL of 1 to stop traffic 
  originating from external sources to retrieve information about the EC2 instance. This check 
  in Security Hub can detect when EC2 instances use IMDSv1 and initiate automated remediation. 
  Learn more about automated detection and remediations in SEC04-BP04 Initiate remediation 
  for non-compliant resources.

  ### Implementation steps

  1. Automate creating secure, compliant and hardened AMIs with EC2 Image Builder. 
  You can produce images that incorporate controls from the Center for Internet 
  Security (CIS) Benchmarks or Security Technical Implementation Guide (STIG) 
  standards from base AWS and APN partner images.

  2. Automate configuration management. Enforce and validate secure configurations 
  in your compute resources automatically by using a configuration management 
  service or tool. 

      1. Automated configuration management using AWS Config
      2. Automated security and compliance posture management using AWS Security Hub

  3. Automate patching or replacing Amazon Elastic Compute Cloud (Amazon EC2) instances. 
  AWS Systems Manager Patch Manager automates the process of patching managed instances 
  with both security-related and other types of updates. You can use Patch Manager 
  to apply patches for both operating systems and applications.

  4. Automate scanning of compute resources for common vulnerabilities and exposures 
  (CVEs), and embed security scanning solutions within your build pipeline.

  5. Consider Amazon GuardDuty for automatic malware and threat detection to 
  protect compute resources. GuardDuty can also identify potential issues when 
  an AWS Lambda function gets invoked in your AWS environment. 

  6. Consider AWS Partner solutions. AWS Partners offer industry-leading products 
  that are equivalent, identical to, or integrate with existing controls in your 
  on-premises environments. These products complement the existing AWS services 
  to allow you to deploy a comprehensive security architecture and a more seamless 
  experience across your cloud and on-premises environments.

