---
name: "Protecting Data at Rest"
description: |-
  Data at rest represents any data that you persist in non-volatile storage for 
  any duration in your workload. This includes block storage, object storage, 
  databases, archives, IoT devices, and any other storage medium on which data 
  is persisted. Protecting your data at rest reduces the risk of unauthorized 
  access, when encryption and appropriate access controls are implemented.