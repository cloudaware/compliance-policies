---
name: "SEC04-BP03 Correlate and enrich security alerts"
description: |-
  Unexpected activity can generate multiple security alerts by different sources, requiring 
  further correlation and enrichment to understand the full context. Implement automated 
  correlation and enrichment of security alerts to help achieve more accurate incident 
  identification and response.

  **Desired outcome**

  As activity generates different alerts within your workloads and environments, automated 
  mechanisms correlate data and enrich that data with additional information.
  This pre-processing presents a more detailed understanding of the event, which helps 
  your investigators determine the criticality of the event and if it constitutes an 
  incident that requires formal response.
  This process reduces the load on your monitoring and investigation teams.

  **Common anti-patterns**

  - Different groups of people investigate findings and alerts generated by different systems, 
    unless otherwise mandated by separation of duty requirements.
  - Your organization funnels all security finding and alert data to standard locations, but 
    requires investigators to perform manual correlation and enrichment.
  - You rely solely on the intelligence of threat detection systems to report on findings 
    and establish criticality.

  **Benefits of establishing this best practice**

  Automated correlation and enrichment of alerts helps to reduce the overall cognitive load 
  and manual data preparation required of your investigators.
  This practice can reduce the time it takes to determine if the event represents an incident 
  and initiate a formal response.
  Additional context also helps you accurately assess the true severity of an event, as it 
  may be higher or lower than what any one alert suggests.

  **Level of risk exposed if this best practice is not established:** Low

  ## Implementation guidance

  Security alerts can come from many different sources within AWS, including:

  - Services such as Amazon GuardDuty, AWS Security Hub, Amazon Macie, Amazon Inspector, 
    AWS Config, AWS Identity and Access Management Access Analyzer, and Network Access Analyzer.
  - Alerts from automated analysis of AWS service, infrastructure, and application logs, 
    such as from Security Analytics for Amazon OpenSearch Service.
  - Alarms in response to changes in your billing activity from sources such as Amazon 
    CloudWatch, Amazon EventBridge, or AWS Budgets.
  - Third-party sources such as threat intelligence feeds and Security Partner Solutions from 
    the AWS Partner Network.
  - Contact by AWS Trust & Safety or other sources, such as customers or internal employees.

  In their most fundamental form, alerts contain information about who (the principal or identity) 
  is doing what (the action taken) to what (the resources affected). For each of these sources, 
  identify if there are ways you can create mappings across identifiers for these identities, actions, 
  and resources as the foundation for performing correlation. This can take the form of integrating alert 
  sources with a SIEM tool to perform automated correlation for you, building your own data pipelines 
  and processing, or a combination of both.

  An example of a service that can perform correlation for you is Amazon Detective. Detective performs 
  ongoing ingestion of alerts from various AWS and third-party sources and uses different forms of intelligence 
  to assemble a visual graph of their relationships to aid investigations.

  While the initial criticality of an alert is an aid for prioritization, the context in which the alert 
  happened determines its true criticality. For example, Amazon GuardDuty might alert that an EC2 instance 
  within your workload is querying an unexpected domain name. GuardDuty might assign low criticality to this 
  alert on its own. However, automated correlation with other activity around the time of the alert might 
  uncover that several hundred EC2 instances were deployed by the same identity, increasing overall operating costs. 
  In this event, this correlated event context would warrant a new security alert and the criticality might 
  be adjusted to high, expediting further action.

  ### Implementation steps

  1. Identify sources for security alert information. Understand how alerts from 
  these systems represent identity, action, and resources to determine where 
  correlation is possible.

  2. Establish a mechanism for capturing alerts from different sources. Consider 
  services such as Security Hub, EventBridge, and CloudWatch for this purpose.

  3. Identify sources for data correlation and enrichment. Example sources include 
  AWS CloudTrail, VPC Flow Logs, Route 53 Resolver logs, and infrastructure and 
  application logs. Any or all of these logs might be consumed through a single 
  integration with Amazon Security Lake.

  4. Integrate your alerts with your data correlation and enrichment sources to 
  create more detailed security event contexts and establish criticality.

      1. Amazon Detective, SIEM tooling, or other third-party solutions can perform 
      a certain level of ingestion, correlation, and enrichment automatically.

      2. You can also use AWS services to build your own. For example, you can 
      invoke an AWS Lambda function to run an Amazon Athena query against AWS 
      CloudTrail or Amazon Security Lake, and publish the results to EventBridge.