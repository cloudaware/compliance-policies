---
name: "Software and architecture"
description: |-
  Implement patterns for performing load smoothing and maintaining consistent high 
  utilization of deployed resources to minimize the resources consumed. Components 
  might become idle from lack of use because of changes in user behavior over time. 
  Revise patterns and architecture to consolidate under-utilized components to 
  increase overall utilization. Retire components that are no longer required. 
  Understand the performance of your workload components, and optimize the components 
  that consume the most resources. Be aware of the devices your customers use to 
  access your services, and implement patterns to minimize the need for device upgrades.