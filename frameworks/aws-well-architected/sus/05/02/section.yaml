---
name: "SUS05-BP02 Use instance types with the least impact"
description: |-
  Continually monitor and use new instance types to take advantage of energy 
  efficiency improvements.

  **Common anti-patterns**

  - You are only using one family of instances.
  - You are only using x86 instances.
  - You specify one instance type in your Amazon EC2 Auto Scaling configuration.
  - You use AWS instances in a manner that they were not designed for (for example, 
    you use compute-optimized instances for a memory-intensive workload).
  - You do not evaluate new instance types regularly.
  - You do not check recommendations from AWS rightsizing tools such as AWS Compute 
    Optimizer.

  **Benefits of establishing this best practice**

  By using energy-efficient and right-sized instances, you are able to greatly 
  reduce the environmental impact and cost of your workload.

  **Level of risk exposed if this best practice is not established:** Medium

  ## Implementation guidance

  Using efficient instances in cloud workload is crucial for lower resource usage 
  and cost-effectiveness. Continually monitor the release of new instance types 
  and take advantage of energy efficiency improvements, including those instance 
  types designed to support specific workloads such as machine learning training 
  and inference, and video transcoding.

  ### Implementation steps

  1. Learn and explore instance types: Find instance types that can lower your 
  workload's environmental impact.

      - Subscribe to What's New with AWS to stay up-to-date with the latest AWS 
        technologies and instances.
      - Learn about different AWS instance types.
      - Learn about AWS Graviton-based instances which offer the best performance 
        per watt of energy use in Amazon EC2 by watching re:Invent 2020 - Deep 
        dive on AWS Graviton2 processor-powered Amazon EC2 instances and Deep dive 
        into AWS Graviton3 and Amazon EC2 C7g instances.

  2. Use instance types with the least impact: Plan and transition your workload to 
  instance types with the least impact.

      - Define a process to evaluate new features or instances for your workload. 
        Take advantage of agility in the cloud to quickly test how new instance 
        types can improve your workload environmental sustainability. Use proxy 
        metrics to measure how many resources it takes you to complete a unit of 
        work.
      - If possible, modify your workload to work with different numbers of vCPUs 
        and different amounts of memory to maximize your choice of instance type.
      - Consider transitioning your workload to Graviton-based instances to improve 
        the performance efficiency of your workload.
      - Consider selecting the AWS Graviton option in your usage of AWS managed 
        services.
      - Migrate your workload to Regions that offer instances with the least 
        sustainability impact and still meet your business requirements.
      - For machine learning workloads, take advantage of purpose-built hardware 
        that is specific to your workload such as AWS Trainium, AWS Inferentia, and 
        Amazon EC2 DL1. AWS Inferentia instances such as Inf2 instances offer up to 
        50% better performance per watt over comparable Amazon EC2 instances.
      - Use Amazon SageMaker AI Inference Recommender to right size ML inference 
        endpoint.
      - For spiky workloads (workloads with infrequent requirements for additional 
        capacity), use burstable performance instances.
      - For stateless and fault-tolerant workloads, use Amazon EC2 Spot Instances to 
        increase overall utilization of the cloud, and reduce the sustainability 
        impact of unused resources.

  3. Operate and optimize: Operate and optimize your workload instance.

      - For ephemeral workloads, evaluate instance Amazon CloudWatch metrics such 
        as CPUUtilization to identify if the instance is idle or under-utilized.
      - For stable workloads, check AWS rightsizing tools such as AWS Compute 
        Optimizer at regular intervals to identify opportunities to optimize and 
        right-size the instances.
