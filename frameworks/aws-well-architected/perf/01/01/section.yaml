name: "PERF01-BP01 Learn about and understand available cloud services and features"
description: |-
  Continually learn about and discover available services and configurations that 
  help you make better architectural decisions and improve performance efficiency in 
  your workload architecture.

  **Common anti-patterns:**

  - You use the cloud as a collocated data center.
  - You do not modernize your application after migration to the cloud.
  - You only use one storage type for all things that need to be persisted.
  - You use instance types that are closest matched to your current standards, but 
    are larger where needed.
  - You deploy and manage technologies that are available as managed services.

  **Benefits of establishing this best practice:** By considering new services and 
  configurations, you may be able to greatly improve performance, reduce cost, and 
  optimize the effort required to maintain your workload. It can also help you 
  accelerate the time-to-value for cloud-enabled products.

  **Level of risk exposed if this best practice is not established:** High

  ## Implementation guidance

  AWS continually releases new services and features that can improve performance and 
  reduce the cost of cloud workloads. Staying up-to-date with these new services and 
  features is crucial for maintaining performance efficacy in the cloud. Modernizing 
  your workload architecture also helps you accelerate productivity, drive 
  innovation, and unlock more growth opportunities.

  ### Implementation steps

  - Inventory your workload software and architecture for related services. Decide 
    which category of products to learn more about.
  - Explore AWS offerings to identify and learn about the relevant services and 
    configuration options that can help you improve performance and reduce cost and 
    operational complexity.
  - Use Amazon Q to get relevant information and advice about services.
  - Use sandbox (non-production) environments to learn and experiment with new 
    services without incurring extra cost.
  - Continually learn about new cloud services and features.
