---
name: "PERF01-BP05 Use policies and reference architectures"
description: |-
  Use internal policies and existing reference architectures when selecting 
  services and configurations to be more efficient when designing and implementing 
  your workload.

  **Common anti-patterns:**

  - You allow a wide variety of technology that may impact the management overhead 
    of your company.

  **Benefits of establishing this best practice:** Establishing a policy for 
  architecture, technology, and vendor choices allows decisions to be made quickly.

  **Level of risk exposed if this best practice is not established:** Medium

  ## Implementation guidance

  Having internal policies in selecting resources and architecture provides standards 
  and guidelines to follow when making architectural choices. Those guidelines 
  streamline the decision-making process when choosing the right cloud service and 
  can help improve performance efficiency. Deploy your workload using policies or 
  reference architectures. Integrate the services into your cloud deployment, then 
  use your performance tests to verify that you can continue to meet your 
  performance requirements.

  ### Implementation steps

  - Clearly understand the requirements of your cloud workload.
  - Review internal and external policies to identify the most relevant ones.
  - Use the appropriate reference architectures provided by AWS or your industry 
    best practices.
  - Create a continuum consisting of policies, standards, reference architectures, 
    and prescriptive guidelines for common situations. Doing so allows your teams to 
    move faster. Tailor the assets for your vertical if applicable.
  - Validate these policies and reference architectures for your workload in 
    sandbox environments.
  - Stay up-to-date with industry standards and AWS updates to make sure your policies 
    and reference architectures help optimize your cloud workload.
