---
name: "PERF01-BP03 Factor cost into architectural decisions"
description: |-
  Factor cost into your architectural decisions to improve resource utilization and 
  performance efficiency of your cloud workload. When you are aware of the cost 
  implications of your cloud workload, you are more likely to leverage efficient 
  resources and reduce wasteful practices.

  **Common anti-patterns:**

  - You only use one family of instances.
  - You do not evaluate licensed solutions against open-source solutions.
  - You do not define storage lifecycle policies.
  - You do not review new services and features of the AWS Cloud.
  - You only use block storage.

  **Benefits of establishing this best practice:** Factoring cost into your 
  decision making allows you to use more efficient resources and explore other 
  investments.

  **Level of risk exposed if this best practice is not established:** Medium

  ## Implementation guidance

  Optimizing workloads for cost can improve resource utilization and avoid waste in 
  a cloud workload. Factoring cost into architectural decisions usually includes 
  right-sizing workload components and enabling elasticity, which results in 
  improved cloud workload performance efficiency.

  ### Implementation steps

  - Establish cost objectives like budget limits for your cloud workload.
  - Identify the key components (like instances and storage) that drive cost of 
    your workload. You can use AWS Pricing Calculator and AWS Cost Explorer to 
    identify key cost drivers in your workload.
  - Understand pricing models in the cloud, such as On-Demand, Reserved Instances, 
    Savings Plans, and Spot Instances.
  - Use Well-Architected cost optimization best practices to optimize these key 
    components for cost.
  - Continually monitor and analyze cost to identify cost optimization opportunities 
    in your workload.
  - Use AWS Budgets to get alerts for unacceptable costs.
  - Use AWS Compute Optimizer or AWS Trusted Advisor to get cost optimization 
    recommendations.
  - Use AWS Cost Anomaly Detection to get automated cost anomaly detection and root 
    cause analysis.
