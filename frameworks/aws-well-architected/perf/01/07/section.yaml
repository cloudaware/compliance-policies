---
name: "PERF01-BP07 Use a data-driven approach for architectural choices"
description: |-
  Define a clear, data-driven approach for architectural choices to verify that the 
  right cloud services and configurations are used to meet your specific business 
  needs.

  **Common anti-patterns:**

  - You assume your current architecture is static and should not be updated over 
    time.
  - Your architectural choices are based upon guesses and assumptions.
  - You introduce architecture changes over time without justification.

  **Benefits of establishing this best practice:** By having a well-defined approach 
  for making architectural choices, you use data to influence your workload design 
  and make informed decisions over time.

  **Level of risk exposed if this best practice is not established:** Medium

  ## Implementation guidance

  Use internal experience and knowledge of the cloud or external resources such as 
  published use cases or whitepapers to choose resources and services in your 
  architecture. You should have a well-defined process that encourages experimentation 
  and benchmarking with the services that could be used in your workload.

  Backlogs for critical workloads should consist of not just user stories which 
  deliver functionality relevant to business and users, but also technical stories 
  which form an architecture runway for the workload. This runway is informed by new 
  advancements in technology and new services and adopts them based on data and 
  proper justification. This verifies that the architecture remains future-proof and 
  does not stagnate.

  ### Implementation steps

  - Engage with key stakeholders to define workload requirements, including 
    performance, availability, and cost considerations. Consider factors such as the 
    number of users and usage pattern for your workload.
  - Create an architecture runway or a technology backlog which is prioritized along 
    with the functional backlog.
  - Evaluate and assess different cloud services (for more detail, see PERF01-BP01 
    Learn about and understand available cloud services and features).
  - Explore different architectural patterns, like microservices or serverless, that 
    meet your performance requirements (for more detail, see PERF01-BP02 Use guidance 
    from your cloud provider or an appropriate partner to learn about architecture 
    patterns and best practices).
  - Consult other teams, architecture diagrams, and resources, such as AWS Solution 
    Architects, AWS Architecture Center, and AWS Partner Network, to help you choose 
    the right architecture for your workload.
  - Define performance metrics like throughput and response time that can help you 
    evaluate the performance of your workload.
  - Experiment and use defined metrics to validate the performance of the selected 
    architecture.
  - Continually monitor and make adjustments as needed to maintain the optimal 
    performance of your architecture.
  - Document your selected architecture and decisions as a reference for future 
    updates and learnings.
  - Continually review and update the architecture selection approach based on 
    learnings, new technologies, and metrics that indicate a needed change or problem 
    in the current approach.
