---
name: "PERF01-BP02 Use guidance from your cloud provider or an appropriate partner\
  \ to learn about architecture patterns and best practices"
description: |-
  Use cloud company resources such as documentation, solutions architects, 
  professional services, or appropriate partners to guide your architectural 
  decisions. These resources help you review and improve your architecture for 
  optimal performance.

  **Common anti-patterns:**

  - You use AWS as a common cloud provider.
  - You use AWS services in a manner that they were not designed for.
  - You follow all guidance without considering your business context.

  **Benefits of establishing this best practice:** Using guidance from a cloud 
  provider or an appropriate partner can help you to make the right architectural 
  choices for your workload and give you confidence in your decisions.

  **Level of risk exposed if this best practice is not established:** Medium

  ## Implementation guidance

  AWS offers a wide range of guidance, documentation, and resources that can help 
  you build and manage efficient cloud workloads. AWS documentation provides code 
  samples, tutorials, and detailed service explanations. In addition to 
  documentation, AWS provides training and certification programs, solutions 
  architects, and professional services that can help customers explore different 
  aspects of cloud services and implement efficient cloud architecture on AWS.

  Leverage these resources to gain insights into valuable knowledge and best 
  practices, save time, and achieve better outcomes in the AWS Cloud.

  ### Implementation steps

  - Review AWS documentation and guidance and follow the best practices. 
  - Join AWS partner events (like AWS Global Summits, AWS re:Invent, user groups, 
    and workshops) to learn from AWS experts about best practices for using AWS 
    services.
  - Reach out to AWS for assistance when you need additional guidance or product 
    information. AWS Solutions Architects and AWS Professional Services provide 
    guidance for solution implementation. AWS Partners provide AWS expertise to 
    help you unlock agility and innovation for your business.
  - Use Support if you need technical support to use a service effectively. Our 
    Support plans are designed to give you the right mix of tools and access to 
    expertise so that you can be successful with AWS while optimizing performance, 
    managing risk, and keeping costs under control.
