---
name: "PERF03-BP01 Use a purpose-built data store that best supports your data access and storage requirements"
description: |-
  Understand data characteristics (like shareable, size, cache size, access 
  patterns, latency, throughput, and persistence of data) to select the right 
  purpose-built data stores (storage or database) for your workload.

  **Common anti-patterns**

  - You stick to one data store because there is internal experience and 
    knowledge of one particular type of database solution.
  - You assume that all workloads have similar data storage and access 
    requirements.
  - You have not implemented a data catalog to inventory your data assets.

  **Benefits of establishing this best practice**

  Understanding data characteristics and requirements allows you to determine 
  the most efficient and performant storage technology appropriate for your 
  workload needs.

  **Level of risk exposed if this best practice is not established:** High

  ## Implementation guidance

  When selecting and implementing data storage, make sure that the querying, 
  scaling, and storage characteristics support the workload data requirements. 
  AWS provides numerous data storage and database technologies including block 
  storage, object storage, streaming storage, file system, relational, key-value, 
  document, in-memory, graph, time series, and ledger databases. Each data 
  management solution has options and configurations available to you to support 
  your use-cases and data models. By understanding data characteristics and 
  requirements, you can break away from monolithic storage technology and 
  restrictive, one-size-fits-all approaches to focus on managing data 
  appropriately.

  ### Implementation steps

  1. Conduct an inventory of the various data types that exist in your workload.
  2. Understand and document data characteristics and requirements, including:
  
      - Data type (unstructured, semi-structured, relational)
      - Data volume and growth
      - Data durability: persistent, ephemeral, transient
      - ACID (atomicity, consistency, isolation, durability) requirements
      - Data access patterns (read-heavy or write-heavy)
      - Latency
      - Throughput
      - IOPS (input/output operations per second)
      - Data retention period

  3. Learn about different data stores (storage and database services) available 
     for your workload on AWS that can meet your data characteristics, as 
     outlined in PERF01-BP01 Learn about and understand available cloud services 
     and features. Some examples of AWS storage technologies and their key 
     characteristics include:

  | Type | AWS Services | Key characteristics |
  | ---- | ------------ | ------------------- |
  | Object storage | Amazon S3 | Unlimited scalability, high availability, and multiple options for accessibility. Transferring and accessing objects in and out of Amazon S3 can use a service, such as Transfer Acceleration or Access Points, to support your location, security needs, and access patterns.|
  | Archiving storage | Amazon Glacier | Built for data archiving. |
  | Streaming storage | Amazon Kinesis, Amazon Managed Streaming for Apache Kafka (Amazon MSK) | Efficient ingestion and storage of streaming data.|
  | Shared file system | Amazon Elastic File System (Amazon EFS) | Mountable file system that can be accessed by multiple types of compute solutions.|
  | Shared file system | Amazon FSx | Built on the latest AWS compute solutions to support four commonly used file systems: NetApp ONTAP, OpenZFS, Windows File Server, and Lustre. Amazon FSx latency, throughput, and IOPS vary per file system and should be considered when selecting the right file system for your workload needs.|
  | Block storage | Amazon Elastic Block Store (Amazon EBS) | Scalable, high-performance block-storage service designed for Amazon Elastic Compute Cloud (Amazon EC2). Amazon EBS includes SSD-backed storage for transactional, IOPS-intensive workloads and HDD-backed storage for throughput-intensive workloads.|
  | Relational database | Amazon Aurora, Amazon RDS, Amazon Redshift | Designed to support ACID transactions, and maintain referential integrity and strong data consistency. Many traditional applications, ERP, CRM, and ecommerce use relational databases to store their data. |
  | Key-value database | Amazon DynamoDB | Optimized for common access patterns, typically to store and retrieve large volumes of data. High-traffic web apps, ecommerce systems, and gaming applications are typical use-cases.|
  | Document database | Amazon DocumentDB | Designed to store semi-structured data as JSON-like documents. These databases help developers build and update applications such as content management, catalogs, and user profiles quickly.|
  | In-memory database | Amazon ElastiCache, Amazon MemoryDB for Redis | Used for applications that require real-time access to data, lowest latency and highest throughput. Applications include caching, session management, gaming leaderboards, low latency ML feature store, microservices messaging, and high-throughput streaming mechanisms.|
  | Graph database | Amazon Neptune | Used for applications that must navigate and query millions of relationships between highly connected graph datasets with millisecond latency at large scale. Common uses include fraud detection, social networking, and recommendation engines. |
  | Time Series database | Amazon Timestream | Used to efficiently collect, synthesize, and derive insights from data that changes over time. IoT applications, DevOps, and industrial telemetry can utilize time-series databases.|
  | Wide column | Amazon Keyspaces (for Apache Cassandra) | Uses tables, rows, and columns, but column names and formats can vary per row. Commonly used in high-scale industrial apps like equipment maintenance, fleet management, and route optimization.|
  | Ledger | Amazon Quantum Ledger Database (Amazon QLDB) | Provides a centralized and trusted authority to maintain a scalable, immutable, and cryptographically verifiable record of transactions. Commonly used in systems of record, supply chain, registrations, and banking transactions.|

  4. If you are building a data platform, leverage modern data architecture on 
     AWS to integrate your data lake, data warehouse, and purpose-built data stores.

  5. The key questions that you need to consider when choosing a data store for your workload are as follows:

  | Question |	Things to consider |
  | -------- | ------------------- |
  | How is the data structured? | If the data is unstructured, consider an object-store such as Amazon S3 or a NoSQL database such as Amazon DocumentDB |
  | | For key-value data, consider DynamoDB, Amazon ElastiCache (Redis OSS) or Amazon MemoryDB|
  | What level of referential integrity is required? | For foreign key constraints, relational databases such as Amazon RDS and Aurora can provide this level of integrity.|
  | | Typically, within a NoSQL data-model, you would de-normalize your data into a single document or collection of documents to be retrieved in a single request rather than joining across documents or tables. |
  | Is ACID (atomicity, consistency, isolation, durability) compliance required? |	If the ACID properties associated with relational databases are required, consider a relational database such as Amazon RDS and Aurora. |
  | | If strong consistency is required for NoSQL database, you can use strongly consistent reads with DynamoDB. |
  | How will the storage requirements change over time? How does this impact scalability?	| Serverless databases such as DynamoDB and Amazon Quantum Ledger Database (Amazon QLDB) will scale dynamically. |
  | | Relational databases have upper bounds on provisioned storage, and often must be horizontally partitioned using mechanisms such as sharding once they reach these limits. |
  | What is the proportion of read queries in relation to write queries? Would caching be likely to improve performance?	| Read-heavy workloads can benefit from a caching layer, like ElastiCache or DAX if the database is DynamoDB. |
  | | Reads can also be offloaded to read replicas with relational databases such as Amazon RDS. |
  | Does storage and modification (OLTP - Online Transaction Processing) or retrieval and reporting (OLAP - Online Analytical Processing) have a higher priority?	| For high-throughput read as-is transactional processing, consider a NoSQL database such as DynamoDB. |
  | | For high-throughput and complex read patterns (like join) with consistency use Amazon RDS. |
  | | For analytical queries, consider a columnar database such as Amazon Redshift or exporting the data to Amazon S3 and performing analytics using Athena or Amazon QuickSight. |
  | What level of durability does the data require?	| Aurora automatically replicates your data across three Availability Zones within a Region, meaning your data is highly durable with less chance of data loss. |
  | | DynamoDB is automatically replicated across multiple Availability Zones, providing high availability and data durability. |
  | | Amazon S3 provides 11 nines of durability. Many database services, such as Amazon RDS and DynamoDB, support exporting data to Amazon S3 for long-term retention and archival. |
  | Is there a desire to move away from commercial database engines or licensing costs?	| Consider open-source engines such as PostgreSQL and MySQL on Amazon RDS or Aurora. |
  | | Leverage AWS Database Migration Service and AWS Schema Conversion Tool to perform migrations from commercial database engines to open-source |
  | What is the operational expectation for the database? Is moving to managed services a primary concern? | Leveraging Amazon RDS instead of Amazon EC2, and DynamoDB or Amazon DocumentDB instead of self-hosting a NoSQL database can reduce operational overhead. |
  | How is the database currently accessed? Is it only application access, or are there business intelligence (BI) users and other connected off-the-shelf applications? | If you have dependencies on external tooling then you may have to maintain compatibility with the databases they support. Amazon RDS is fully compatible with the difference engine versions that it supports including Microsoft SQL Server, Oracle, MySQL, and PostgreSQL. |

  6. Perform experiments and benchmarking in a non-production environment to 
  identify which data store can address your workload requirements.
