---
name: "PERF03-BP04 Implement strategies to improve query performance in data store"
description: |-
  Implement access patterns that can benefit from caching data for fast retrieval 
  of frequently accessed data.

  **Common anti-patterns**

  - You cache data that changes frequently.
  - You rely on cached data as if it is durably stored and always available.
  - You don't consider the consistency of your cached data.
  - You don't monitor the efficiency of your caching implementation.

  **Benefits of establishing this best practice**

  Storing data in a cache can improve read latency, read throughput, user experience, 
  and overall efficiency, as well as reduce costs.

  **Level of risk exposed if this best practice is not established:** Medium

  ## Implementation guidance

  A cache is a software or hardware component aimed at storing data so that future 
  requests for the same data can be served faster or more efficiently. The data 
  stored in a cache can be reconstructed if lost by repeating an earlier calculation 
  or fetching it from another data store.

  Data caching can be one of the most effective strategies to improve your overall 
  application performance and reduce burden on your underlying primary data sources. 
  Data can be cached at multiple levels in the application, such as within the 
  application making remote calls, known as client-side caching, or by using a fast 
  secondary service for storing the data, known as remote caching.

  **Client-side caching**

  With client-side caching, each client (an application or service that queries the 
  backend datastore) can store the results of their unique queries locally for a 
  specified amount of time. This can reduce the number of requests across the network 
  to a datastore by checking the local client cache first. If the results are not 
  present, the application can then query the datastore and store those results 
  locally. This pattern allows each client to store data in the closest location 
  possible (the client itself), resulting in the lowest possible latency. Clients 
  can also continue to serve some queries when the backend datastore is unavailable, 
  increasing the availability of the overall system.

  One disadvantage of this approach is that when multiple clients are involved, they 
  may store the same cached data locally. This results in both duplicate storage usage 
  and data inconsistency between those clients. One client might cache the results 
  of a query, and one minute later another client can run the same query and get a 
  different result.

  **Remote caching**

  To solve the issue of duplicate data between clients, a fast external service, or 
  remote cache, can be used to store the queried data. Instead of checking a local 
  data store, each client will check the remote cache before querying the backend 
  datastore. This strategy allows for more consistent responses between clients, 
  better efficiency in stored data, and a higher volume of cached data because the 
  storage space scales independently of clients.

  The disadvantage of a remote cache is that the overall system may see a higher 
  latency, as an additional network hop is required to check the remote cache. 
  Client-side caching can be used alongside remote caching for multi-level caching 
  to improve the latency.

  ### Implementation steps

  1. Identify databases, APIs, and network services that could benefit from caching. 
  Services that have heavy read workloads, have a high read-to-write ratio, or are 
  expensive to scale are candidates for caching.
  2. Identify the appropriate type of caching strategy that best fits your access pattern.
  3. Follow Caching Best Practices for your data store.
  4. Configure a cache invalidation strategy, such as a time-to-live (TTL), for all 
  data that balances freshness of data and reducing pressure on backend datastore.
  5. Enable features such as automatic connection retries, exponential backoff, 
  client-side timeouts, and connection pooling in the client, if available, 
  as they can improve performance and reliability.
  6. Monitor cache hit rate with a goal of 80% or higher. Lower values may indicate 
  insufficient cache size or an access pattern that does not benefit from caching.
  7. Implement data replication to offload reads to multiple instances and improve 
  data read performance and availability.
