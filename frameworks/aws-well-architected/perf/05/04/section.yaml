---
name: "PERF05-BP04 Load test your workload"
description: |-
  Load test your workload to verify it can handle production load and identify any
  performance bottleneck.

  **Common anti-patterns**

  - You load test individual parts of your workload but not your entire workload.
  - You load test on infrastructure that is not the same as your production environment.
  - You only conduct load testing to your expected load and not beyond, to help foresee
    where you may have future problems.
  - You perform load testing without consulting the Amazon EC2 Testing Policy and
    submitting a Simulated Event Submissions Form. This results in your test failing to run,
    as it looks like a denial-of-service event.

  **Benefits of establishing this best practice**

  Measuring your performance under a load test will show you where you will be impacted as
  load increases. This can provide you with the capability of anticipating needed changes
  before they impact your workload.

  **Level of risk exposed if this best practice is not established:** Low

  ## Implementation guidance

  Load testing in the cloud is a process to measure the performance of cloud workload under
  realistic conditions with expected user load. This process involves provisioning a
  production-like cloud environment, using load testing tools to generate load, and
  analyzing metrics to assess the ability of your workload handling a realistic load. Load
  tests must be run using synthetic or sanitized versions of production data (remove
  sensitive or identifying information). Automatically carry out load tests as part of your
  delivery pipeline, and compare the results against pre-defined KPIs and thresholds. This
  process helps you continue to achieve required performance.

  ### Implementation steps

  1. Define your testing objectives: Identify the performance aspects of your workload that
     you want to evaluate, such as throughput and response time.
  2. Select a testing tool: Choose and configure the load testing tool that suits your
     workload.
  3. Set up your environment: Set up the test environment based on your production
     environment. You can use AWS services to run production-scale environments to test
     your architecture.
  4. Implement monitoring: Use monitoring tools such as Amazon CloudWatch to collect
     metrics across the resources in your architecture. You can also collect and publish
     custom metrics.
  5. Define scenarios: Define the load testing scenarios and parameters (like test
     duration and number of users).
  6. Conduct load testing: Perform test scenarios at scale. Take advantage of the AWS Cloud
     to test your workload to discover where it fails to scale, or if it scales in a
     non-linear way. For example, use Spot Instances to generate loads at low cost and
     discover bottlenecks before they are experienced in production.
  7. Analyze test results: Analyze the results to identify performance bottlenecks and areas
     for improvements.
  8. Document and share findings: Document and report on findings and recommendations. Share
     this information with stakeholders to help them make informed decision regarding
     performance optimization strategies.
  9. Continually iterate: Load testing should be performed at regular cadence, especially
     after a system change of update.
