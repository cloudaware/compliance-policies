name: "PERF05-BP02 Use monitoring solutions to understand the areas where performance is most critical"
description: |-
  Understand and identify areas where increasing the performance of your workload will have a
  positive impact on efficiency or customer experience. For example, a website that has a
  large amount of customer interaction can benefit from using edge services to move content
  delivery closer to customers.

  **Common anti-patterns**

  - You assume that standard compute metrics such as CPU utilization or memory pressure are
    enough to catch performance issues.
  - You only use the default metrics recorded by your selected monitoring software.
  - You only review metrics when there is an issue.

  **Benefits of establishing this best practice**

  Understanding critical areas of performance helps workload owners monitor KPIs and
  prioritize high-impact improvements.

  **Level of risk exposed if this best practice is not established:** High

  ## Implementation guidance

  Set up end-to-end tracing to identify traffic patterns, latency, and critical performance
  areas. Monitor your data access patterns for slow queries or poorly fragmented and
  partitioned data. Identify the constrained areas of the workload using load testing or
  monitoring.

  Increase performance efficiency by understanding your architecture, traffic patterns, and
  data access patterns, and identify your latency and processing times. Identify the
  potential bottlenecks that might affect the customer experience as the workload grows.
  After investigating these areas, look at which solution you could deploy to remove those
  performance concerns.

  ### Implementation steps

  1. Set up end-to-end monitoring to capture all workload components and metrics. Here are
     examples of monitoring solutions on AWS.

     | Service | Where to use |
     |---------|--------------|
     | Amazon CloudWatch Real-User Monitoring (RUM) | To capture application performance metrics from real user client-side and frontend sessions. |
     | AWS X-Ray | To trace traffic through the application layers and identify latency between components and dependencies. Use X-Ray service maps to see relationships and latency between workload components. |
     | Amazon Relational Database Service Performance Insights | To view database performance metrics and identify performance improvements. |
     | Amazon RDS Enhanced Monitoring | To view database OS performance metrics. |
     | Amazon DevOps Guru | To detect abnormal operating patterns so you can identify operational issues before they impact your customers. |

  2. Perform tests to generate metrics, identify traffic patterns, bottlenecks, and critical
     performance areas. Here are some examples of how to perform testing:

     - Set up CloudWatch Synthetic Canaries to mimic browser-based user activities
       programmatically using Linux cron jobs or rate expressions to generate consistent
       metrics over time.
     - Use the AWS Distributed Load Testing solution to generate peak traffic or test the
       workload at the expected growth rate.

  3. Evaluate the metrics and telemetry to identify your critical performance areas. Review
     these areas with your team to discuss monitoring and solutions to avoid bottlenecks.

  4. Experiment with performance improvements and measure those changes with data. As an
     example, you can use CloudWatch Evidently to test new improvements and performance
     impacts to your workload.
