name: "[GuardDuty.7] GuardDuty EKS Runtime Monitoring should be enabled"
description: |-
  EKS Protection in Amazon GuardDuty provides threat detection coverage to help 
  you protect Amazon EKS clusters within your AWS environment. EKS Runtime 
  Monitoring uses operating system-level events to help you detect potential 
  threats in EKS nodes and containers within your EKS clusters.
