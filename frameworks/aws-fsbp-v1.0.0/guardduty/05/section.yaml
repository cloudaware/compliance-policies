name: "[GuardDuty.5] GuardDuty EKS Audit Log Monitoring should be enabled"
description: |-
  GuardDuty EKS Audit Log Monitoring helps you detect potentially suspicious 
  activities in your Amazon Elastic Kubernetes Service (Amazon EKS) clusters. 
  EKS Audit Log Monitoring uses Kubernetes audit logs to capture chronological 
  activities from users, applications using the Kubernetes API, and the control 
  plane.
