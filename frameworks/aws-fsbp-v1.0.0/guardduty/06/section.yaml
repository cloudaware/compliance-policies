name: "[GuardDuty.6] GuardDuty Lambda Protection should be enabled"
description: |-
  GuardDuty Lambda Protection helps you identify potential security threats when 
  an AWS Lambda function gets invoked. After your enable Lambda Protection, 
  GuardDuty starts monitoring Lambda network activity logs associated with the 
  Lambda functions in your AWS account. When a Lambda function gets invoked and 
  GuardDuty identifies suspicious network traffic that indicates the presence of 
  a potentially malicious piece of code in your Lambda function, GuardDuty 
  generates a finding.
similar:
