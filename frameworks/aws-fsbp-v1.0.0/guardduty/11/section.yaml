name: "[GuardDuty.11] GuardDuty Runtime Monitoring should be enabled"
description: |-
  GuardDuty Runtime Monitoring observes and analyzes operating system-level, 
  networking, and file events to help you detect potential threats in specific 
  AWS workloads in your environment. It uses GuardDuty security agents that add 
  visibility into runtime behavior, such as file access, process execution, 
  command line arguments, and network connections. You can enable and manage 
  the security agent for each type of resource that you want to monitor for 
  potential threats, such as Amazon EKS clusters and Amazon EC2 instances.
similar:
