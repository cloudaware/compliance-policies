---
name: "[GuardDuty.1] GuardDuty should be enabled"
description: |-
  It is highly recommended that you enable GuardDuty in all supported AWS Regions. 
  Doing so allows GuardDuty to generate findings about unauthorized or unusual 
  activity, even in Regions that you do not actively use. This also allows 
  GuardDuty to monitor CloudTrail events for global AWS services such as IAM.
