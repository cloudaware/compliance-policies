---
name: >
  [Lambda.5] VPC Lambda functions should operate in multiple Availability Zones
description: |-
  Deploying resources across multiple AZs is an AWS best practice to ensure high 
  availability within your architecture. Availability is a core pillar in the 
  confidentiality, integrity, and availability triad security model. All Lambda 
  functions that connect to a VPC should have a multi-AZ deployment to ensure 
  that a single zone of failure doesn't cause a total disruption of operations.
