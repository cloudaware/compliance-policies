---
name: >
  [EventBridge.3] EventBridge custom event buses should have 
  a resource-based policy attached
description: |-
  By default, an EventBridge custom event bus doesn't have a resource-based policy 
  attached. This allows principals in the account to access the event bus. By attaching 
  a resource-based policy to the event bus, you can limit access to the event bus 
  to specified accounts, as well as intentionally grant access to entities in another account.
