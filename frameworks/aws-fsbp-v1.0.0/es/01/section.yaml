---
name: "[ES.1] Elasticsearch domains should have encryption at-rest enabled"
description: |-
  For an added layer of security for your sensitive data in OpenSearch, you should 
  configure your OpenSearch to be encrypted at rest. Elasticsearch domains offer 
  encryption of data at rest. The feature uses AWS KMS to store and manage your 
  encryption keys. To perform the encryption, it uses the Advanced Encryption Standard 
  algorithm with 256-bit keys (AES-256).
