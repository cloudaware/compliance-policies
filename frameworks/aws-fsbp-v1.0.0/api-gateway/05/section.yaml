---
name: "[APIGateway.5] API Gateway REST API cache data should be encrypted at rest"
description: |-
  Encrypting data at rest reduces the risk of data stored on disk being accessed 
  by a user not authenticated to AWS. It adds another set of access controls to 
  limit unauthorized users ability access the data. For example, API permissions 
  are required to decrypt the data before it can be read.

  API Gateway REST API caches should be encrypted at rest for an added layer of security.
