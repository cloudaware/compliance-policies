---
name: >
  [Redshift.9] Redshift clusters should not use the default database name
description: |-
  When creating a Redshift cluster, you should change the default database name 
  to a unique value. Default names are public knowledge and should be changed 
  upon configuration. As an example, a well-known name could lead to inadvertent 
  access if it was used in IAM policy conditions.
