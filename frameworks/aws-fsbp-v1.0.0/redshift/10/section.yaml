---
name: "[Redshift.10] Redshift clusters should be encrypted at rest"
description: |-
  In Amazon Redshift, you can turn on database encryption for your clusters to 
  help protect data at rest. When you turn on encryption for a cluster, the data 
  blocks and system metadata are encrypted for the cluster and its snapshots. 
  Encryption of data at rest is a recommended best practice because it adds 
  a layer of access management to your data. Encrypting Redshift clusters at 
  rest reduces the risk that an unauthorized user can access the data stored 
  on disk.
