---
name: >
  [Redshift.6] Amazon Redshift should have automatic upgrades to major 
  versions enabled
description: |-
  Enabling automatic major version upgrades ensures that the latest major 
  version updates to Amazon Redshift clusters are installed during the 
  maintenance window. These updates might include security patches and bug fixes. 
  Keeping up to date with patch installation is an important step in securing systems.
