---
name: >
  [Redshift.18] Redshift clusters should have Multi-AZ deployments enabled
description: |-
  Amazon Redshift supports multiple Availability Zones (Multi-AZ) deployments for 
  provisioned clusters. If Multi-AZ deployments are enabled for a cluster, an 
  Amazon Redshift data warehouse can continue operating in failure scenarios when 
  an unexpected event happens in an Availability Zone (AZ). A Multi-AZ deployment 
  deploys compute resources in more than one AZ and these compute resources can 
  be accessed through a single endpoint. In the event of an entire AZ failure, 
  the remaining compute resources in another AZ are available to continue processing 
  workloads. You can convert an existing Single-AZ data warehouse to a Multi-AZ 
  data warehouse. Additional compute resources are then provisioned in a second AZ.
similar:
