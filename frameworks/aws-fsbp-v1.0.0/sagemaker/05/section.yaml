name: >
  [SageMaker.5] SageMaker models should block inbound traffic
description: |-
  SageMaker AI training and deployed inference containers are internet-enabled 
  by default. If you don't want SageMaker AI to provide external network access 
  to your training or inference containers, you can enable network isolation. 
  If you enable network isolation, the containers can't make any outbound 
  network calls, even to other AWS services. Additionally, no AWS credentials 
  are made available to the container runtime environment. Enabling network 
  isolation helps prevent unintended access to your SageMaker AI resources from 
  the internet.
similar:
