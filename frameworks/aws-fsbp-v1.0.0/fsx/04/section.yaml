name: >
  [FSx.4] FSx for NetApp ONTAP file systems should be configured for Multi-AZ deployment
description: |-
  Amazon FSx for NetApp ONTAP supports several deployment types for file systems: 
  Single-AZ 1, Single-AZ 2, Multi-AZ 1, and Multi-AZ 2. The deployment types 
  offer different levels of availability and durability. We recommend using 
  a Multi-AZ deployment type for most production workloads due to the high 
  availability and durability model that Multi-AZ deployment types provide. 
  Multi-AZ file systems support all the availability and durability features of 
  Single-AZ file systems. In addition, they're designed to provide continuous 
  availability to data even when an Availability Zone (AZ) is unavailable.
