---
name: >
  [ElastiCache.1] ElastiCache (Redis OSS) clusters should have automatic backups enabled
description: |-
  ElastiCache (Redis OSS) clusters can back up their data. You can use the backup 
  to restore a cluster or seed a new cluster. The backup consists of the cluster's 
  metadata, along with all the data in the cluster. All backups are written to 
  Amazon S3, which provides durable storage. You can restore your data by creating 
  a new ElastiCache cluster and populating it with data from a backup. You can 
  manage backups using the AWS Management Console, the AWS CLI, and the ElastiCache API.
