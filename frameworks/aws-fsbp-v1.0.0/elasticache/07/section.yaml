---
name: >
  [ElastiCache.7] ElastiCache clusters should not use the default subnet group
description: |-
  When launching an ElastiCache cluster, a default subnet group is created if one 
  doesn't exist already. The default group uses subnets from the default Virtual Private Cloud (VPC). 
  We recommend using custom subnet groups that are more restrictive of the subnets 
  that the cluster resides in, and the networking that the cluster inherits 
  from the subnets.
