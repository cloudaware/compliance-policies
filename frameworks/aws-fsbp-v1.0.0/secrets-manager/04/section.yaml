---
name: >
  [SecretsManager.4] Secrets Manager secrets should be rotated within 
  a specified number of days
description: |-
  Rotating secrets can help you to reduce the risk of an unauthorized use of 
  your secrets in your AWS account. Examples include database credentials, 
  passwords, third-party API keys, and even arbitrary text. If you do not change 
  your secrets for a long period of time, the secrets are more likely 
  to be compromised.

  As more users get access to a secret, it can become more likely that someone 
  mishandled and leaked it to an unauthorized entity. Secrets can be leaked 
  through logs and cache data. They can be shared for debugging purposes and 
  not changed or revoked once the debugging completes. For all these reasons, 
  secrets should be rotated frequently.

  You can configure automatic rotation for secrets in AWS Secrets Manager. 
  With automatic rotation, you can replace long-term secrets with short-term ones, 
  significantly reducing the risk of compromise.
