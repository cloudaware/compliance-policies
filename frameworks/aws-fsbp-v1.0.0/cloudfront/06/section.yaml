---
name: "[CloudFront.6] CloudFront distributions should have WAF enabled"
description: |-
  AWS WAF is a web application firewall that helps protect web applications and 
  APIs from attacks. It allows you to configure a set of rules, called a web 
  access control list (web ACL), that allow, block, or count web requests based 
  on customizable web security rules and conditions that you define. Ensure your 
  CloudFront distribution is associated with an AWS WAF web ACL to help protect 
  it from malicious attacks.
