---
name: >
  [ECS.10] ECS Fargate services should run on the latest Fargate platform version
description: |-
  AWS Fargate platform versions refer to a specific runtime environment for Fargate 
  task infrastructure, which is a combination of kernel and container runtime versions. 
  New platform versions are released as the runtime environment evolves. For example, 
  a new version may be released for kernel or operating system updates, new features, 
  bug fixes, or security updates. Security updates and patches are deployed automatically 
  for your Fargate tasks. If a security issue is found that affects a platform version, 
  AWS patches the platform version.
