name: >
  [EC2.58] VPCs should be configured with an interface endpoint 
  for Systems Manager Incident Manager Contacts
description: |-
  AWS PrivateLink enables customers to access services hosted on AWS in a highly 
  available and scalable manner, while keeping all the network traffic within 
  the AWS network. Service users can privately access services powered by PrivateLink 
  from their VPC or their on-premises, without using public IPs, and without requiring 
  traffic to traverse across the internet.
similar:
