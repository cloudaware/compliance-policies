---
name: "[EC2.51] EC2 Client VPN endpoints should have client connection logging enabled"
description: |-
  Client VPN endpoints allow remote clients to securely connect to resources in 
  a Virtual Private Cloud (VPC) in AWS. Connection logs allow you to track user 
  activity on the VPN endpoint and provides visibility. When you enable connection 
  logging, you can specify the name of a log stream in the log group. If you don't 
  specify a log stream, the Client VPN service creates one for you.
