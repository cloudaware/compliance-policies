---
name: >
  [EC2.18] Security groups should only allow unrestricted incoming traffic for authorized ports
description: |-
  Security groups provide stateful filtering of ingress and egress network traffic 
  to AWS. Security group rules should follow the principal of least privileged access. 
  Unrestricted access (IP address with a /0 suffix) increases the opportunity for 
  malicious activity such as hacking, denial-of-service attacks, and loss of data. 
  Unless a port is specifically allowed, the port should deny unrestricted access.
