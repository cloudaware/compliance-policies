name: >
  [EC2.23] Amazon EC2 Transit Gateways should not automatically accept VPC attachment requests
description: |-
  Turning on `AutoAcceptSharedAttachments` configures a transit gateway to automatically 
  accept any cross-account VPC attachment requests without verifying the request 
  or the account the attachment is originating from.
