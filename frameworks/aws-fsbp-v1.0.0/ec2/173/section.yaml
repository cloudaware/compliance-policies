name: "[EC2.173] EC2 Spot Fleet requests with launch parameters should enable encryption for attached EBS volumes"
description: |-
  This control checks whether an Amazon EC2 Spot Fleet request that specifies 
  launch parameters is configured to enable encryption for all Amazon Elastic 
  Block Store (Amazon EBS) volumes attached to EC2 instances. The control fails 
  if the Spot Fleet request specifies launch parameters and doesn't enable encryption 
  for one or more EBS volumes specified in the request.

  For an additional layer of security, you should enable encryption for Amazon 
  EBS volumes. Encryption operations then occur on the servers that host Amazon 
  EC2 instances, which helps ensure the security of both data at rest and data 
  in transit between an instance and its attached EBS storage. Amazon EBS encryption 
  is a straightforward encryption solution for EBS resources associated with your 
  EC2 instances. With EBS encryption, you aren't required to build, maintain, 
  and secure your own key management infrastructure. EBS encryption uses AWS KMS 
  keys when creating encrypted volumes.
