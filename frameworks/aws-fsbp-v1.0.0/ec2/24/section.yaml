---
name: "[EC2.24] Amazon EC2 paravirtual instance types should not be used"
description: |-
  Linux Amazon Machine Images (AMIs) use one of two types of virtualization: paravirtual (PV) 
  or hardware virtual machine (HVM). The main differences between PV and HVM AMIs 
  are the way in which they boot and whether they can take advantage of special 
  hardware extensions (CPU, network, and storage) for better performance.

  Historically, PV guests had better performance than HVM guests in many cases, 
  but because of enhancements in HVM virtualization and the availability of PV 
  drivers for HVM AMIs, this is no longer true.
