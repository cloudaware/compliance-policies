---
name: "[EC2.15] Amazon EC2 subnets should not automatically assign public IP addresses"
description: |-
  Subnets have attributes that determine whether network interfaces automatically 
  receive public IPv4 and IPv6 addresses. For IPv4, this attribute is set to TRUE 
  for default subnets and FALSE for nondefault subnets (with an exception for 
  nondefault subnets created through the EC2 launch instance wizard, where it's 
  set to TRUE). For IPv6, this attribute is set to FALSE for all subnets by default. 
  When these attributes are enabled, instances launched in the subnet automatically 
  receive the corresponding IP addresses (IPv4 or IPv6) on their primary network 
  interface.
