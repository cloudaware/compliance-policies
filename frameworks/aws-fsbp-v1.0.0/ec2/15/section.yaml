---
name: "[EC2.15] Amazon EC2 subnets should not automatically assign public IP addresses"
description: |-
  All subnets have an attribute that determines whether a network interface created 
  in the subnet automatically receives a public IPv4 address. Instances that are 
  launched into subnets that have this attribute enabled have a public IP address 
  assigned to their primary network interface.
