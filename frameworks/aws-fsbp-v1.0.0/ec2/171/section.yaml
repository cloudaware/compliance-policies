name: "[EC2.171] EC2 VPN connections should have logging enabled"
description: |-
  AWS Site-to-Site VPN logs provide you with deeper visibility into your 
  Site-to-Site VPN deployments. With this feature, you have access to Site-to-Site VPN 
  connection logs that provide details on IP Security (IPsec) tunnel establishment, 
  Internet Key Exchange (IKE) negotiations, and dead peer detection (DPD) protocol 
  messages. Site-to-Site VPN logs can be published to CloudWatch Logs.
