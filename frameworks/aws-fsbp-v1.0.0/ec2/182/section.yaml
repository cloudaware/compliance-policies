name: "[EC2.182] Amazon EBS Snapshots should not be publicly accessible"
description: |-
  To prevent public sharing of your Amazon EBS snapshots, you can enable block 
  public access for snapshots. Once block public access for snapshots is enabled 
  in a Region, any attempt to publicly share snapshots in that Region is automatically 
  blocked. This helps improve the security of the snapshots and protect the snapshot 
  data from unauthorized or unintended access.
