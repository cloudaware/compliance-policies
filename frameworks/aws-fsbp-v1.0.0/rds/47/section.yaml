name: >
  [RDS.47] RDS for PostgreSQL DB clusters should be configured to copy tags to DB snapshots
description: |-
  Copying tags to DB snapshots helps maintain proper resource tracking, governance, 
  and cost allocation across backup resources. This enables consistent resource 
  identification, access control, and compliance monitoring across both active 
  databases and their snapshots. Properly tagged snapshots improve security operations 
  by ensuring backup resources inherit the same metadata as their source databases.
similar:
