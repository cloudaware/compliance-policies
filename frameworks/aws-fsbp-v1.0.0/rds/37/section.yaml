name: >
  [RDS.37] Aurora PostgreSQL DB clusters should publish logs to CloudWatch Logs
description: |-
  Database logging provides detailed records of requests made to an RDS cluster. 
  Aurora PostgreSQL generates event logs that contain useful information for 
  administrators. Publishing these logs to CloudWatch Logs centralizes log 
  management and helps you perform real-time analysis of the log data. 
  CloudWatch Logs retains logs in highly durable storage. You can also create 
  alarms and view metrics in CloudWatch.
similar:
