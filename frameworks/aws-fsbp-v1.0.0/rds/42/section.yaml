name: >
  [RDS.42] RDS for MariaDB DB instances should publish logs to CloudWatch Logs
description: |-
  Database logging provides detailed records of requests made to an Amazon RDS 
  for MariaDB DB instance. Publishing logs to Amazon CloudWatch Logs centralizes 
  log management and helps you perform real-time analysis of the log data. In addition, 
  CloudWatch Logs retains the logs in durable storage, which can support security, 
  access, and availability reviews and audits. With CloudWatch Logs, you can also 
  create alarms and review metrics.
similar:
