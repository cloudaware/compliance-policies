---
name: > 
  [RDS.2] RDS DB Instances should prohibit public access, as determined by 
  the PubliclyAccessible configuration
description: |-
  The `PubliclyAccessible` value in the RDS instance configuration indicates 
  whether the DB instance is publicly accessible. When the DB instance is 
  configured with `PubliclyAccessible`, it is an Internet-facing instance with 
  a publicly resolvable DNS name, which resolves to a public IP address. When 
  the DB instance isn't publicly accessible, it is an internal instance with 
  a DNS name that resolves to a private IP address.
