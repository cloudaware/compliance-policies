name: >
  [RDS.41] RDS for SQL Server DB instances should be encrypted in transit
description: |-
  Data in transit refers to data that moves from one location to another, such as 
  between nodes in a DB cluster or between a DB cluster and a client application. 
  Data can move across the internet or within a private network. Encrypting data 
  in transit reduces the risk of unauthorized users eavesdropping on network traffic.
