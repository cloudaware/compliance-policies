---
name: >
  [DMS.11] DMS endpoints for MongoDB should have an authentication mechanism enabled
description: |-
  AWS Database Migration Service supports two authentications methods for 
  MongoDB — **MONGODB-CR** for MongoDB version 2.x, and **SCRAM-SHA-1** for MongoDB 
  version 3.x or later. These authentication methods are used to authenticate and 
  encrypt MongoDB passwords if users want to use the passwords to access the databases. 
  Authentication on AWS DMS endpoints ensures that only authorized users can access 
  and modify the data being migrated between databases. Without proper authentication, 
  unauthorized users may be able to gain access to sensitive data during the migration 
  process. This can result in data breaches, data loss, or other security incidents.
