---
name: "[Neptune.1] Neptune DB clusters should be encrypted at rest"
description: |-
  Data at rest refers to any data that's stored in persistent, non-volatile 
  storage for any duration. Encryption helps you protect the confidentiality of 
  such data, reducing the risk that an unauthorized user can access it. 
  Encrypting your Neptune DB clusters protects your data and metadata against 
  unauthorized access. It also fulfills compliance requirements for data-at-rest 
  encryption of production file systems.
