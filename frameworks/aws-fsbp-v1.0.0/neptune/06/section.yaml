---
name: "[Neptune.6] Neptune DB cluster snapshots should be encrypted at rest"
description: |-
  Data at rest refers to any data that's stored in persistent, non-volatile 
  storage for any duration. Encryption helps you protect the confidentiality of 
  such data, reducing the risk that an unauthorized user gets access to it. 
  Data in Neptune DB clusters snapshots should be encrypted at rest for an added 
  layer of security.
