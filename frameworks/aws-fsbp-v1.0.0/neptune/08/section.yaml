---
name: >
  [Neptune.8] Neptune DB clusters should be configured to copy tags to snapshots
description: |-
  Identification and inventory of your IT assets is a crucial aspect of governance 
  and security. You should tag snapshots in the same way as their parent Amazon 
  RDS database clusters. Copying tags ensures that the metadata for the DB 
  snapshots matches that of the parent database clusters, and that access 
  policies for the DB snapshot also match those of the parent DB instance.
