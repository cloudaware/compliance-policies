---
name: "[EKS.8] EKS clusters should have audit logging enabled"
description: |-
  EKS control plane logging provides audit and diagnostic logs directly from 
  the EKS control plane to Amazon CloudWatch Logs in your account. You can select 
  the log types you need, and logs are sent as log streams to a group for each 
  EKS cluster in CloudWatch. Logging provides visibility into the access and performance 
  of EKS clusters. By sending EKS control plane logs for your EKS clusters to CloudWatch Logs, 
  you can record operations for audit and diagnostic purposes in a central location.
