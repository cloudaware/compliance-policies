---
name: "[AppSync.5] AWS AppSync GraphQL APIs should not be authenticated with API keys"
description: |-
  An API key is a hard-coded value in your application that is generated by the 
  AWS AppSync service when you create an unauthenticated GraphQL endpoint. If 
  this API key is compromised, your endpoint is vulnerable to unintended access. 
  Unless you are supporting a publicly accessible application or website, we don't 
  recommend using an API key for authentication.
