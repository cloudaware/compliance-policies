---
name: >
  [WAF.2] AWS WAF Classic Regional rules should have at least one condition
description: |-
  A WAF Regional rule can contain multiple conditions. The rule's conditions 
  allow for traffic inspection and take a defined action (allow, block, or count). 
  Without any conditions, the traffic passes without inspection. A WAF Regional 
  rule with no conditions, but with a name or tag suggesting allow, block, or 
  count, could lead to the wrong assumption that one of those actions is occurring.
