---
name: >
  [WAF.10] AWS WAF web ACLs should have at least one rule or rule group
description: |-
  A web ACL gives you fine-grained control over all of the HTTP(S) web requests 
  that your protected resource responds to. A web ACL should contain a collection 
  of rules and rule groups that inspect and control web requests. If a web ACL 
  is empty, the web traffic can pass without being detected or acted upon by 
  AWS WAF depending on the default action.
