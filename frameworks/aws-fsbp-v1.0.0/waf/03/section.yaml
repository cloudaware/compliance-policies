---
name: >
  [WAF.3] AWS WAF Classic Regional rule groups should have at least one rule
description: |-
  A WAF Regional rule group can contain multiple rules. The rule's conditions 
  allow for traffic inspection and take a defined action (allow, block, or count). 
  Without any rules, the traffic passes without inspection. A WAF Regional rule 
  group with no rules, but with a name or tag suggesting allow, block, or count, 
  could lead to the wrong assumption that one of those actions is occurring.
