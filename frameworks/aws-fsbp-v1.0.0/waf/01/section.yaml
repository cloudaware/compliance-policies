---
name: "[WAF.1] AWS WAF Classic Global Web ACL logging should be enabled"
description: |-
  Logging is an important part of maintaining the reliability, availability, 
  and performance of AWS WAF globally. It is a business and compliance requirement 
  in many organizations, and allows you to troubleshoot application behavior. 
  It also provides detailed information about the traffic that is analyzed by 
  the web ACL that is attached to AWS WAF.
