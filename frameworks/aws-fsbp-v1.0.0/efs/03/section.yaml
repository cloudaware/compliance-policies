---
name: "[EFS.3] EFS access points should enforce a root directory"
description: |-
  When you enforce a root directory, the NFS client using the access point uses 
  the root directory configured on the access point instead of the file system's 
  root directory. Enforcing a root directory for an access point helps restrict 
  data access by ensuring that users of the access point can only reach files of 
  the specified subdirectory.
