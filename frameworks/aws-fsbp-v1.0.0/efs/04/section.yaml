---
name: "[EFS.4] EFS access points should enforce a user identity"
description: |-
  Amazon EFS access points are application-specific entry points into an EFS file 
  system that make it easier to manage application access to shared datasets. 
  Access points can enforce a user identity, including the user's POSIX groups, 
  for all file system requests that are made through the access point. Access points 
  can also enforce a different root directory for the file system so that clients 
  can only access data in the specified directory or its subdirectories.
