---
name: "[DataFirehose.1] Firehose delivery streams should be encrypted at rest"
description: |-
  Server-side encryption is a feature in Amazon Data Firehose delivery streams 
  that automatically encrypts data before it's at rest by using a key created in 
  AWS Key Management Service (AWS KMS). Data is encrypted before it's written to 
  the Data Firehose stream storage layer, and decrypted after it's retrieved from storage. 
  This allows you to comply with regulatory requirements and enhance the security of your data.
