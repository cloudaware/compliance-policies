---
name: "[Macie.2] Macie automated sensitive data discovery should be enabled"
description: |-
  Macie automates discovery and reporting of sensitive data, such as personally 
  identifiable information (PII), in Amazon Simple Storage Service (Amazon S3) 
  buckets. With automated sensitive data discovery, Macie continually evaluates 
  your bucket inventory and uses sampling techniques to identify and select 
  representative S3 objects from your buckets. Macie then analyzes the selected 
  objects, inspecting them for sensitive data. As the analyses progress, Macie 
  updates statistics, inventory data, and other information that it provides 
  about your S3 data. Macie also generates findings to report sensitive data 
  that it finds.
