---
name: "[Macie.1] Amazon Macie should be enabled"
description: |-
  Amazon Macie discovers sensitive data using machine learning and pattern 
  matching, provides visibility into data security risks, and enables automated 
  protection against those risks. Macie automatically and continually evaluates 
  your Amazon Simple Storage Service (Amazon S3) buckets for security and access 
  control, and generates findings to notify you of potential issues with the 
  security or privacy of your Amazon S3 data. Macie also automates discovery and 
  reporting of sensitive data, such as personally identifiable information (PII), 
  to provide you with a better understanding of the data that you store in 
  Amazon S3.
