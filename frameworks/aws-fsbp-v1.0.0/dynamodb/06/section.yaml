---
name: "[DynamoDB.6] DynamoDB tables should have deletion protection enabled"
description: |-
  You can protect a DynamoDB table from accidental deletion with the deletion protection 
  property. Enabling this property for tables helps ensure that tables don't get 
  accidentally deleted during regular table management operations by your administrators. 
  This helps prevent disruption to your normal business operations.
