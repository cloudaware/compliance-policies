---
name: >
  [ELB.1] Application Load Balancer should be configured to redirect 
  all HTTP requests to HTTPS
description: |-
  Before you start to use your Application Load Balancer, you must add one 
  or more listeners. A listener is a process that uses the configured protocol 
  and port to check for connection requests. Listeners support both the HTTP 
  and HTTPS protocols. You can use an HTTPS listener to offload the work of encryption 
  and decryption to your load balancer. To enforce encryption in transit, 
  you should use redirect actions with Application Load Balancers to redirect client 
  HTTP requests to an HTTPS request on port 443.
