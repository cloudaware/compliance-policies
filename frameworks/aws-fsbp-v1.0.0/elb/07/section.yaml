---
name: "[ELB.7] Classic Load Balancers should have connection draining enabled"
description: |-
  Enabling connection draining on Classic Load Balancers ensures that the load balancer 
  stops sending requests to instances that are de-registering or unhealthy. It keeps 
  the existing connections open. This is particularly useful for instances in 
  Auto Scaling groups, to ensure that connections aren't severed abruptly.
