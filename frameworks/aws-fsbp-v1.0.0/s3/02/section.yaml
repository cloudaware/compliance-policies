name: "[S3.2] S3 general purpose buckets should block public read access"
description: |-
  Some use cases may require that everyone on the internet be able to read from 
  your S3 bucket. However, those situations are rare. To ensure the integrity 
  and security of your data, your S3 bucket should not be publicly readable.
