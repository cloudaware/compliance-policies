---
name: >
  [S3.6] S3 general purpose bucket policies should restrict access 
  to other AWS accounts
description: |-
  Implementing least privilege access is fundamental to reducing security risk 
  and the impact of errors or malicious intent. If an S3 bucket policy allows 
  access from external accounts, it could result in data exfiltration by 
  an insider threat or an attacker.

  The `blacklistedactionpatterns` parameter allows for successful evaluation of 
  the rule for S3 buckets. The parameter grants access to external accounts for 
  action patterns that are not included in the `blacklistedactionpatterns` list.
