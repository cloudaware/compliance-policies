name: >
  [S3.13] S3 general purpose buckets should have Lifecycle configurations
description: |-
  Creating a Lifecycle configuration for your S3 bucket defines actions that 
  you want Amazon S3 to take during an object's lifetime. For example, you can 
  transition objects to another storage class, archive them, or delete them 
  after a specified period of time.
