name: "[DataSync.1] DataSync tasks should have logging enabled"
description: |-
  Audit logs track and monitor system activities. They provide a record of events 
  that can help you detect security breaches, investigate incidents, and comply 
  with regulations. Audit logs also enhance the overall accountability and transparency 
  of your organization.
