---
name: "[Cognito.5] MFA should be enabled for Cognito user pools"
description: |-
  This control checks whether an Amazon Cognito user pool configured with a password-only 
  sign-in policy has multi-factor authentication (MFA) enabled. The control fails 
  if the user pool configured with a password-only sign-in policy does not have 
  MFA enabled.

  Multi-factor authentication (MFA) adds a something you have authentication factor 
  to the something you know factor (typically username and password). For federated 
  users, Amazon Cognito delegates authentication to the identity provider (IdP) and 
  doesn't offer additional authentication factors. However, if you have local users 
  with password authentication, configuring MFA for the user pool increases their 
  security.
similar:
