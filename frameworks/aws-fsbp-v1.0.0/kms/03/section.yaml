---
name: "[KMS.3] AWS KMS keys should not be deleted unintentionally"
description: |-
  KMS keys cannot be recovered once deleted. Data encrypted under a KMS key is 
  also permanently unrecoverable if the KMS key is deleted. If meaningful data 
  has been encrypted under a KMS key scheduled for deletion, consider decrypting 
  the data or re-encrypting the data under a new KMS key unless you are 
  intentionally performing a *cryptographic erasure*.

  When a KMS key is scheduled for deletion, a mandatory waiting period is 
  enforced to allow time to reverse the deletion, if it was scheduled in error. 
  The default waiting period is 30 days, but it can be reduced to as short as 
  7 days when the KMS key is scheduled for deletion. During the waiting period, 
  the scheduled deletion can be canceled and the KMS key will not be deleted.
