---
name: "[SSM.7] SSM documents should have the block public sharing setting enabled"
description: |-
  The block public sharing setting for AWS Systems Manager (SSM) documents is an 
  account-level setting. Enabling this setting can prevent unwanted access to 
  your SSM documents. If you enable this setting, your change doesn't affect any 
  SSM documents that you're currently sharing with the public. Unless your use 
  case requires you to share SSM documents with the public, we recommend that you 
  enable the block public sharing setting. The setting can differ for each AWS Region.
