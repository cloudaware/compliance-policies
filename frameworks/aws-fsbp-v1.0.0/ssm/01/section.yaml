---
name: >
  [SSM.1] Amazon EC2 instances should be managed by AWS Systems Manager
description: |-
  To help you to maintain security and compliance, Systems Manager scans your 
  stopped and running managed instances. A managed instance is a machine that 
  is configured for use with Systems Manager. Systems Manager then reports or 
  takes corrective action on any policy violations that it detects. 
  Systems Manager also helps you to configure and maintain your managed instances.
