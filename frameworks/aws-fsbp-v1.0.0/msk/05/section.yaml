name: "[MSK.5] MSK connectors should have logging enabled"
description: |-
  Amazon MSK connectors integrate external systems and Amazon services with Apache 
  Kafka by continuously copying streaming data from a data source into an Apache 
  Kafka cluster, or continuously copying data from a cluster into a data sink. 
  MSK Connect can write log events that can help debug a connector. When you create 
  a connector, you can specify zero or more of the following log destinations: 
  Amazon CloudWatch Logs, Amazon S3, and Amazon Data Firehose.
