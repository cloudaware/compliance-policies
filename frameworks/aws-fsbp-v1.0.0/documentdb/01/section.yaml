---
name: "[DocumentDB.1] Amazon DocumentDB clusters should be encrypted at rest"
description: |-
  Data at rest refers to any data that's stored in persistent, non-volatile storage 
  for any duration. Encryption helps you protect the confidentiality of such data, 
  reducing the risk that an unauthorized user gets access to it. Data in Amazon DocumentDB 
  clusters should be encrypted at rest for an added layer of security. Amazon DocumentDB 
  uses the 256-bit Advanced Encryption Standard (AES-256) to encrypt your data using 
  encryption keys stored in AWS Key Management Service (AWS KMS).
