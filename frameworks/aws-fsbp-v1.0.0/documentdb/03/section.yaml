name: >
  [DocumentDB.3] Amazon DocumentDB manual cluster snapshots should not be public
description: |-
  An Amazon DocumentDB manual cluster snapshot should not be public unless intended. 
  If you share an unencrypted manual snapshot as public, the snapshot is available 
  to all AWS accounts. Public snapshots may result in unintended data exposure.
