name: "[Inspector.3] Amazon Inspector Lambda code scanning should be enabled"
description: |-
  Amazon Inspector Lambda code scanning scans the custom application code within 
  an AWS Lambda function for code vulnerabilities based on AWS security best 
  practices. Lambda code scanning can detect injection flaws, data leaks, weak 
  cryptography, or missing encryption in your code.
similar:
