name: "[Inspector.4] Amazon Inspector Lambda standard scanning should be enabled"
description: |-
  Amazon Inspector Lambda standard scanning identifies software vulnerabilities 
  in the application package dependencies you add to your AWS Lambda function 
  code and layers. If Amazon Inspector detects a vulnerability in your Lambda 
  function application package dependencies, Amazon Inspector produces a detailed 
  Package Vulnerability type finding.
similar:
