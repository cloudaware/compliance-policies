---
name: >
  [StepFunctions.1] Step Functions state machines should have logging turned on
description: |-
  Monitoring helps you maintain the reliability, availability, and performance 
  of Step Functions. You should collect as much monitoring data from the AWS 
  services that you use so you can more easily debug multi-point failures. 
  Having a logging configuration defined for your Step Functions state machines 
  allows for you to track execution history and results in Amazon CloudWatch Logs. 
  Optionally, you can track only errors or fatal events.
