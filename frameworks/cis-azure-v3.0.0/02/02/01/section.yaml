---
name: "2.2.1 Ensure Trusted Locations Are Defined (Manual)"
description: |-
  Microsoft Entra ID Conditional Access allows an organization to configure `Named locations` and 
  configure whether those locations are trusted or untrusted. These settings provide organizations 
  the means to specify Geographical locations for use in conditional access policies, or define 
  actual IP addresses and IP ranges and whether or not those IP addresses and/or ranges are trusted 
  by the organization.
