---
name: "7.4 Ensure that HTTP(S) access from the Internet is evaluated and restricted (Automated)"
description: >
  Network security groups should be periodically evaluated for port misconfigurations. 
  Where certain ports and protocols may be exposed to the Internet, they should be evaluated for 
  necessity and restricted wherever they are not explicitly required and narrowly configured.
