---
name: "4.9 Ensure Private Endpoints are used to access Storage Accounts (Automated)"
description: >
  Use private endpoints for your Azure Storage accounts to allow clients and services to securely 
  access data located over a network via an encrypted Private Link. To do this, the private endpoint 
  uses an IP address from the VNet for each service. Network traffic between disparate services 
  securely traverses encrypted over the VNet. This VNet can also link addressing space, extending 
  your network and accessing resources on it. Similarly, it can be a tunnel through public networks 
  to connect remote infrastructures together. This creates further security through segmenting 
  network traffic and preventing outside sources from accessing it.
