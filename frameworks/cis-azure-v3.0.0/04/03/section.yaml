---
name: "4.3 Ensure that 'Enable key rotation reminders' is enabled for each Storage Account (Manual)"
description: >
  Access Keys authenticate application access requests to data contained in Storage Accounts. 
  A periodic rotation of these keys is recommended to ensure that potentially compromised keys 
  cannot result in a long-term exploitable credential. The "Rotation Reminder" is an automatic 
  reminder feature for a manual procedure. 
