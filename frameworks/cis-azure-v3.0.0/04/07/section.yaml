---
name: "4.7 Ensure Default Network Access Rule for Storage Accounts is Set to Deny (Automated)"
description: >
  Restricting default network access helps to provide a new layer of security, since storage 
  accounts accept connections from clients on any network. To limit access to selected networks, 
  the default action must be changed.
