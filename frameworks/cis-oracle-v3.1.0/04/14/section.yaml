---
name: 4.14 Ensure Cloud Guard is enabled in the root compartment of the tenancy - Level 1 (Automated)
description: >
  Cloud Guard detects misconfigured resources and insecure activity within a
  tenancy and provides security administrators with the visibility to resolve
  these issues. Upon detection, Cloud Guard can suggest, assist, or take
  corrective actions to mitigate these issues. Cloud Guard should be enabled in
  the root compartment of your tenancy with the default configuration, activity
  detectors and responders.
