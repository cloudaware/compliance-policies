name: 4.4 Ensure a notification is configured for IdP group mapping changes - Level 1 (Automated)
description: >
  It is recommended to setup an Event Rule and Notification that gets triggered
  when Identity Provider Group Mappings are created, updated or deleted. Event
  Rules are compartment scoped and will detect events in child compartments. It
  is recommended to create the Event rule at the root compartment level.
