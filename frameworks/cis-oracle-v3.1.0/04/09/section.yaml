name: 4.9 Ensure a notification is configured for changes to route tables - Level 1 (Automated)
description: >
  It is recommended to setup an Event Rule and Notification that gets triggered
  when route tables are created, updated or deleted. Event Rules are compartment
  scoped and will detect events in child compartments, it is recommended to
  create the Event rule at the root compartment level.
