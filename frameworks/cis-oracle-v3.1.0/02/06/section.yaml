---
name: 2.6 Ensure Oracle Integration Cloud (OIC) access is restricted to allowed sources. - Level 1 (Manual)
description: >
  Oracle Integration (OIC) is a complete, secure, but lightweight integration
  solution that enables you to connect your applications in the cloud. It
  simplifies connectivity between your applications and connects both your
  applications that live in the cloud and your applications that still live on
  premises. Oracle Integration provides secure, enterprise- grade connectivity
  regardless of the applications you are connecting or where they reside. OIC
  instances are created within an Oracle managed secure private network with
  each having a public endpoint. The capability to configure ingress filtering
  of network traffic to protect your OIC instances from unauthorized network
  access is included. It is recommended that network access to your OIC
  instances be restricted to your approved corporate IP Addresses or Virtual
  Cloud Networks (VCN)s.
