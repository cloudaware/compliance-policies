---
name: 2.7 Ensure Oracle Analytics Cloud (OAC) access is restricted to allowed sources - Level 1 (Manual)
description: >
  Oracle Analytics Cloud (OAC) is a scalable and secure public cloud service
  that provides a full set of capabilities to explore and perform collaborative
  analytics for you, your workgroup, and your enterprise. OAC instances provide
  ingress filtering of network traffic or can be deployed with in an existing
  Virtual Cloud Network VCN. It is recommended that all new OAC instances be
  deployed within a VCN and that the Access Control Rules are restricted to your
  corporate IP Addresses or VCNs for existing OAC instances.
