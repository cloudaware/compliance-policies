---
name: 2.8 Ensure Oracle Autonomous Shared Databases (ADB) access is restricted to allowed sources - Level 1 (Manual)
description: >
  Oracle Autonomous Database Shared (ADB-S) automates database tuning, security,
  backups, updates, and other routine management tasks traditionally performed
  by DBAs. ADB-S provide ingress filtering of network traffic or can be deployed
  within an existing Virtual Cloud Network (VCN). It is recommended that all new
  ADB-S databases be deployed within a VCN and that the Access Control Rules are
  restricted to your corporate IP Addresses or VCNs for existing ADB-S
  databases.
