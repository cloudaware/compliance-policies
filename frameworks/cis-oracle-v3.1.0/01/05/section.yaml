name: 1.5 Ensure IAM password policy expires passwords within 365 days - Level 1 (Manual)
description: >
  IAM password policies can require passwords to be rotated or expired after a
  given number of days. It is recommended that the password policy expire
  passwords after 365 and are changed immediately based on events.
