---
name: 1.13 Ensure all OCI IAM local user accounts have a valid and current email address (Manual)
description: >
  All OCI IAM local user accounts have an email address field associated with
  the account. It is recommended to specify an email address that is valid and
  current. If you have an email address in your user profile, you can use the
  Forgot Password link on the sign on page to have a temporary password sent to
  you.
