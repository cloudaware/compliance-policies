---
name: 1.4 Ensure IAM password policy requires minimum length of 14 or greater - Level 1 (Automated)
description: >
  Password policies are used to enforce password complexity requirements. IAM
  password policies can be used to ensure passwords are at least a certain
  length and are composed of certain characters. It is recommended the password
  policy require a minimum password length 14 characters and contain 1 non-
  alphabetic character (Number or "Special Character").
