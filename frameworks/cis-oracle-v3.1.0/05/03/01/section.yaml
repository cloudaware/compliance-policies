name: 5.3.1 Ensure File Storage Systems are encrypted with Customer Managed Keys (CMK) - Level 2 (Automated)
description: >
  Oracle Cloud Infrastructure File Storage service (FSS) provides a durable,
  scalable, secure, enterprise-grade network file system. By default, the Oracle
  service manages the keys that encrypt FSS file systems. FSS file systems can
  also be encrypted using a customer managed key.
