name: 4.5 Ensure a log metric filter and alarm exist for CloudTrail configuration
  changes
description: Real-time monitoring of API calls can be achieved by directing CloudTrail
  Logs to CloudWatch Logs and establishing corresponding metric filters and alarms.
  It is recommended that a metric filter and alarm be established for detecting changes
  to CloudTrail's configurations.
