name: >
  6.3.3 All system components are protected from known vulnerabilities by 
  installing applicable security patches/updates
description: |-
  As follows:

  - Critical or high-security patches/updates (identified according to the risk 
  ranking process at Requirement 6.3.1) are installed within one month of release.
  - All other applicable security patches/updates are installed within an 
  appropriate time frame as determined by the entity (for example, within three 
  months of release).
