name: >
  3.7.4 Key management policies and procedures are implemented for 
  cryptographic key changes for keys that have reached the end of their 
  cryptoperiod.
description: |-
  As defined by the associated application vendor or key owner, 
  and based on industry best practices and guidelines.

  Include the following:

  - A defined cryptoperiod for each key type in use.
  - A process for key changes at the end of the defined cryptoperiod.
