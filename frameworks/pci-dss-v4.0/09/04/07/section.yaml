name: >
  9.4.7 Electronic media with cardholder data is destroyed when no longer 
  needed for business or legal reasons.
description: |-
  One of the following:

  - The electronic media is destroyed.
  - The cardholder data is rendered unrecoverable so that it cannot be 
  reconstructed.
