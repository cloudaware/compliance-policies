name: >
  1.4.2 Inbound traffic from untrusted networks to trusted networks is restricted.
description: |-
  To the following:
  
  - Communications with system components that are authorized to provide 
  publicly accessible services, protocols, and ports.
  - Stateful responses to communications initiated by system components in 
  a trusted network.
  - All other traffic is denied.
