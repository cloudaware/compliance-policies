name: >
  12.9.1 TPSPs acknowledge in writing to customers that they are responsible for 
  the security of account data the TPSP possesses or otherwise stores, processes, 
  or transmits on behalf of the customer, or to the extent that they could impact 
  the security of the customer's CDE.
description: |-
  **Additional requirement for service providers only.**
