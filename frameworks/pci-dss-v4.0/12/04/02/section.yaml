name: >
  12.4.2 Reviews are performed at least once every three months to confirm that 
  personnel are performing their tasks in accordance with all security policies 
  and operational procedures
description: |-
  **Additional requirement for service providers only.**

  Include, but are not limited to, the following tasks:
  
  - Daily log reviews.
  - Configuration reviews for network security controls.
  - Applying configuration standards to new systems.
  - Responding to security alerts.
  - Change-management processes.
