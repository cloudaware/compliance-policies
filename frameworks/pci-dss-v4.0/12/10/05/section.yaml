name: >
  12.10.5 The security incident response plan includes monitoring and responding 
  to alerts from security monitoring systems.
description: |-
  Including but not limited to:

  - Intrusion-detection and intrusion-prevention systems.
  - Network security controls.
  - Change-detection mechanisms for critical files.
  - The change-and tamper-detection mechanism for payment pages. This bullet is 
  a best practice until its effective date; refer to Applicability Notes below 
  for details.
  - Detection of unauthorized wireless access points.
