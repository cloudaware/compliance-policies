name: >
  12.5.2.1 PCI DSS scope is documented and confirmed by the entity at least 
  once every six months and upon significant change to the in-scope environment.
description: |-
  **Additional requirement for service providers only.**

  At a minimum, the scoping validation includes all the elements specified 
  in Requirement 12.5.2.
