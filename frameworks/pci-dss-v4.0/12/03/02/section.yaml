name: >
  12.3.2 A targeted risk analysis is performed for each PCI DSS requirement 
  that the entity meets with the customized approach.
description: |-
  Includes:

  - Documented evidence detailing each element specified in Appendix D: 
  Customized Approach (including, at a minimum, a controls matrix and risk analysis).
  - Approval of documented evidence by senior management.
  - Performance of the targeted analysis of risk at least once every 12 months.
