name: >
  12.8.2 Written agreements with TPSPs are maintained.
description: |-
  As follows:

  - Written agreements are maintained with all TPSPs with which account data is 
  shared or that could affect the security of the CDE.
  - Written agreements include acknowledgments from TPSPs that they are 
  responsible for the security of account data the TPSPs possess or otherwise 
  store, process, or transmit on behalf of the entity, or to the extent that 
  they could impact the security of the entity's CDE.
