name: >
  11.5.2 A change-detection mechanism (for example, file integrity monitoring 
  tools) is deployed.
description: |-
  As follows:
  
  - To alert personnel to unauthorized modification (including changes, 
  additions, and deletions) of critical files.
  - To perform critical file comparisons at least once weekly.
