name: >
  11.3.1 Internal vulnerability scans are performed.
description: |-
  As follows:
  
  - At least once every three months.
  - High-risk and critical vulnerabilities (per the entity's vulnerability risk 
  rankings defined at Requirement 6.3.1) are resolved.
  - Rescans are performed that confirm all high-risk and critical 
  vulnerabilities (as noted above) have been resolved.
  - Scan tool is kept up to date with latest vulnerability information.
  - Scans are performed by qualified personnel and organizational independence 
  of the tester exists.
