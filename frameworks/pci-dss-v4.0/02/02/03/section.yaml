name: >
  2.2.3 Primary functions requiring different security levels are managed.
description: |-
  As follows:

  - Only one primary function exists on a system component,

  OR

  - Primary functions with differing security levels that exist on the same 
  system component are isolated from each other,

  OR

  - Primary functions with differing security levels on the same system component 
  are all secured to the level required by the function with the highest 
  security need.
