name: >
  7.2.5.1 All access by application and system accounts and related access 
  privileges are reviewed.
description: |-
  As follows:

  - Periodically (at the frequency defined in the entity's targeted risk 
  analysis, which is performed according to all elements specified in 
  Requirement 12.3.1).
  - The application/system access remains appropriate for the function being 
  performed.
  - Any inappropriate access is addressed.
  - Management acknowledges that access remains appropriate.
