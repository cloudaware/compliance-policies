name: >
  8.4.3 MFA is implemented for all remote network access originating from 
  outside the entity's network that could access or impact the CDE.
description: |-
  As follows:

  - All remote access by all personnel, both users and administrators, 
  originating from outside the entity's network.
  - All remote access by third parties and vendors.
