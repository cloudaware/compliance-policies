name: >
  8.3.11 Where authentication factors such as physical or logical security tokens, 
  smart cards, or certificates are used factors are assigned to an individual 
  user and not shared among multiple users, and physical and/or logical controls 
  ensure only the intended user can use that factor to gain access.
