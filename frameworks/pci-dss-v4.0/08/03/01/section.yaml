name: >
  8.3.1 All user access to system components for users and administrators 
  is authenticated.
description: |-
  At least one of the following authentication factors:
  
  - Something you know, such as a password or passphrase.
  - Something you have, such as a token device or smart card.
  - Something you are, such as a biometric element.
