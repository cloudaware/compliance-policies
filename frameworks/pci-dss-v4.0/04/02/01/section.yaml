name: >
  4.2.1 Strong cryptography and security protocols are implemented to safeguard 
  PAN during transmission over open, public networks.
description: |-
  As following:

  - Only trusted keys and certificates are accepted.
  - Certificates used to safeguard PAN during transmission over open, public 
  networks are confirmed as valid and are not expired or revoked. This bullet 
  is a best practice until its effective date; refer to applicability notes 
  below for details.
  - The protocol in use supports only secure versions or configurations and does 
  not support fallback to, or use of insecure versions, algorithms, key sizes, 
  or implementations.
  - The encryption strength is appropriate for the encryption methodology in use.
