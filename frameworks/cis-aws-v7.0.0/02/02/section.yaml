---
name: 2.2 Maintain current AWS account contact details (Manual)
description: |-
  Ensure contact email and telephone details for AWS accounts are current and mapped
  to more than one individual in your organization.

  An AWS account supports a number of contact details, and AWS will use these to
  contact the account owner if activity judged to be in breach of the Acceptable Use Policy
  or indicative of a likely security compromise is observed by the AWS Abuse team.
  Contact details should not be associated with a single individual, as circumstances may
  arise where that individual is unavailable. Email contact details should point to a mail
  alias that forwards messages to multiple individuals within the organization; where
  feasible, phone contact details should point to a PABX hunt group or other callforwarding
  system. In AWS Organizations environments, this applies to all member
  accounts, not just the management account.
