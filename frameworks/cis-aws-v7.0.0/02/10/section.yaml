---
name: 2.10 Ensure multi-factor authentication (MFA) is enabled for all IAM users that have a console password (Automated)
description: >
  Multi-Factor Authentication (MFA) adds an extra layer of authentication assurance
  beyond traditional credentials. With MFA enabled, when a user signs in to the AWS
  Console, they are prompted for their username and password as well as an
  authentication code from their physical or virtual MFA device. It is recommended that
  MFA be enabled for all IAM users that have a console password.
