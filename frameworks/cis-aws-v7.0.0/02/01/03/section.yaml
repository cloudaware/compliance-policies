---
name: 2.1.3 Ensure Organizations management account is not used for workloads (Manual)
description: |-
  Ensure that the AWS Organizations management account is used only for
  organizational governance tasks and does not host production workloads, applications,
  or business data. The management account is the most privileged account in an AWS
  Organization and performs sensitive administrative functions such as creating and
  managing member accounts, applying service control policies (SCPs), and managing
  consolidated billing. Workloads, applications, and associated data should be deployed
  in dedicated member accounts, not in the management account.
