---
name: "3.1.3 Ensure that traffic is encrypted between cluster worker nodes (Manual)"
description: >
  By default, data exchanged between worker nodes in an Azure Databricks cluster is not encrypted. 
  To ensure that data is encrypted at all times, whether at rest or in transit, you can create an 
  initialization script that configures your clusters to encrypt traffic between worker nodes using 
  AES 256-bit encryption over a TLS 1.3 connection.