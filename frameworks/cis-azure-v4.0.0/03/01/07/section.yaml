---
name: "3.1.7 Ensure that diagnostic log delivery is configured for Azure Databricks (Manual)"
description: >
  Azure Databricks Diagnostic Logging provides insights into system operations, user activities, 
  and security events within a Databricks workspace. Enabling diagnostic logs helps organizations:

  • Detect security threats by logging access, job executions, and cluster activities.
  • Ensure compliance with industry regulations such as SOC 2, HIPAA, and GDPR.
  • Monitor operational performance and troubleshoot issues proactively.
  