name: "6.2.4 Ensure that a multifactor authentication policy exists for all users (Manual)"
description: >
  A Conditional Access policy can be enabled to ensure that users are required to use 
  Multifactor Authentication (MFA) to login.

  Note: Since 2024, Azure has been rolling out mandatory multifactor authentication. For more information:
  • <https://azure.microsoft.com/en-us/blog/announcing-mandatory-multi-factor-authentication-for-azure-sign-in>
  • <https://learn.microsoft.com/en-us/entra/identity/authentication/concept-mandatory-multifactor-authentication>
