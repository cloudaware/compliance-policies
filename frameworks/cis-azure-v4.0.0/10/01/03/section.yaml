---
name: "10.1.3 Ensure 'SMB channel encryption' is set to 'AES-256-GCM' or higher for SMB file shares (Automated)"
description: >
  Implement SMB channel encryption with AES-256-GCM for SMB file shares to ensure 
  data confidentiality and integrity in transit. This method offers strong protection against 
  eavesdropping and man-in-the-middle attacks, safeguarding sensitive information.
