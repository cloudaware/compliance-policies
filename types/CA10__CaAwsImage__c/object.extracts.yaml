---
extracts:
# Nulable. Boolean. Values: true, false.
  - name: "CA10__public__c"
    value: 
      FIELD:
        path: "CA10__public__c"
# Values: pending | available | invalid | deregistered | transient | failed | error | disabled. 
# Not nullable
  - name: "CA10__state__c"
    value: 
      FIELD:
        path: "CA10__state__c"
        undeterminedIf:
          isEmpty: "The AMI state is not collected."
#Not nullable
  - name: "CA10__creationDate__c"
    value: 
      FIELD:
        path: "CA10__creationDate__c"
# Nullable
  - name: "CA10__lastLaunchedTime__c"
    value: 
      FIELD:
        path: "CA10__lastLaunchedTime__c"
  # Optional. An absent date on a resolved AMI means no scheduled deprecation.
  - name: CA10__deprecationTime__c
    value:
      FIELD:
        path: CA10__deprecationTime__c
