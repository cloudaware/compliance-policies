# yaml-language-server: $schema=../../schema/Extracts.schema.json
---
extracts:
  - name: "CA10__policyDocument__c"
    value:
      FIELD:
        path: "CA10__policyDocument__c"
        returnType: BYTES
        undeterminedIf:
          noAccessDelegate:
            path: "CA10__policyDocument__c"
