---
extracts:
  # eks:DescribeCluster platformVersion: eks.N, or eks-local-outposts.N for legacy local clusters.
  - name: CA10A1__platformVersion__c
    value:
      FIELD:
        path: CA10A1__platformVersion__c
        undeterminedIf:
          isEmpty: The EKS platform version is missing from inventory.
  - name: CA10A1__version__c
    value:
      FIELD:
        path: CA10A1__version__c
        undeterminedIf:
          isEmpty: The EKS Kubernetes version is missing from inventory.
  - name: CA10A1__status__c
    value:
      FIELD:
        path: CA10A1__status__c
        undeterminedIf:
          isEmpty: The EKS cluster status is missing from inventory.
#Values: Enabled | Disabled. Not Nullable.
  - name: CA10A1__endpointPublicAccess__c
    value: 
      FIELD:
        path: CA10A1__endpointPublicAccess__c
        undeterminedIf:
          noAccessDelegate:
            path: CA10A1__endpointPublicAccess__c
            currentStateMessage: "Endpoint Public Access cannot be empty. Possible permission issues with eks:DescribeCluster."
#LONG_TEXT_AREA with IP addresses divided by \n. Nullable
  - name: CA10A1__publicAccessCidrs__c
    value: 
      FIELD:
        path: CA10A1__publicAccessCidrs__c
#Values: array of strings
      # api: Enabled\n
      # audit: Enabled\n
      # authenticator: Enabled\n
      # controllerManager: Enabled\n
      # scheduler: Enabled\n
  - name: CA10A1__logging__c
    value: 
      FIELD:
        path: CA10A1__logging__c
        undeterminedIf:
          noAccessDelegate:
            path: CA10A1__logging__c
            currentStateMessage: "Cluster Logging cannot be empty. Possible permission issues with eks:DescribeCluster."
  - name: caSetFrom_logging__c
    value:
      SET_FROM:
        separator: "\n"
        arg:
          EXTRACT: "CA10A1__logging__c"
