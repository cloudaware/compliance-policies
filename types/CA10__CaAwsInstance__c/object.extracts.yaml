  - name: "CA10__averageMemoryUsedTwoWeeks__c"
    value:
      FIELD:
        path: "CA10__averageMemoryUsedTwoWeeks__c"
  # Nullable.
  - name: "CA10__nagiosMemoryUtilization__c"
    value:
      FIELD:
        path: "CA10__nagiosMemoryUtilization__c"
