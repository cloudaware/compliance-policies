          IS_EQUAL:
            left:
              LIST_FROM:
                separator: "\n"
                arg:
                  TEXT: "line1\nline2\nline3\n"
            right:
              LIST:
                itemType: TEXT
                items:
                  - "line1"
                  - "line2"
                  - "line3"
                  - ""
