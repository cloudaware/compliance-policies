    currentStateMessage: From-Null
    check:
      UNIT_TEST:
        id: From-Null
        expected:
          text: "unitTest(From-Null): null.asListOfText(',') == listOfText([])"
        arg:
          IS_EQUAL:
            left:
              LIST_FROM:
                separator: ","
                arg:
                  UNIT_TEST_NULL:
                    returnType: TEXT
            right:
              LIST:
                itemType: TEXT
                items: []
  - status: COMPLIANT
    currentStateMessage: From-Empty
    check:
      UNIT_TEST:
        id: From-Empty
        expected:
          text: "unitTest(From-Empty): ''.asListOfText(',') == listOfText([''])"
        arg:
          IS_EQUAL:
            left:
              LIST_FROM:
                separator: ","
                arg:
                   TEXT: ""
            right:
              LIST:
                itemType: TEXT
                items:
                  - ""
  - status: COMPLIANT
    currentStateMessage: From-Whitespace
    check:
      UNIT_TEST:
        id: From-Whitespace
        expected:
          text: "unitTest(From-Whitespace): ' '.asListOfText(',') == listOfText([''])"
        arg:
          IS_EQUAL:
            left:
              LIST_FROM:
                separator: ","
                arg:
                  TEXT: " "
            right:
              LIST:
                itemType: TEXT
                items:
                  - ""
  - status: COMPLIANT
    currentStateMessage: Single
    check:
      UNIT_TEST:
        id: Single
        expected:
          text: "unitTest(Single): 'a'.asListOfText(',') == listOfText(['a'])"
        arg:
          IS_EQUAL:
            left:
              LIST_FROM:
                separator: ","
                arg:
                  TEXT: "a"
            right:
              LIST:
                itemType: TEXT
                items:
                  - "a"
  - status: COMPLIANT
    currentStateMessage: Single-Case
    check:
      UNIT_TEST:
        id: Single-Case
        expected:
          text: "unitTest(Single-Case): 'A'.asListOfText(',') == listOfText(['a'])"
        arg:
          IS_EQUAL:
            left:
              LIST_FROM:
                separator: ","
                arg:
                  TEXT: "A"
            right:
              LIST:
                itemType: TEXT
                items:
                  - "a"
  - status: COMPLIANT
    currentStateMessage: Single-Whitespaces
    check:
      UNIT_TEST:
        id: Single-Whitespaces
        expected:
          text: "unitTest(Single-Whitespaces): ' a '.asListOfText(',') == listOfText(['a'])"
        arg:
          IS_EQUAL:
            left:
              LIST_FROM:
                separator: ","
                arg:
                  TEXT: " a "
            right:
              LIST:
                itemType: TEXT
                items:
                  - "a"
  - status: COMPLIANT
    currentStateMessage: Empty-Values
    check:
      UNIT_TEST:
        id: Empty-Values
        expected:
          text: "unitTest(Empty-Values): ','.asListOfText(',') == listOfText(['', ''])"
        arg:
          IS_EQUAL:
            left:
              LIST_FROM:
                separator: ","
                arg:
                  TEXT: ","
            right:
              LIST:
                itemType: TEXT
                items:
                  - ""
                  - ""
  - status: COMPLIANT
    currentStateMessage: Duplicate
    check:
      UNIT_TEST:
        id: Duplicate
        expected:
          text: "unitTest(Duplicate): 'a,a'.asListOfText(',') != listOfText(['a'])"
        arg:
          NOT_EQUAL:
            left:
              LIST_FROM:
                separator: ","
                arg:
                  TEXT: "a,a"
            right:
              LIST:
                itemType: TEXT
                items:
                  - "a"
  - status: COMPLIANT
    currentStateMessage: Order
    check:
      UNIT_TEST:
        id: Order
        expected:
          text: "unitTest(Order): 'a,b'.asListOfText(',') != listOfText(['b', 'a'])"
        arg:
          NOT_EQUAL:
            left:
              LIST_FROM:
                separator: ","
                arg:
                  TEXT: "a,b"
            right:
              LIST:
                itemType: TEXT
                items:
                  - "b"
                  - "a"
