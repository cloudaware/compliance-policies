    currentStateMessage: Separator-NewLine
    check:
      UNIT_TEST:
        id: Separator-NewLine
        expected:
          text: "unitTest(Separator-NewLine): 'line1\\nline2\\nline3\\n'.asListOfText('\\n') == listOfText(['line1', 'line2', 'line3', ''])"
