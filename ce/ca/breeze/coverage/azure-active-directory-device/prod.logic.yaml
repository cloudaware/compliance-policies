---
inputType: CA10Z1__CaAzureActiveDirectoryDevice__c
importExtracts:
  - file: /types/CA10Z1__CaAzureActiveDirectoryDevice__c/breeze.extracts.yaml
testData:
  - file: ../test-data-ca10z1.json
conditions:
  - status: INCOMPLIANT
    currentStateMessage: "The device has never had the breeze agent installed."
    remediationMessage: "Install the breeze agent on the device."
    check:
      IS_EMPTY:
        arg:
          EXTRACT: breezeLastUpdate
  - status: INCOMPLIANT
    currentStateMessage: "The latest breeze report for this device is more than a day old."
    remediationMessage: "Reinstall the breeze agent on the device and confirm it is reporting."
    check:
      IS_BEYOND_LAST_DAYS:
        offsetDays: 1
        arg:
          EXTRACT: breezeLastUpdate
otherwise:
  status: COMPLIANT
  currentStateMessage: "The breeze agent is installed on the device and has a recent report."

