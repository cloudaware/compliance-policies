---
inputType: CA10A1__CaAwsEksCluster__c
importExtracts:
  - file: /types/CA10A1__CaAwsEksCluster__c/breeze.extracts.yaml
testData:
  - file: ../test-data-ca10a1.json
conditions:
  - status: INCOMPLIANT
    currentStateMessage: "The cluster has never had the breeze agent installed."
    remediationMessage: "Install the breeze agent on the cluster."
    check:
      IS_EMPTY:
        arg:
          EXTRACT: breezeLastUpdate
  - status: INCOMPLIANT
    currentStateMessage: "The latest breeze report for this cluster is more than a day old."
    remediationMessage: "Reinstall the breeze agent on the cluster and confirm it is reporting."
    check:
      IS_BEYOND_LAST_DAYS:
        offsetDays: 1
        arg:
          EXTRACT: breezeLastUpdate
otherwise:
  status: COMPLIANT
  currentStateMessage: "The breeze agent is installed on the cluster and has a recent report."

