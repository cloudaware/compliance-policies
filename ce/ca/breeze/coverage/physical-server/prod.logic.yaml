---
inputType: CA10__CaPhysicalServer__c
importExtracts:
  - file: /types/CA10__CaPhysicalServer__c/breeze.extracts.yaml
testData:
  - file: test-data.json
conditions:
  - status: INCOMPLIANT
    currentStateMessage: "The server has never had the breeze agent installed."
    remediationMessage: "Install the breeze agent on the server."
    check:
      IS_EMPTY:
        arg:
          EXTRACT: breezeLastUpdate
  - status: INCOMPLIANT
    currentStateMessage: "The latest breeze report for this server is more than a day old."
    remediationMessage: "Reinstall the breeze agent on the server and confirm it is reporting."
    check:
      IS_BEYOND_LAST_DAYS:
        offsetDays: 1
        arg:
          EXTRACT: breezeLastUpdate
otherwise:
  status: COMPLIANT
  currentStateMessage: "The breeze agent is installed on the server and has a recent report."

