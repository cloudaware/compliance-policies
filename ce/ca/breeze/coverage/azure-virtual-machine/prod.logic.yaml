---
inputType: CA10__CaAzureVirtualMachine__c
importExtracts:
  - file: /types/CA10__CaAzureVirtualMachine__c/breeze.extracts.yaml
testData:
  - file: ../test-data-ca10.json
conditions:
  - status: INCOMPLIANT
    currentStateMessage: "The virtual machine has never had the breeze agent installed."
    remediationMessage: "Install the breeze agent on the virtual machine."
    check:
      IS_EMPTY:
        arg:
          EXTRACT: breezeLastUpdate
  - status: INCOMPLIANT
    currentStateMessage: "The latest breeze report for this virtual machine is more than a day old."
    remediationMessage: "Reinstall the breeze agent on the virtual machine and confirm it is reporting."
    check:
      IS_BEYOND_LAST_DAYS:
        offsetDays: 1
        arg:
          EXTRACT: breezeLastUpdate
otherwise:
  status: COMPLIANT
  currentStateMessage: "The breeze agent is installed on the virtual machine and has a recent report."

