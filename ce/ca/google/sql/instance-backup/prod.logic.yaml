---

inputType: "CA10__CaGoogleSqlInstance__c"
testData:
  - file: test-data.json
importExtracts:
  - file: /types/CA10__CaGoogleSqlInstance__c/object.extracts.yaml
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "Automated backups are not available for read replica instances."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10__instanceType__c"
        right:
          TEXT: "READ_REPLICA_INSTANCE"
  - status: "COMPLIANT"
    currentStateMessage: "Automated backups are configured for the SQL instance."
    check:
      AND:
        args:
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__backupEnabled__c"
              right:
                BOOLEAN: true
          - NOT_EMPTY:
              arg:
                EXTRACT: CA10__backupStartTime__c
otherwise:
  status: "INCOMPLIANT"
  currentStateMessage: "Automated backups are disabled for the Cloud SQL instance."
  remediationMessage: "Enable automated backups for the Cloud SQL instance."




