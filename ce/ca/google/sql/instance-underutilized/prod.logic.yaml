---
inputType: "CA10__CaGoogleSqlInstance__c"
importExtracts:
  - file: "/types/CA10__CaGoogleSqlInstance__c/object.extracts.yaml"
testData:
  - file: 'test-data.json'
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "The instance is not running."
    check:
      NOT_EQUAL:
        left:
          EXTRACT: "CA10__state__c"
        right:
          TEXT: "RUNNABLE"
  - status: "INAPPLICABLE"
    currentStateMessage: "The instance has been created less than 30 days ago."
    check:
      NOT:
        arg:
          IS_BEYOND_LAST_DAYS:
            offsetDays: 30
            arg:
              EXTRACT: "CA10__createTime__c"
  - status: "UNDETERMINED"
    currentStateMessage: "There is not enough data in the CMDB to determine whether the instance is underutilized."
    check:
      OR:
        args:
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__cpuUtilizationAvg30Day__c"
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__memoryUtilizationAvg30Day__c"
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__diskReadIoOpsRate30Day__c"
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__diskWriteIoOpsRate30Day__c"
  - status: "INAPPLICABLE"
    currentStateMessage: "The instance is idle and is evaluated by the Google Cloud SQL instance idle policy."
    check:
      AND:
        args:
          - LESS_THAN:
              left:
                EXTRACT: CA10__cpuUtilizationAvg30Day__c
              right:
                NUMBER: 5.0
          - LESS_THAN_EQUAL:
              left:
                EXTRACT: CA10__cloudSqlConnectionsAvg30Day__c
              right:
                NUMBER: 0.0
  - status: INCOMPLIANT
    currentStateMessage: "The instance is underutilized with CPU utilization < 20%, memory utilization < 40%, and disk < 50 IOPS."
    remediationMessage: "Rightsize or consolidate the instance."
    check:
      AND:
        args:
          - LESS_THAN:
              left:
                EXTRACT: CA10__cpuUtilizationAvg30Day__c
              right:
                NUMBER: 20.0
          - LESS_THAN:
              left:
                EXTRACT: CA10__memoryUtilizationAvg30Day__c
              right:
                NUMBER: 40.0
          - LESS_THAN:
              left:
                EXTRACT: CA10__diskReadIoOpsRate30Day__c
              right:
                NUMBER: 50.0
          - LESS_THAN:
              left:
                EXTRACT: CA10__diskWriteIoOpsRate30Day__c
              right:
                NUMBER: 50.0
otherwise:
  status: "COMPLIANT"
  currentStateMessage: "The instance is not underutilized."




