---

inputType: "CA10__CaGoogleSqlInstance__c"
testData:
  - file: test-data.json
importExtracts:
  - file: /types/CA10__CaGoogleSqlInstance__c/object.extracts.yaml
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "This is not a MySQL database instance."
    check:
      NOT:
        arg:
          CONTAINS:
            arg:
              EXTRACT: "CA10__databaseVersion__c"
            search:
              TEXT: "MYSQL" 
  - status: "COMPLIANT"
    currentStateMessage: "The local_infile database flag is set to off."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "caJsonText__databaseFlagsLocalInfileFlagValue__c"
        right:
          TEXT: "off"
otherwise:
  status: "INCOMPLIANT"
  currentStateMessage: "The local_infile database flag is not set to off."
  remediationMessage: "Set local_infile database flag to off."



