---

inputType: "CA10__CaGoogleSqlInstance__c"
testData:
  - file: test-data.json
importExtracts:
  - file: /types/CA10__CaGoogleSqlInstance__c/object.extracts.yaml
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "This is not a SQL Server database instance."
    check:
      NOT:
        arg:
          CONTAINS:
            arg:
              EXTRACT: "CA10__databaseVersion__c"
            search:
              TEXT: "SQLSERVER" 
  - status: "COMPLIANT"
    currentStateMessage: "The contained database authentication database flag is not set to on."
    check:
      NOT:
        arg:
          IS_EQUAL:
            left:
              EXTRACT: "caJsonText__databaseFlagsContainedDatabaseAuthenticationFlagValue__c"
            right:
              TEXT: "on"
otherwise:
  status: "INCOMPLIANT"
  currentStateMessage: "The contained database authentication database flag is set to on."
  remediationMessage: "Set the contained database authentication database flag to off."



