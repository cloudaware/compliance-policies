---

inputType: "CA10__CaGoogleSqlInstance__c"
testData:
  - file: test-data.json
importExtracts:
  - file: /types/CA10__CaGoogleSqlInstance__c/object.extracts.yaml
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "This is not a PostgreSQL database instance."
    check:
      NOT:
        arg:
          CONTAINS:
            arg:
              EXTRACT: "CA10__databaseVersion__c"
            search:
              TEXT: "POSTGRE" 
  - status: "COMPLIANT"
    currentStateMessage: "The cloudsql.enable_pgaudit database flag is set to on."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "caJsonText__databaseFlagsCloudsqlEnablePgauditFlagValue__c"
        right:
          TEXT: "on"
otherwise:
  status: "INCOMPLIANT"
  currentStateMessage: "The cloudsql.enable_pgaudit database flag is not set to on."
  remediationMessage: "Set the cloudsql.enable_pgaudit database flag to on."




