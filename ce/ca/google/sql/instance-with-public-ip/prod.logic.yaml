---

inputType: "CA10__CaGoogleSqlInstance__c"
testData:
  - file: test-data.json
importExtracts:
  - file: /types/CA10__CaGoogleSqlInstance__c/object.extracts.yaml
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "Only CLOUD_SQL_INSTANCE with backendType SECOND_GEN can be configured with a private IP address."
    check:
      OR:
        args:
          - NOT_EQUAL:
              left:
                EXTRACT: "CA10__instanceType__c"
              right:
                TEXT: "CLOUD_SQL_INSTANCE"
          - NOT_EQUAL:
              left:
                EXTRACT: "CA10__backendType__c"
              right:
                TEXT: "SECOND_GEN"                
  - status: "INCOMPLIANT"
    currentStateMessage: "The SQL instance has public IP addresses."
    remediationMessage: "Remove public IP addresses and use a private IP instead."
    check:
      RELATED_LIST_HAS:
        status: "INCOMPLIANT"
        relationshipName: "CA10__Google_Cloud_SQL_Instance_IP_Addresses__r"
otherwise:
  status: "COMPLIANT"
  currentStateMessage: "The Cloud SQL instance does not have public IP addresses."
relatedLists:
   - relationshipName: "CA10__Google_Cloud_SQL_Instance_IP_Addresses__r"
     importExtracts:
       - file: /types/CA10__CaGoogleSqlInstanceIpAddress__c/object.extracts.yaml
     conditions: 
       - status: "INCOMPLIANT"
         currentStateMessage: "This is a public IP address."
         check:
          IS_EQUAL:
            left:
              EXTRACT: "CA10__type__c"
            right:
              TEXT: "PRIMARY"
     otherwise:
       status: "COMPLIANT"
       currentStateMessage: "This is not a public IP address."




