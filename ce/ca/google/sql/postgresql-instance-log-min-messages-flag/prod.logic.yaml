---

inputType: "CA10__CaGoogleSqlInstance__c"
testData:
  - file: test-data.json
importExtracts:
  - file: /types/CA10__CaGoogleSqlInstance__c/object.extracts.yaml
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "This is not a PostgreSQL database instance."
    check:
      NOT:
        arg:
          CONTAINS:
            arg:
              EXTRACT: "CA10__databaseVersion__c"
            search:
              TEXT: "POSTGRE" 
  - status: "COMPLIANT"
    currentStateMessage: "The log_min_messages database flag is set appropriately."
    check:
      CONTAINS:
        arg:
          SET:
            itemType: TEXT
            items:
              - "WARNING"
              - "ERROR"
              - "LOG"
              - "FATAL"
              - "PANIC"
        search:
          EXTRACT: "caJsonText__databaseFlagsLogMinMessagesFlagValue__c"
otherwise:
  status: "INCOMPLIANT"
  currentStateMessage: "The log_min_messages database flag is not set appropriately."
  remediationMessage: "Set the log_min_messages database flag to WARNING or a higher severity level."




