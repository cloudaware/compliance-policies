    currentStateMessage: "Service account key is older than 90 days."
    remediationMessage: "Rotate service account keys at least every 90 days."
    check:
      IS_BEYOND_LAST_DAYS:
        offsetDays: 90
        arg:
          EXTRACT: CA10__validAfter__c
otherwise:
