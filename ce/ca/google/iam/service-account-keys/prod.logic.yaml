---
inputType: "CA10__CaGoogleIamServiceAccount__c"
testData:
  - file: test-data.json
importExtracts:
  - file: /types/CA10__CaGoogleIamServiceAccount__c/object.extracts.yaml
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "Only applicable to user-managed service accounts."
    check:
      NOT:
        arg:
          ENDS_WITH:
           arg:
            EXTRACT: CA10__serviceAccountEmail__c
           search:
            TEXT: "iam.gserviceaccount.com"
  - status: "INCOMPLIANT"
    currentStateMessage: "User-managed service accounts have user-managed keys."
    remediationMessage: "Delete user-managed service account keys."
    check:
      RELATED_LIST_HAS:
        status: "INCOMPLIANT"
        relationshipName: "CA10__Google_IAM_Service_Account_Keys__r"
otherwise:
  status: "COMPLIANT"
  currentStateMessage: "User-managed service accounts do not have user-managed keys."
relatedLists:
  - relationshipName: "CA10__Google_IAM_Service_Account_Keys__r"
    conditions: []
    otherwise:
      status: "INCOMPLIANT" 
      currentStateMessage: "Service account key is enabled."
