---

inputType: "CA10__CaGoogleResourceManagerOrganization__c"
testData:
  - file: test-data.json
importExtracts:
  - file: /types/CA10__CaGoogleResourceManagerOrganization__c/object.extracts.yaml
conditions:
  - status: "COMPLIANT"
    currentStateMessage: "Essential Contacts is configured for the organization."
    check:
      OR:
        args:
          - CONTAINS:
              arg:
                EXTRACT: "caJsonText__essentialContactsConfigurationNotificationCategoryWithEmail"
              search:
                TEXT: "ALL"
          - AND:
              args:
                - CONTAINS:
                    arg:
                      EXTRACT: "caJsonText__essentialContactsConfigurationNotificationCategoryWithEmail"
                    search:
                      TEXT: "LEGAL"
                - CONTAINS:
                    arg:
                      EXTRACT: "caJsonText__essentialContactsConfigurationNotificationCategoryWithEmail"
                    search:
                      TEXT: "SECURITY"
                - CONTAINS:
                    arg:
                      EXTRACT: "caJsonText__essentialContactsConfigurationNotificationCategoryWithEmail"
                    search:
                      TEXT: "SUSPENSION"
                - CONTAINS:
                    arg:
                      EXTRACT: "caJsonText__essentialContactsConfigurationNotificationCategoryWithEmail"
                    search:
                      TEXT: "TECHNICAL"
otherwise:
  status: "INCOMPLIANT"
  currentStateMessage: "Essential Contacts is not configured for the organization."
  remediationMessage: "Configure Essential Contacts for LEGAL, SECURITY, SUSPENSION, and TECHNICAL notifications."
