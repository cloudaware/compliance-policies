---

inputType: "CA10__CaGoogleProject__c"
testData:
  - file: test-data.json
conditions:
  - status: "COMPLIANT"
    currentStateMessage: "Log sinks are configured for all log entries."
    check:
      RELATED_LIST_HAS:
        status: "COMPLIANT"
        relationshipName: "CA10__Google_Resource_Manager_Projects__r"
otherwise:
  status: "INCOMPLIANT"
  currentStateMessage: "The project does not have sinks configured for all log entries."
  remediationMessage: "Create a sink that exports copies of all log entries."
relatedLists:
  - relationshipName: "CA10__Google_Resource_Manager_Projects__r"
    importExtracts:
      - file: /types/CA10G1__CaGoogleLoggingLogSink__c/object.extracts.yaml
    conditions:
      - status: "COMPLIANT"
        currentStateMessage: "Resource Manager organization, folder, or project has a compliant sink."
        check:
          OR:
            args:
              - RELATED_LIST_HAS:
                  status: "COMPLIANT"
                  relationshipName: "CA10G1__Google_Logging_Log_Sinks1__r"
              - RELATED_LIST_HAS:
                  status: "COMPLIANT"
                  relationshipName: "CA10__resourceManagerFolder__r.CA10G1__Google_Logging_Log_Sinks1__r"
              - RELATED_LIST_HAS:
                  status: "COMPLIANT"
                  relationshipName: "CA10__resourceManagerOrganization__r.CA10G1__Google_Logging_Log_Sinks1__r"
    otherwise:
      status: "INCOMPLIANT"
      currentStateMessage: "No compliant sink is connected to the project."
    relatedLists:
        # # ORG level
      - relationshipName: "CA10__resourceManagerOrganization__r.CA10G1__Google_Logging_Log_Sinks1__r"
        recordTypes:
          - "caGoogleLoggingLogSinkOrganization"
        conditions:
          - status: "COMPLIANT"
            currentStateMessage: "Resource Manager organization has a compliant sink."
            check:
              AND:
                args:
                  - IS_EMPTY:
                      arg:
                        EXTRACT: "CA10G1__filter__c"
                  - NOT_EMPTY:
                      arg:
                        EXTRACT: "CA10G1__destination__c"
        otherwise:
          status: "INCOMPLIANT"
          currentStateMessage: "Resource Manager Organization does not have sinks configured for all log entries."
    # FOLDER level
      - relationshipName: "CA10__resourceManagerFolder__r.CA10G1__Google_Logging_Log_Sinks1__r"
        recordTypes:
          - "caGoogleLoggingLogSinkFolder"
        conditions: 
          - status: "COMPLIANT"
            currentStateMessage: "Resource Manager folder has a compliant sink."
            check:
              AND:
                args:
                  - IS_EMPTY:
                      arg:
                        EXTRACT: "CA10G1__filter__c"
                  - NOT_EMPTY:
                      arg:
                        EXTRACT: "CA10G1__destination__c"
        otherwise:
          status: "INCOMPLIANT"
          currentStateMessage: "Resource Manager Folder does not have sinks configured for all log entries."
    # PROJECT level  
      - relationshipName: "CA10G1__Google_Logging_Log_Sinks1__r"
        recordTypes:
          - "caGoogleLoggingLogSinkProject"
        conditions: 
          - status: "COMPLIANT"
            currentStateMessage: "Resource Manager project has a compliant sink."
            check:
              AND:
                args:
                  - IS_EMPTY:
                      arg:
                        EXTRACT: "CA10G1__filter__c"
                  - NOT_EMPTY:
                      arg:
                        EXTRACT: "CA10G1__destination__c"
        otherwise:
          status: "INCOMPLIANT"
          currentStateMessage: "Resource Manager Project does not have sinks configured for all log entries."



