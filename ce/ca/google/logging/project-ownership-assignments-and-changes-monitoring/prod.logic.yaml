---

inputType: "CA10__CaGoogleProject__c"
testData:
  - file: test-data.json
importExtracts:
  - file: /types/CA10__CaGoogleProject__c/object.extracts.yaml
conditions:
  - status: "COMPLIANT"
    currentStateMessage: "Log metric filters and alert policies are in place for project ownership assignments and changes."
    check:
      RELATED_LIST_HAS:
        relationshipName: "CA10__Google_Logging_Log_Metrics__r"
        status: "COMPLIANT"
otherwise:
  status: "INCOMPLIANT"
  currentStateMessage: "No log metric filter or alert policy is in place for project ownership assignments and changes."
  remediationMessage: "Create a log metric and alert policy."
relatedLists:
  - relationshipName: "CA10__Google_Logging_Log_Metrics__r"
    importExtracts:
      - file: /types/CA10__CaGoogleLoggingLogMetric__c/object.extracts.yaml
      - file: /types/CA10__CaGoogleMonitoringAlertPolicy__c/object.extracts.yaml
    conditions:
        - status: "COMPLIANT"
          currentStateMessage: "Corresponding log metric exists."
          check:
            AND:
              args:
                - GCP_LOGGING_QUERY_MATCH:
                    arg: 
                      EXTRACT: CA10__filter__c
                    value: '(protoPayload.serviceName="cloudresourcemanager.googleapis.com") AND (ProjectOwnership OR projectOwnerInvitee) OR (protoPayload.serviceData.policyDelta.bindingDeltas.action="REMOVE" AND protoPayload.serviceData.policyDelta.bindingDeltas.role="roles/owner") OR (protoPayload.serviceData.policyDelta.bindingDeltas.action="ADD" AND protoPayload.serviceData.policyDelta.bindingDeltas.role="roles/owner")'
                - RELATED_LIST_HAS:
                    relationshipName: "CA10__Google_Monitoring_Conditions__r"
                    status: "COMPLIANT"
    otherwise:
      status: "INCOMPLIANT"
      currentStateMessage: "No log metric exists with the required filter."
      remediationMessage: "Create a log metric with the appropriate filter."
    relatedLists:
      - relationshipName: "CA10__Google_Monitoring_Conditions__r"
        conditions:
          - status: "COMPLIANT"
            currentStateMessage: "Alert policy exists and is enabled."
            check:
              IS_EQUAL:
                left:
                  EXTRACT: CA10__alertPolicy__r.CA10__enabledState__c
                right:
                  TEXT: 'on'
        otherwise:
          status: "INCOMPLIANT"
          currentStateMessage: "No alert policy exists or the policy is not enabled."
          remediationMessage: "Create or enable the alert policy."



