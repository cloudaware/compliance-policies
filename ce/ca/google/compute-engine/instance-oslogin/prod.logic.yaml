---

inputType: "CA10__CaGoogleProject__c"
testData:
  - file: test-data.json
importExtracts:
  - file: /types/CA10__CaGoogleProject__c/object.extracts.yaml
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "This project has no running GCE instances."
    check:
      NOT:
        arg:
          OR:
            args:
              - RELATED_LIST_HAS:
                  relationshipName: "CA10__Google_GCE_Instances__r"
                  status: "COMPLIANT"
              - RELATED_LIST_HAS:
                  relationshipName: "CA10__Google_GCE_Instances__r"
                  status: "INCOMPLIANT"
  - status: "INCOMPLIANT"
    currentStateMessage: "OS Login is not enabled in the project metadata."
    remediationMessage: "Enable OS Login in the project metadata."
    check:
      OR:
        args:
          - NOT:
              arg:
                CONTAINS:
                  arg:
                    EXTRACT: "CA10__gceCommonMetadataItemsJson__c"
                  search:
                    BYTES: "enable-oslogin"
          - AND:
              args:
                - CONTAINS:
                    arg:
                      EXTRACT: "CA10__gceCommonMetadataItemsJson__c"
                    search:
                      BYTES: "enable-oslogin"
                - NOT:
                    arg:
                      CONTAINS:
                        arg:
                          EXTRACT: "caJsonText__gceCommonMetadataEnableOsloginValue__c"
                        search:
                          TEXT: "true"
  - status: "INCOMPLIANT"
    currentStateMessage: "One or more GCE instances override project-level OS Login with enable-oslogin set to false."
    remediationMessage: "Remove instance metadata that disables OS Login."
    check:
      RELATED_LIST_HAS:
        relationshipName: "CA10__Google_GCE_Instances__r"
        status: "INCOMPLIANT"
otherwise:
  status: "COMPLIANT"
  currentStateMessage: "OS Login is enabled in the project metadata and no GCE instance disables it."
relatedLists:
  - relationshipName: "CA10__Google_GCE_Instances__r"
    importExtracts:
      - file: /types/CA10__CaGoogleGceInstance__c/object.extracts.yaml
    conditions:
      - status: "INAPPLICABLE"
        currentStateMessage: "This instance was created by GKE."
        check:
          STARTS_WITH:
            arg:
              EXTRACT: "Name"
            search:
              TEXT: "gke-"
      - status: "INAPPLICABLE"
        currentStateMessage: "This GCE instance is not running."
        check:
          NOT_EQUAL:
            left:
              EXTRACT: "CA10__status__c"
            right:
              TEXT: "RUNNING"
      - status: "INCOMPLIANT"
        currentStateMessage: "This instance disables OS Login in instance metadata."
        remediationMessage: "Remove the enable-oslogin=false instance metadata override."
        check:
          AND:
            args:
              - CONTAINS:
                  arg:
                    EXTRACT: "CA10__metadataJson__c"
                  search:
                    BYTES: "enable-oslogin"
              - CONTAINS:
                  arg:
                    EXTRACT: "caJsonText__metadataJsonEnableOsloginValue"
                  search:
                    TEXT: "FALSE"
    otherwise:
      status: "COMPLIANT"
      currentStateMessage: "This instance does not disable project-level OS Login."
