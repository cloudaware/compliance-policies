---

inputType: "CA10__CaGoogleGceInstance__c"
testData:
  - file: test-data.json
importExtracts:
  - file: /types/CA10__CaGoogleGceInstance__c/object.extracts.yaml
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "Confidential Computing is supported only on N2D machine types."
    check:
      NOT:
        arg:
          STARTS_WITH:
            arg:
              EXTRACT: "CA10__machineTypeName__c"
            search:
              TEXT: "n2d-"
  - status: "COMPLIANT"
    currentStateMessage: "Confidential Computing is enabled for the instance."
    check:
      CONTAINS:
        arg:
          EXTRACT: "CA10__confidentialComputeStatus__c"
        search:
          TEXT: "Enabled"
otherwise:
  status: "INCOMPLIANT"
  currentStateMessage: "Confidential Computing is disabled for the instance."
  remediationMessage: "Enable Confidential Computing."
