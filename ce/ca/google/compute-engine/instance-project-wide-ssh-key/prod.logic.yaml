---

inputType: "CA10__CaGoogleGceInstance__c"
testData:
  - file: test-data.json
importExtracts:
  - file: /types/CA10__CaGoogleGceInstance__c/object.extracts.yaml
conditions:
  - status: "COMPLIANT"
    currentStateMessage: "Block project-wide SSH keys is enabled for the instance."
    check:
      CONTAINS:
        arg:
          EXTRACT: "caJsonText__metadataJsonBlockProjectSshKeysValue"
        search:
          TEXT: "true"
otherwise:
  status: "INCOMPLIANT"
  currentStateMessage: "Block project-wide SSH keys is disabled for the instance."
  remediationMessage: "Use instance-specific SSH keys instead of shared project-wide SSH keys."
