---
inputType: "CA10__CaGoogleGceAttachedDisk__c"
testData:
  - file: test-data.json
importExtracts:
  - file: /types/CA10__CaGoogleGceDisk__c/object.extracts.yaml
conditions:
  - status: "UNDETERMINED"
    currentStateMessage: "Ensure that the VM disk references an active GCE disk."
    check:
      IS_EMPTY_LOOKUP: "CA10__gceDisk__r"
  - status: "COMPLIANT"
    currentStateMessage: "Encryption type is set to a customer-supplied key."
    check:
      NOT_EMPTY:
        arg:
          EXTRACT: "CA10__gceDisk__r.CA10__diskEncryptionKeySha256__c"
otherwise:
  status: "INCOMPLIANT"
  currentStateMessage: "Encryption type is not set to a customer-supplied key."
  remediationMessage: "Create a new disk encrypted with a customer-supplied key, since existing disk encryption cannot be changed."
