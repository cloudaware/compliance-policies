---
inputType: "CA10__CaGoogleGceInstance__c"
importExtracts:
  - file: "/types/CA10__CaGoogleGceInstance__c/object.extracts.yaml"
testData:
  - file: 'test-data.json'
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "The instance is not running."
    check:
      NOT_EQUAL:
        left:
          EXTRACT: "CA10__status__c"
        right:
          TEXT: "RUNNING"
  - status: "INAPPLICABLE"
    currentStateMessage: "The instance has been running for less than 14 days."
    check:
      IS_WITHIN_LAST_DAYS:
        offsetDays: 14
        arg:
          EXTRACT: "CA10__creationDate__c"
  - status: "UNDETERMINED"
    currentStateMessage: "There is not enough data in the CMDB to determine whether the instance is idle."
    check:
      OR:
        args:
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__averageCpuTwoWeeks__c"
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__maxCpuTwoWeeks__c"
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__sumTwoWeekNetworkInMb__c"
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__sumTwoWeekNetworkOutMb__c"
          - AND:
              args:
                - NOT_EMPTY:
                    arg:
                      EXTRACT: "CA10N__newRelicHost__c"
                - OR:
                    args:
                      - IS_EMPTY:
                          arg:
                            EXTRACT: "CA10N__newRelicHostMemoryUsed14Day__c"
                      - IS_EMPTY:
                          arg:
                            EXTRACT: "CA10N__newRelicHostDiskReadUtilization__c"
                      - IS_EMPTY:
                          arg:
                            EXTRACT: "CA10N__newRelicHostDiskWriteUtilization__c"
  - status: INCOMPLIANT
    currentStateMessage: "The instance is idle with average CPU utilization < 5%,\
      \ maximum CPU utilization < 15%, memory utilization < 20%, disk read utilization\
      \ < 5%, disk write utilization < 5%, and 14-day network I/O < 100 MB."
    remediationMessage: "Stop, terminate, or rightsize the instance."
    check:
      AND:
        args:
          - NOT_EMPTY:
              arg:
                EXTRACT: "CA10N__newRelicHost__c"
          - LESS_THAN:
              left:
                EXTRACT: CA10N__newRelicHostMemoryUsed14Day__c
              right:
                NUMBER: 20.0
          - LESS_THAN:
              left:
                EXTRACT: CA10N__newRelicHostDiskReadUtilization__c
              right:
                NUMBER: 5.0
          - LESS_THAN:
              left:
                EXTRACT: CA10N__newRelicHostDiskWriteUtilization__c
              right:
                NUMBER: 5.0
          - LESS_THAN:
              left:
                EXTRACT: CA10__averageCpuTwoWeeks__c
              right:
                NUMBER: 5.0
          - LESS_THAN:
              left:
                EXTRACT: CA10__maxCpuTwoWeeks__c
              right:
                NUMBER: 15.0
          - LESS_THAN:
              left:
                EXTRACT: CA10__sumTwoWeekNetworkInMb__c
              right:
                NUMBER: 100.0
          - LESS_THAN:
              left:
                EXTRACT: CA10__sumTwoWeekNetworkOutMb__c
              right:
                NUMBER: 100.0
  - status: INCOMPLIANT
    currentStateMessage: "The instance is idle with average CPU utilization < 5%,\
      \ maximum CPU utilization < 15%, and 14-day network I/O < 100 MB."
    remediationMessage: "Stop, terminate, or rightsize the instance."
    check:
      AND:
        args:
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10N__newRelicHost__c"
          - LESS_THAN:
              left:
                EXTRACT: CA10__averageCpuTwoWeeks__c
              right:
                NUMBER: 5.0
          - LESS_THAN:
              left:
                EXTRACT: CA10__maxCpuTwoWeeks__c
              right:
                NUMBER: 15.0
          - LESS_THAN:
              left:
                EXTRACT: CA10__sumTwoWeekNetworkInMb__c
              right:
                NUMBER: 100.0
          - LESS_THAN:
              left:
                EXTRACT: CA10__sumTwoWeekNetworkOutMb__c
              right:
                NUMBER: 100.0
otherwise:
  status: "COMPLIANT"
  currentStateMessage: "The instance is not idle."
