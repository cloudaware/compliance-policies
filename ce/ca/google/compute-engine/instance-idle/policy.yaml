---
names:
  full: Google GCE Instance is idle
  contextual: Instance is idle
description: >
  Identify idle GCE Instances to optimize costs by stopping, 
  terminating, or downscaling instances with low utilization. Instances are 
  considered idle if their average CPU utilization is below 5%, maximum CPU 
  utilization is below 15%, average network I/O is below 100 MB over a 14-day period,
  and, when available, memory utilization is below 20%, disk read utilization is
  below 5%, and disk write utilization is below 5%.
type: "COMPLIANCE_POLICY"
categories:
  - "PERFORMANCE"
  - "COST"
frameworkMappings:
  - "/frameworks/cloudaware/cost-efficiency-and-optimization/waste-reduction"
  - "/frameworks/cloudaware/resource-performance/workload-efficiency"
