names: 
  full: "Google GCE Instance Enable Connecting to Serial Ports is not disabled"
  contextual: "Instance Enable Connecting to Serial Ports is not disabled"
description: "Interacting with a serial port is often referred to as the serial console, which is similar to \
 using a terminal window, in that input and output is entirely in text mode and there is no graphical \ 
 interface or mouse support.
 If you enable the interactive serial console on an instance, clients can attempt to connect to that instance \ 
 from any IP address. Therefore interactive serial console support should be disabled."
