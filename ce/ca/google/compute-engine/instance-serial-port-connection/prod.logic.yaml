---

inputType: "CA10__CaGoogleGceInstance__c"
testData:
  - file: test-data.json
importExtracts:
  - file: /types/CA10__CaGoogleGceInstance__c/object.extracts.yaml
conditions: 
  - status: "INCOMPLIANT"
    currentStateMessage: "Serial port connections are enabled for the instance."
    remediationMessage: "Disable serial port connections."
    check:
      CONTAINS:
        arg:
          EXTRACT: "caJsonText__metadataJsonSerialPortEnableValue"
        search:
          TEXT: "true"
otherwise:
  status: "COMPLIANT"
  currentStateMessage: "Serial port connections are disabled for the instance."
