---
inputType: "CA10__CaGoogleDnsManagedZone__c"
testData:
  - file: test-data.json
importExtracts:
  - file: /types/CA10__CaGoogleDnsManagedZone__c/object.extracts.yaml
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "Only applicable to public DNS managed zones."
    check:
      NOT_EQUAL:
        left:
          EXTRACT: "CA10__visibility__c"
        right:
          TEXT: 'public'
  - status: "COMPLIANT"
    currentStateMessage: "DNSSEC is enabled for the DNS managed zone."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10__dnssecConfigurationState__c"
        right:
          TEXT: 'on'
otherwise:
  status: "INCOMPLIANT"
  currentStateMessage: "DNSSEC is not enabled for the DNS managed zone."
  remediationMessage: "Enable DNSSEC for the DNS managed zone."
