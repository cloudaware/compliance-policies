---
inputType: "CA10__CaGoogleDnsManagedZone__c"
testData:
  - file: "test-data.json"
importExtracts:
  - file: "/types/CA10__CaGoogleDnsManagedZone__c/object.extracts.yaml"
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "Only applicable to public DNS managed zones."
    check:
      NOT_EQUAL:
        left:
          EXTRACT: "CA10__visibility__c"
        right:
          TEXT: "public"
  - status: "INCOMPLIANT"
    currentStateMessage: "DNSSEC is not enabled for the public DNS managed zone."
    remediationMessage: "Enable DNSSEC for the public DNS managed zone."
    check:
      NOT_EQUAL:
        left:
          EXTRACT: "CA10__dnssecConfigurationState__c"
        right:
          TEXT: "on"
  - status: "INCOMPLIANT"
    currentStateMessage: "The managed zone uses the RSASHA1 algorithm for the key-signing key."
    remediationMessage: "Update the DNSSEC configuration for the managed zone."
    check:
      CONTAINS:
        arg:
          EXTRACT: "caJsonText__dnssecConfigurationKeySpecsKeySigningAlgorithmValue"
        search:
          TEXT: "rsasha1"
otherwise:
  status: "COMPLIANT"
  currentStateMessage: "The public managed zone does not use the RSASHA1 algorithm for the key-signing key."
