---

inputType: "CA10__CaGoogleBigQueryDataset__c"
testData:
  - file: test-data.json
importExtracts:
  - file: /types/CA10__CaGoogleBigQueryDataset__c/object.extracts.yaml
conditions:
  - status: "INCOMPLIANT"
    currentStateMessage: "The BigQuery dataset IAM policy allows anonymous or public access."
    remediationMessage: "Remove roles with allUsers or allAuthenticatedUsers from the dataset IAM policy."
    check:
      OR:
        args:
          - CONTAINS:
              arg:
                EXTRACT: "CA10__access__c"
              search:
                TEXT: "allUsers"
          - CONTAINS:
              arg:
                EXTRACT: "CA10__access__c"
              search:
                TEXT: "allAuthenticatedUsers"
otherwise:
  status: "COMPLIANT"
  currentStateMessage: "The BigQuery dataset IAM policy does not allow anonymous or public access."
