---

inputType: "CA10G1__CaGoogleApiKey__c"
testData:
  - file: test-data.json
importExtracts:
  - file: /types/CA10G1__CaGoogleApiKey__c/object.extracts.yaml
conditions:
  - status: "INCOMPLIANT"
    currentStateMessage: "API restrictions are not configured for the API key."
    remediationMessage: "Configure API restrictions for the API key."
    check:
      IS_EMPTY:
        arg:
          EXTRACT: CA10G1__restrictionsApiTargets__c 
  - status: "INCOMPLIANT"
    currentStateMessage: "API restrictions allow access to all Google Cloud APIs."
    remediationMessage: "Restrict API access to only the required services."
    check:
      CONTAINS:
        arg:
          EXTRACT: CA10G1__restrictionsApiTargets__c
        search:
          TEXT: "service: 'cloudapis.googleapis.com'"          
otherwise:
  status: "COMPLIANT"
  currentStateMessage: "API restrictions limit the key to specific services."
