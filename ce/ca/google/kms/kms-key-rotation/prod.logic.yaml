---

inputType: "CA10__CaGoogleCloudKmsCryptoKey__c"
testData:
  - file: test-data.json
importExtracts:
  - file: /types/CA10__CaGoogleCloudKmsCryptoKey__c/object.extracts.yaml
conditions:
  - status: "COMPLIANT"
    currentStateMessage: "KMS key rotation is configured for a period of 90 days or less."
    check:
     AND:
      args:
        - IS_WITHIN_NEXT_DAYS:
            offsetDays: 90
            arg:
              EXTRACT: "CA10__nextRotationTime__c"
        - LESS_THAN_EQUAL:
            left:
              EXTRACT: "rotationDuration"
            right:
              DURATION: "P90D"
otherwise:
  status: "INCOMPLIANT"
  currentStateMessage: "KMS key rotation is not configured for a 90-day period."
  remediationMessage: "Set the KMS key rotation period to 90 days or less."
