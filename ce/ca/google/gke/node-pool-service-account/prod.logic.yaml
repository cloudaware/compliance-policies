---

inputType: "CA10G1__CaGoogleGkeClusterNodePool__c"
testData:
  - file: test-data.json
importExtracts:
  - file: /types/CA10G1__CaGoogleGkeClusterNodePool__c/object.extracts.yaml
conditions:
  - status: "UNDETERMINED"
    currentStateMessage: "Node pool service account configuration is empty."
    check:
      IS_EMPTY:
        arg:
          EXTRACT: "CA10G1__nodeConfigServiceAccount__c"
  - status: "INCOMPLIANT"
    currentStateMessage: "The node pool uses the default service account."
    remediationMessage: "Use a minimally privileged service account."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10G1__nodeConfigServiceAccount__c"
        right:
          TEXT: "default"
otherwise:
  status: "COMPLIANT"
  currentStateMessage: "The node pool does not use the default service account."
  
