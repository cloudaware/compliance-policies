---
inputType: "CA10__CaAwsDbInstance__c"
testData:
  - file: test-data.json
importExtracts:
  - file: /types/CA10__CaAwsDbInstance__c/object.extracts.yaml
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "The instance is not available."
    check:
      NOT_EQUAL:
        left:
          EXTRACT: "CA10__status__c"
        right:
          TEXT: "available"
  - status: "INAPPLICABLE"
    currentStateMessage: "This policy does not apply to cluster instances."
    check:
      NOT_EMPTY:
        arg:
          EXTRACT: "CA10__clusterArn__c"
  - status: "COMPLIANT"
    currentStateMessage: "The RDS instance is configured to publish logs to CloudWatch Logs."
    check:
      NOT_EMPTY:
        arg:
          EXTRACT: "CA10__enabledCloudWatchLogsExports__c"
otherwise:
  status: "INCOMPLIANT"
  currentStateMessage: "The RDS instance is not configured to publish logs to CloudWatch Logs."
  remediationMessage: "Enable CloudWatch Logs exports for the RDS instance."
