names:
  full: "AWS RDS Cluster Backup Retention Period is less than 7 days"
  contextual: "Cluster Backup Retention Period is less than 7 days"
description: >
  Ensure that AWS RDS DB clusters retain automated backups for at least 7 days.
  Adequate backup retention improves point-in-time recovery and reduces the risk
  of data loss during operational failures or security incidents.
