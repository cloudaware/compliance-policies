---
names:
  full: AWS RDS Instance is idle
  contextual: Instance is idle
description: >
  Identify idle AWS RDS Instances to reduce unnecessary costs. Instances
  are considered idle when their 30-day average CPU utilization is below 5% and
  both their 30-day average and maximum database connections are zero, with
  near-zero disk read and write IOPS.
type: "COMPLIANCE_POLICY"
categories:
  - "COST"
  - "PERFORMANCE"
frameworkMappings:
  - "/frameworks/cloudaware/cost-efficiency-and-optimization/waste-reduction"
  - "/frameworks/cloudaware/resource-performance/workload-efficiency"
