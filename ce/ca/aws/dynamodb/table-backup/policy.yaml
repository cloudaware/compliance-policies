names:
  full: "AWS DynamoDB Table does not have on-demand backups in the past 90 days"
  contextual: "Table does not have on-demand backups in the past 90 days"
description: >
  Ensure that DynamoDB tables without Point-in-Time Recovery (PITR) have 
  a recent on-demand backup or AWS Backup recovery point to reduce the risk of
  data loss.
