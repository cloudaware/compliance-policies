---
inputType: "CA10__CaAwsKmsKey__c"
testData:
  - file: "test-data.json"
importExtracts:
  - file: "/types/CA10__CaAwsKmsKey__c/object.extracts.yaml"
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "This key is not customer-managed."
    check:
      NOT_EQUAL:
        left:
          EXTRACT: "CA10__manager__c"
        right:
          TEXT: "CUSTOMER"
  - status: "INAPPLICABLE"
    currentStateMessage: "KMS key rotation cannot be enabled for asymmetric CMKs."
    check:
      NOT_EQUAL:
        left:
          EXTRACT: "CA10__keySpec__c"
        right:
          TEXT: "SYMMETRIC_DEFAULT"
  - status: "INCOMPLIANT"
    currentStateMessage: "KMS key rotation is disabled."
    remediationMessage: "Enable KMS key rotation."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10__rotationEnabled__c"
        right:
          BOOLEAN: false
  - status: "COMPLIANT"
    currentStateMessage: "KMS key rotation is enabled."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10__rotationEnabled__c"
        right:
          BOOLEAN: true
otherwise:
  status: "UNDETERMINED"
  currentStateMessage: "Unexpected values in the fields."
