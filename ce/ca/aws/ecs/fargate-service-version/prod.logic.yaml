---
# shortcut: Treat 1.0.0 as Windows; revisit if retired Linux 1.0.0 tasks need assessment.
inputType: "CA10__CaAwsEcsService__c"
testData:
  - file: "test-data.json"
importExtracts:
  - file: "/types/CA10__CaAwsEcsService__c/object.extracts.yaml"
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "The service is not active."
    check:
      NOT_EQUAL:
        left:
          EXTRACT: "CA10__status__c"
        right:
          TEXT: "ACTIVE"
  - status: "INAPPLICABLE"
    currentStateMessage: "The ECS service does not use the Fargate launch type."
    check:
      CONTAINS:
        arg:
          SET:
            itemType: "TEXT"
            items:
              - "EC2"
              - "EXTERNAL"
              - "MANAGED_INSTANCES"
        search:
          EXTRACT: "CA10__launchType__c"
  - status: "UNDETERMINED"
    currentStateMessage: "The ECS service launch type is not recognized."
    check:
      AND:
        args:
          - NOT_EMPTY:
              arg:
                EXTRACT: "CA10__launchType__c"
          - NOT_EQUAL:
              left:
                EXTRACT: "CA10__launchType__c"
              right:
                TEXT: "FARGATE"
  - status: "INCOMPLIANT"
    currentStateMessage: "At least one running service task uses a Linux Fargate platform version older than the latest version 1.4.0."
    remediationMessage: "Complete a deployment on Linux platform version 1.4.0 or LATEST and replace all tasks on older platform versions."
    check:
      RELATED_LIST_HAS:
        status: "INCOMPLIANT"
        relationshipName: "CA10__AWS_ECS_Tasks__r"
  - status: "INCOMPLIANT"
    currentStateMessage: "The ECS Fargate service is using an outdated platform version: 1.1.0, 1.2.0 or 1.3.0."
    remediationMessage: "Update the service to use platform version 1.4.0 or LATEST."
    check:
      CONTAINS:
        arg:
          SET:
            itemType: "TEXT"
            items:
              - "1.1.0"
              - "1.2.0"
              - "1.3.0"
        search:
          EXTRACT: "CA10__platformVersion__c"
  - status: "UNDETERMINED"
    currentStateMessage: "At least one service task has missing, unrecognized, or unassessable runtime platform data."
    check:
      RELATED_LIST_HAS:
        status: "UNDETERMINED"
        relationshipName: "CA10__AWS_ECS_Tasks__r"
  - status: "INAPPLICABLE"
    currentStateMessage: "The service launch type and platform version are empty, and no running task confirms Fargate use."
    check:
      AND:
        args:
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__launchType__c"
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__platformVersion__c"
          - RELATED_LIST_HAS_NO:
              status: "COMPLIANT"
              relationshipName: "CA10__AWS_ECS_Tasks__r"
  - status: "INAPPLICABLE"
    currentStateMessage: "The configured platform version is outside the verified platform version set."
    check:
      AND:
        args:
          - NOT_EMPTY:
              arg:
                EXTRACT: "CA10__platformVersion__c"
          - NOT:
              arg:
                CONTAINS:
                  arg:
                    SET:
                      itemType: "TEXT"
                      items:
                        - "1.0.0"
                        - "1.1.0"
                        - "1.2.0"
                        - "1.3.0"
                        - "1.4.0"
                        - "LATEST"
                  search:
                    EXTRACT: "CA10__platformVersion__c"
  - status: "INAPPLICABLE"
    currentStateMessage: "No running Fargate tasks could be assessed."
    check:
      RELATED_LIST_HAS_NO:
        status: "COMPLIANT"
        relationshipName: "CA10__AWS_ECS_Tasks__r"
otherwise:
  status: "COMPLIANT"
  currentStateMessage: "The assessed running Fargate tasks use the latest platform versions."
relatedLists:
  - relationshipName: "CA10__AWS_ECS_Tasks__r"
    importExtracts:
      - file: "/types/CA10__CaAwsEcsTask__c/object.extracts.yaml"
    conditions:
      - status: "INAPPLICABLE"
        currentStateMessage: "The task is not in the RUNNING state."
        check:
          NOT_EQUAL:
            left:
              EXTRACT: "CA10__lastStatus__c"
            right:
              TEXT: "RUNNING"
      - status: "INAPPLICABLE"
        currentStateMessage: "The running task uses a non-Fargate launch type."
        check:
          CONTAINS:
            arg:
              SET:
                itemType: "TEXT"
                items:
                  - "EC2"
                  - "EXTERNAL"
                  - "MANAGED_INSTANCES"
            search:
              EXTRACT: "CA10__launchType__c"
      - status: "UNDETERMINED"
        currentStateMessage: "The task launch type is missing or not recognized."
        check:
          NOT_EQUAL:
            left:
              EXTRACT: "CA10__launchType__c"
            right:
              TEXT: "FARGATE"
      - status: "UNDETERMINED"
        currentStateMessage: "The running Fargate task platform version is missing."
        check:
          IS_EMPTY:
            arg:
              EXTRACT: "CA10__platformVersion__c"
      - status: "INCOMPLIANT"
        currentStateMessage: "The running task uses a Linux Fargate platform version older than the latest version 1.4.0."
        remediationMessage: "Test and deploy Linux platform version 1.4.0 or LATEST, replacing all tasks on older platform versions."
        check:
          CONTAINS:
            arg:
              SET:
                itemType: "TEXT"
                items:
                  - "1.1.0"
                  - "1.2.0"
                  - "1.3.0"
            search:
              EXTRACT: "CA10__platformVersion__c"
      - status: "COMPLIANT"
        currentStateMessage: "The running task uses the latest Fargate platform version: 1.4.0 for Linux or 1.0.0 for Windows."
        check:
          CONTAINS:
            arg:
              SET:
                itemType: "TEXT"
                items:
                  - "1.0.0"
                  - "1.4.0"
            search:
              EXTRACT: "CA10__platformVersion__c"
    otherwise:
      status: "UNDETERMINED"
      currentStateMessage: "The task platform version is unresolved LATEST or is outside the verified platform version set."
