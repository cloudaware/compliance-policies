names:
  full: AWS EC2 Auto Scaling Group Launch Template is not configured to require IMDSv2
  contextual: Auto Scaling Group Launch Template is not configured to require IMDSv2
description: >
  Ensure that the EC2 Auto Scaling Group uses a Launch Template which is configured 
  to require IMDSv2 (Instance Metadata Service Version 2). IMDSv2 is a session-oriented 
  method for accessing instance metadata.
