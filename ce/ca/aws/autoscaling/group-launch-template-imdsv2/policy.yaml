  - "/frameworks/aws-fsbp-v1.0.0/auto-scaling/03"
similarPolicies:
  awsSecurityHub:
    - name: "[AutoScaling.3] Auto Scaling group launch configurations should configure EC2 instances to require Instance Metadata Service Version 2 (IMDSv2)"
      url: "https://docs.aws.amazon.com/securityhub/latest/userguide/autoscaling-controls.html#autoscaling-3"
