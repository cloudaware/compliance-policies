---
inputType: "CA10__CaAwsCacheCluster__c"
testData:
  - file: "test-data.json"
importExtracts:
  - file: /types/CA10__CaAwsCacheCluster__c/object.extracts.yaml
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "This policy is only applicable to Redis clusters."
    check:
      NOT:
        arg:
          CONTAINS:
            arg:
              SET:
                itemType: TEXT
                items:
                  - "redis"
                  - "valkey"
            search:
              EXTRACT: "CA10__engine__c"
  - status: "INCOMPLIANT"
    currentStateMessage: "Auto minor version upgrades are not enabled for this ElastiCache cluster."
    remediationMessage: "Enable auto minor version upgrades for this ElastiCache cluster."
    check: 
      NOT:
        arg:
          EXTRACT: CA10__autoMinorVersionUpgrade__c # autoMinorVersionUpgrade != true
otherwise:
  status: "COMPLIANT"
  currentStateMessage: "Auto minor version upgrades are enabled for this ElastiCache cluster."
