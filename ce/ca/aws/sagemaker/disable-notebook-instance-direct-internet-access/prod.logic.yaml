---
inputType: "CA10A1__CaAwsSageMakerNotebookInstance__c"
testData:
  - file: "test-data.json"
importExtracts:
  - file: "/types/CA10A1__CaAwsSageMakerNotebookInstance__c/object.extracts.yaml"
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "The SageMaker notebook instance is not currently in service."
    check:
      NOT_EQUAL:
        left:
          EXTRACT: "CA10A1__status__c"
        right:
          TEXT: "InService"
  - status: "INCOMPLIANT"
    currentStateMessage: "Direct internet access is enabled for this notebook instance."
    remediationMessage: "Disable direct internet access and configuring the notebook instance to use a VPC."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10A1__directInternetAccess__c"
        right:
          TEXT: "Enabled"
  - status: "COMPLIANT"
    currentStateMessage: "Direct internet access is disabled."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10A1__directInternetAccess__c"
        right:
          TEXT: "Disabled"
otherwise:
  status: "UNDETERMINED"
  currentStateMessage: "Unexpected values in the field."
