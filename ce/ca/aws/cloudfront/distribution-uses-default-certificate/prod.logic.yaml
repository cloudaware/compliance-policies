---
inputType: "CA10__CaAwsDistribution__c"
importExtracts:
  - file: "/types/CA10__CaAwsDistribution__c/object.extracts.yaml"
testData:
  - file: "test-data.json"  
recordTypes:
  - "caWebDistribution"
conditions:
  - status: "INCOMPLIANT"
    currentStateMessage: "The CloudFront distribution is configured to use the default SSL/TLS certificate."
    remediationMessage: "Configure the distribution to use a custom SSL/TLS certificate."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10__viewerCertificateCloudFrontDefaultCert__c"
        right:
          BOOLEAN: true
otherwise:
  status: "COMPLIANT"
  currentStateMessage: "The CloudFront distribution uses a custom SSL/TLS certificate."
