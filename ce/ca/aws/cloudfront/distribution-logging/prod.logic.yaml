  - file: "test-data.json"  
conditions:
  - status: "INCOMPLIANT"
    currentStateMessage: "Standard logging is not enabled for the CloudFront distribution."
    remediationMessage: "Enable standard logging for the CloudFront distribution."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10__loggingEnabled__c"
        right:
          BOOLEAN: false
otherwise:
