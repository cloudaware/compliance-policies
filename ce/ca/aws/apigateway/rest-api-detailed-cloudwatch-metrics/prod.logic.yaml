---
inputType: "CA10__CaAwsApiGatewayRestApi__c"
testData:
  - file: test-data.json
recordTypes:
  - restApi
conditions:
  - status: "INCOMPLIANT"
    currentStateMessage: "No related API stage has CloudWatch metrics enabled."
    remediationMessage: "Enable CloudWatch metrics for the API stage."
    check:
      IS_EQUAL:
        left:
          RELATED_LIST_COUNT:
            status: "COMPLIANT"
            relationshipName: "CA10__AWS_API_Gateway_Stages__r"
        right:
          NUMBER: 0.0
  - status: "INCOMPLIANT"
    currentStateMessage: "At least one API stage does not have CloudWatch metrics enabled."
    remediationMessage: "Enable CloudWatch metrics for the API stage."
    check:
      RELATED_LIST_HAS:
        relationshipName: "CA10__AWS_API_Gateway_Stages__r"
        status: "INCOMPLIANT"
otherwise:
  status: "COMPLIANT"
  currentStateMessage: "CloudWatch metrics are enabled for all API stages."
relatedLists:
  - relationshipName: "CA10__AWS_API_Gateway_Stages__r"
    importExtracts:
      - file: "/types/CA10__CaAwsApiGatewayStage__c/object.extracts.yaml"
    conditions:
      - status: "INCOMPLIANT"
        currentStateMessage: "CloudWatch metrics are not enabled for this API stage."
        remediationMessage: "Enable CloudWatch metrics for this API stage."
        check:
          IS_EQUAL:
            left:
              EXTRACT: "CA10__cloudWatchMetricsEnabled__c"
            right:
              BOOLEAN: false
    otherwise:
      status: "COMPLIANT"
      currentStateMessage: "CloudWatch metrics are enabled for this API stage."
