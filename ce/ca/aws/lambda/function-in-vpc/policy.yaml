---
names:
  full: "AWS Lambda Function is not in a VPC"
  contextual: "Function is not in a VPC"
description: >
  Ensure that AWS Lambda functions are configured to connect to a Virtual Private Cloud (VPC). 
  This allows the function to access private resources and leverage VPC security 
  controls like Security Groups and Network ACLs.
