similarPolicies:
  cloudConformity:
    - url: https://www.trendmicro.com/cloudoneconformity/knowledge-base/aws/Lambda/tracing.html
      name: Tracing Enabled
  awsSecurityHub:
    - name: "[Lambda.7] Lambda functions should have AWS X-Ray active tracing enabled"
      url: "https://docs.aws.amazon.com/securityhub/latest/userguide/lambda-controls.html#lambda-7"