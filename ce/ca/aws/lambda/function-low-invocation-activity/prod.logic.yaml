---
inputType: "CA10__CaAwsLambdaFunction__c"

testData:
  - file: "test-data.json"
importExtracts:
  - file: "/types/CA10__CaAwsLambdaFunction__c/object.extracts.yaml"
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "The function CMDB creation date is not earlier than UTC midnight 14 days ago."
    check:
      NOT:
        arg:
          IS_BEYOND_LAST_DAYS:
            offsetDays: 14
            arg:
              EXTRACT: "CreatedDate"
  - status: "UNDETERMINED"
    currentStateMessage: "The 14-day invocation count is invalid."
    check:
      LESS_THAN:
        left:
          FIELD:
            path: "CA10__sumTwoWeekInvocationCount__c"
        right:
          NUMBER: 0
  - status: "COMPLIANT"
    currentStateMessage: "The function has at least 10 recorded execution errors or throttled requests over the last 14 days."
    check:
      OR:
        args:
          - GREATER_THAN_EQUAL:
              left:
                FIELD:
                  path: "CA10__sumTwoWeekInvocationErrors__c"
              right:
                NUMBER: 10
          - GREATER_THAN_EQUAL:
              left:
                FIELD:
                  path: "CA10__sumTwoWeekInvocationThrottled__c"
              right:
                NUMBER: 10
  - status: "INCOMPLIANT"
    currentStateMessage: "The function has fewer than 10 invocations over the last 14 days."
    remediationMessage: "Review ownership, schedules, and dependencies; decommission the function only if it is no longer required."
    check:
      OR:
        args:
          # Under the CMDB data contract, null invocation counts represent zero activity.
          - IS_EMPTY:
              arg:
                FIELD:
                  path: "CA10__sumTwoWeekInvocationCount__c"
          - LESS_THAN:
              left:
                FIELD:
                  path: "CA10__sumTwoWeekInvocationCount__c"
              right:
                NUMBER: 10
otherwise:
  status: "COMPLIANT"
  currentStateMessage: "The function has at least 10 invocations over the last 14 days."

