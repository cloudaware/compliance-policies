similarPolicies:
  awsSecurityHub:
    - name: "[CloudTrail.5] CloudTrail trails should be integrated with Amazon CloudWatch Logs"
      url: "https://docs.aws.amazon.com/securityhub/latest/userguide/cloudtrail-controls.html#cloudtrail-5"
