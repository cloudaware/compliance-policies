    currentStateMessage: "Fine-grained access control is not enabled for the OpenSearch domain."
    remediationMessage: "Enable fine-grained access control and configure a master user or identity provider for the OpenSearch domain."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10__advancedSecurityEnabled__c"
        right:
          TEXT: "false"
  - status: "COMPLIANT"
    currentStateMessage: "Fine-grained access control is enabled for the OpenSearch domain."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10__advancedSecurityEnabled__c"
        right:
          TEXT: "true"
otherwise:
  status: "UNDETERMINED"
  currentStateMessage: "Unexpected value in the field."
