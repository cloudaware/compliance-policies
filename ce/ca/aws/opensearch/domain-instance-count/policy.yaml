---
names:
  full: "AWS OpenSearch Domain Instance Count is fewer than three"
  contextual: "Domain Instance Count is fewer than three"
description: >
  Ensure that Amazon OpenSearch Service domains are configured for high availability. 
  This requires at least three data nodes and the enablement of Zone Awareness 
  to distribute instances across multiple Availability Zones.
type: "COMPLIANCE_POLICY"
categories:
  - "RELIABILITY"
