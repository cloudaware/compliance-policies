---
inputType: "CA10__CaAwsRedshiftCluster__c"
importExtracts:
  - file: "/types/CA10__CaAwsRedshiftCluster__c/object.extracts.yaml"
testData:
  - file: "test-data.json"
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "The cluster is not available."
    check:
      NOT_EQUAL:
        left:
          EXTRACT: "CA10__status__c"
        right:
          TEXT: "available"
  - status: "COMPLIANT"
    currentStateMessage: "Redshift cluster version upgrades are enabled."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10__versionUpgrade__c"
        right:
          TEXT: "Allowed"
otherwise:
  status: "INCOMPLIANT"
  currentStateMessage: "Redshift cluster version upgrades are not enabled."
  remediationMessage: "Enable version upgrades for the cluster."
