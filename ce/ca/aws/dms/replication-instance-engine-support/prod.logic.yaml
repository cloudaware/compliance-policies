---
inputType: "CA10A1__CaAwsDmsReplicationInstance__c"
testData:
  - file: "test-data.json"
importExtracts:
  - file: "/types/CA10A1__CaAwsDmsReplicationInstance__c/object.extracts.yaml"
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "The DMS replication instance is creating, failed, deleted, or being deleted."
    check:
      CONTAINS:
        arg:
          SET:
            itemType: "TEXT"
            items:
              - "deleted"
              - "deleting"
              - "creating"
              - "failed"
        search:
          EXTRACT: "CA10A1__status__c"
  - status: "INCOMPLIANT"
    currentStateMessage: "The current DMS engine version has reached its published end-of-life and automatic upgrade date."
    remediationMessage: "Schedule a tested engine upgrade to a version before its AWS DMS EOL date, then verify migration tasks and refresh inventory."
    check:
      OR:
        args:
          - CONTAINS:
              arg:
                SET:
                  itemType: "TEXT"
                  items:
                    - "3.4.6"
                    - "3.4.7"
                    - "3.5.1"
                    - "3.5.2"
                    - "3.5.3"
                    - "3.6.0"
              search:
                EXTRACT: "CA10A1__engineVersion__c"
          - AND:
              args:
                - IS_EQUAL:
                    left:
                      EXTRACT: "CA10A1__engineVersion__c"
                    right:
                      TEXT: "3.5.4"
                - NOT:
                    arg:
                      IS_AFTER_TODAY:
                        arg:
                          DATE_TIME: "2027-03-31T00:00:00Z"
  - status: "COMPLIANT"
    currentStateMessage: "The current engine version has not reached a published EOL date in the verified AWS DMS calendar."
    check:
      CONTAINS:
        arg:
          SET:
            itemType: "TEXT"
            items:
              - "3.5.4"
              - "3.6.1"
        search:
          EXTRACT: "CA10A1__engineVersion__c"
otherwise:
  status: "INAPPLICABLE"
  currentStateMessage: "The engine version is outside the exact releases covered by the verified AWS DMS calendar."
