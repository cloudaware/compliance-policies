---
names:
  full: AWS DMS Replication Instance Multi-AZ Deployment is not enabled
  contextual: Replication Instance Multi-AZ Deployment is not enabled
description: >
  Ensure that AWS Database Migration Service (DMS) replication instances are
  configured for Multi-AZ deployment to improve availability and support automatic
  failover during infrastructure disruptions.
type: COMPLIANCE_POLICY
categories:
  - RELIABILITY
frameworkMappings:
  - "/frameworks/cloudaware/resource-reliability/system-configuration"
  - "/frameworks/aws-fsbp-v1.0.0/dms/13"
similarPolicies:
  awsSecurityHub:
    - name: "[DMS.13] DMS replication instances should be configured to use multiple Availability Zones"
      url: "https://docs.aws.amazon.com/securityhub/latest/userguide/dms-controls.html#dms-13"
