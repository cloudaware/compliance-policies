---
inputType: "CA10__CaAwsVolume__c"
importExtracts:
  - file: "/types/CA10__CaAwsVolume__c/object.extracts.yaml"
testData:
  - file: 'test-data.json'
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "The EBS volume is in a transient or error state."
    check:
      AND: 
        args:
          - NOT_EQUAL:
              left:
                EXTRACT: "CA10__status__c"
              right:
                TEXT: "available"
          - NOT_EQUAL:
              left:
                EXTRACT: "CA10__status__c"
              right:
                TEXT: "in-use"
  - status: "INAPPLICABLE"
    currentStateMessage: "The EBS volume was created less than 30 days ago."
    check:
      IS_WITHIN_LAST_DAYS:
        offsetDays: 30
        arg:
          EXTRACT: "CA10__createTime__c"
  - status: "INCOMPLIANT"
    currentStateMessage: "The EBS volume is unattached and has no I/O metrics for the past 30 days."
    remediationMessage: "Create a final snapshot for archival and then delete the volume."
    check:
      AND:
        args:
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__status__c"
              right:
                TEXT: "available"
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__readOpsSum30d__c"
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__writeOpsSum30d__c"
  - status: "INAPPLICABLE"
    currentStateMessage: "The EBS volume has been attached for less than 30 days."
    check:
      AND:
        args:
        - NOT_EMPTY:
            arg:
              EXTRACT: "CA10__attachmentAttachTime__c"
        - IS_WITHIN_LAST_DAYS:
            offsetDays: 30
            arg:
              EXTRACT: "CA10__attachmentAttachTime__c"
  - status: INCOMPLIANT
    currentStateMessage: "The EBS volume is attached but has no read or write\
      \ operations for the past 30 days."
    remediationMessage: "Verify whether the attached instance has been stopped for\
      \ over 30 days. If it is no longer needed, detach the volume, create a final\
      \ snapshot for archival, and then delete the volume."
    check:
      AND:
        args:
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__status__c"
              right:
                TEXT: "in-use"
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__readOpsSum30d__c"
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__writeOpsSum30d__c"
  - status: INCOMPLIANT
    currentStateMessage: "The EBS volume is attached but has no read or write\
      \ operations for the past 30 days."
    remediationMessage: "Verify whether the attached instance has been stopped for\
      \ over 30 days. If it is no longer needed, detach the volume, create a final\
      \ snapshot for archival, and then delete the volume."
    check:
      AND:
        args:
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__status__c"
              right:
                TEXT: "in-use"
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__readOpsSum30d__c"
              right:
                NUMBER: 0.0
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__writeOpsSum30d__c"
              right:
                NUMBER: 0.0
otherwise:
  status: "COMPLIANT"
  currentStateMessage: "The EBS volume is not idle."
