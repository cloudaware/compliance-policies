  - "/frameworks/aws-fsbp-v1.0.0/ec2/03"
  - "/frameworks/aws-well-architected/sec/08/02"
similarPolicies:
  awsSecurityHub:
    - name: "[EC2.3] Attached Amazon EBS volumes should be encrypted at-rest"
      url: "https://docs.aws.amazon.com/securityhub/latest/userguide/ec2-controls.html#ec2-3"