names:
  full: "AWS EBS Attached Volume is not encrypted"
  contextual: "EBS Attached Volume is not encrypted"
description: >
  Ensure that all attached EBS volumes are encrypted  to protect data at rest. 
  Encrypting EBS volumes adds a layer of security by rendering data unreadable 
  to unauthorized users.
