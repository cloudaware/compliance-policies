names:
  full: AWS EC2 Instance is idle
  contextual: Instance is idle
description: >
  Identify and address idle Amazon EC2 instances to optimize costs by stopping,
  terminating, or downscaling instances with low sustained utilization. The
  policy evaluates 14-day CPU and network metrics, uses one available memory
  metric when present, and also considers available disk utilization
  metrics.
type: "COMPLIANCE_POLICY"
categories:
