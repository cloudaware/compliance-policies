---
names:
  full: AWS EC2 Instance is underutilized
  contextual: Instance is underutilized
description: >
  Identify and address underutilized Amazon EC2 instances to optimize costs and 
  improve efficiency. Instances are considered underutilized if their average 
  CPU utilization is consistently below 40% and maximum CPU 
  utilization does not spike above 50% over a 14-day period. These instances 
  might be oversized for their workload.
type: "COMPLIANCE_POLICY"
categories:
  - "COST"
  - "PERFORMANCE"
frameworkMappings:
  - "/frameworks/cloudaware/cost-efficiency-and-optimization/resource-right-sizing"
  - "/frameworks/cloudaware/resource-performance/workload-efficiency"