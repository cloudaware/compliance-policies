similarPolicies:
  awsSecurityHub:
    - name: "[EC2.170] EC2 launch templates should use Instance Metadata Service Version 2 (IMDSv2)"
      url: "https://docs.aws.amazon.com/securityhub/latest/userguide/ec2-controls.html#ec2-170"
