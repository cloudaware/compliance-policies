---
inputType: "CA10__CaAwsInstance__c"
importExtracts:
  - file: "/types/CA10__CaAwsInstance__c/object.extracts.yaml"
testData:
  - file: 'test-data.json'
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "The instance is not running."
    check:
      NOT_EQUAL:
        left:
          EXTRACT: "CA10__stateName__c"
        right:
          TEXT: "running"
  - status: "INAPPLICABLE"
    currentStateMessage: "The instance has been running for less than 14 days."
    check:
      LESS_THAN:
        left:
          EXTRACT: "CA10__currentRunningTime__c"
        right:
          NUMBER: 14.0
  - status: UNDETERMINED
    currentStateMessage: "There is not enough CMDB data to determine whether the instance is overutilized."
    check:
      OR:
        args:
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__averageCpuTwoWeeks__c"
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__maxCpuTwoWeeks__c"
          - AND:
              args:
                - NOT_EMPTY:
                    arg:
                      EXTRACT: "CA10N__newRelicHost__c"
                - IS_EMPTY:
                    arg:
                      EXTRACT: "CA10N__newRelicHostMemoryUsed14Day__c"
  - status: "INCOMPLIANT"
    currentStateMessage: "The instance is overutilized with average CPU and memory utilization > 80% and max CPU utilization > 95%."
    remediationMessage: "Scale up the instance or implement auto scaling."
    check:
      AND:
        args:
          - NOT_EMPTY:
              arg:
                EXTRACT: "CA10N__newRelicHost__c"
          - GREATER_THAN:
              left:
                EXTRACT: CA10__averageCpuTwoWeeks__c
              right:
                NUMBER: 80.0
          - GREATER_THAN:
              left:
                EXTRACT: CA10__maxCpuTwoWeeks__c
              right:
                NUMBER: 95.0
          - GREATER_THAN:
              left:
                EXTRACT: CA10N__newRelicHostMemoryUsed14Day__c
              right:
                NUMBER: 80.0
  - status: "INCOMPLIANT"
    currentStateMessage: "The instance is overutilized with average CPU and memory utilization > 80% and max CPU utilization > 95%."
    remediationMessage: "Scale up the instance or implement auto scaling."
    check:
      AND:
        args:
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10N__newRelicHost__c"
          - GREATER_THAN:
              left:
                EXTRACT: CA10__averageCpuTwoWeeks__c
              right:
                NUMBER: 80.0
          - GREATER_THAN:
              left:
                EXTRACT: CA10__maxCpuTwoWeeks__c
              right:
                NUMBER: 95.0
          - GREATER_THAN:
              left:
                EXTRACT: CA10__averageMemoryUsedTwoWeeks__c
              right:
                NUMBER: 80.0
  - status: "INCOMPLIANT"
    currentStateMessage: "The instance is overutilized with average CPU and memory utilization > 80% and max CPU utilization > 95%."
    remediationMessage: "Scale up the instance or implement auto scaling."
    check:
      AND:
        args:
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10N__newRelicHost__c"
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__averageMemoryUsedTwoWeeks__c"
          - GREATER_THAN:
              left:
                EXTRACT: CA10__averageCpuTwoWeeks__c
              right:
                NUMBER: 80.0
          - GREATER_THAN:
              left:
                EXTRACT: CA10__maxCpuTwoWeeks__c
              right:
                NUMBER: 95.0
          - GREATER_THAN:
              left:
                EXTRACT: CA10__nagiosMemoryUtilization__c
              right:
                NUMBER: 80.0
  - status: "INCOMPLIANT"
    currentStateMessage: "The instance is overutilized with average CPU utilization > 80% and max CPU utilization > 95%."
    remediationMessage: "Scale up the instance or implement auto scaling."
    check:
      AND:
        args:
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10N__newRelicHost__c"
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__averageMemoryUsedTwoWeeks__c"
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__nagiosMemoryUtilization__c"
          - GREATER_THAN:
              left:
                EXTRACT: CA10__averageCpuTwoWeeks__c
              right:
                NUMBER: 80.0
          - GREATER_THAN:
              left:
                EXTRACT: CA10__maxCpuTwoWeeks__c
              right:
                NUMBER: 95.0
otherwise:
  status: "COMPLIANT"
  currentStateMessage: "The instance is not overutilized."
