---
names:
  full: AWS EC2 Instance is overutilized
  contextual: Instance is overutilized
description: >
  Identify and address overutilized Amazon EC2 instances to prevent performance 
  degradation and optimize resource allocation. Instances are considered 
  overutilized if their average CPU utilization exceeds 80% and maximum CPU 
  utilization consistently spikes above 95% over a 14-day period.
type: "COMPLIANCE_POLICY"
categories:
  - "COST"
  - "PERFORMANCE"
frameworkMappings:
  - "/frameworks/cloudaware/cost-management/resource-right-sizing"
  - "/frameworks/cloudaware/resource-performance/resource-utilization"
