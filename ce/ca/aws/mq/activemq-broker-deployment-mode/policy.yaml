names:
  full: AWS MQ ActiveMQ Broker uses the single instance deployment mode
  contextual: ActiveMQ Broker uses the single instance deployment mode
description: >
  Ensure that Amazon MQ ActiveMQ brokers are configured with high availability. 
  Active/standby deployment mode is recommended for production environments to 
  provide redundancy and ensure continuity of service if a broker instance fails 
  or undergoes maintenance.
