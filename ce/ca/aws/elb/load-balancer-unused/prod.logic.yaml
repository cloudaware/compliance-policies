      RELATED_LIST_HAS_NO:
        status: "COMPLIANT"
        relationshipName: "CA10__AWS_EC2_Load_Balancer_Listeners__r"
  - status: "INCOMPLIANT"
    currentStateMessage: "The Load Balancer has no registered targets."
    remediationMessage: "Ensure that the instances or targets in the target groups are healthy, or delete the Load Balancer if it is no longer needed."
    check:
      RELATED_LIST_HAS_NO:
        status: "COMPLIANT"
        relationshipName: "CA10__instanceLinks__r"
otherwise:
  status: "COMPLIANT"
  currentStateMessage: "The Load Balancer is used."
relatedLists:
  - relationshipName: "CA10__AWS_EC2_Load_Balancer_Listeners__r"
    conditions: []
    otherwise:
      status: COMPLIANT
      currentStateMessage: "This is an Load Balancer listener."
  - relationshipName: "CA10__instanceLinks__r"
    conditions: []
    otherwise:
      status: "COMPLIANT"
      currentStateMessage: "This is a target instance."
