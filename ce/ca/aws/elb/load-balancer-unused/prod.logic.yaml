---
inputType: "CA10__CaAwsLoadBalancer__c"
testData:
  - file: 'test-data.json'
conditions:
  - status: "INCOMPLIANT"
    currentStateMessage: "The Load Balancer has no listeners."
    remediationMessage: "Consider adding listeners to the Load Balancer or deleting it if it is no longer needed."
