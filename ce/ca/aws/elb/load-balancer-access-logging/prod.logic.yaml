---
inputType: "CA10__CaAwsLoadBalancer__c"
importExtracts:
  - file: "/types/CA10__CaAwsLoadBalancer__c/object.extracts.yaml"
testData:
  - file: "test-data.json"
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "Access logs are not supported for gateway load balancers."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10__type__c"
        right:
          TEXT: "gateway"
  - status: "INCOMPLIANT"
    currentStateMessage: "Load balancer access logging is not enabled."
    remediationMessage: "Enable load balancer access logging."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10__accessLogsEnabled__c"
        right:
          BOOLEAN: false
  - status: "COMPLIANT"
    currentStateMessage: "Load balancer access logging is enabled."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10__accessLogsEnabled__c"
        right:
          BOOLEAN: true
otherwise:
  status: "UNDETERMINED"
  currentStateMessage: "Unexpected value in the field."
