  - "/frameworks/cloudaware/resource-security/threat-protection"
similarPolicies:
  awsSecurityHub:
    - name: "[Inspector.4] Amazon Inspector Lambda standard scanning should be enabled"
      url: "https://docs.aws.amazon.com/securityhub/latest/userguide/inspector-controls.html#inspector-4"