names:
  full: "AWS Inspector Lambda Standard Scanning is not enabled"
  contextual: "Inspector Lambda Standard Scanning is not enabled"
description: >
  Amazon Inspector provides standard scanning for AWS Lambda functions, which 
  automatically detects software vulnerabilities in your function's package dependencies. 
  Enabling this ensures that your serverless applications are continuously monitored 
  for known CVEs in their libraries and layers.
