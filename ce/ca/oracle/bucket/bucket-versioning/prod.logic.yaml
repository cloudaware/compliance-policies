---
# Oracle Object Storage bucket versioning can be Enabled, Disabled, or Suspended.
# Disabled means the bucket has never protected objects with version history.
# Suspended preserves existing historical versions but stops creating new versions.
inputType: "CA10O1__CaOracleStorageBucket__c"
testData:
  - file: "test-data.json"
importExtracts:
  - file: "/types/CA10O1__CaOracleStorageBucket__c/object.extracts.yaml"
conditions:
  - status: "COMPLIANT"
    currentStateMessage: "Object versioning is enabled for the bucket."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10O1__versioning__c"
        right:
          TEXT: "Enabled"
  - status: "INCOMPLIANT"
    currentStateMessage: "Object versioning has never been enabled for the bucket."
    remediationMessage: "Enable object versioning for the bucket."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10O1__versioning__c"
        right:
          TEXT: "Disabled"
  - status: "INCOMPLIANT"
    currentStateMessage: "Object versioning is suspended for the bucket."
    remediationMessage: "Reactivate object versioning for the bucket."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10O1__versioning__c"
        right:
          TEXT: "Suspended"
otherwise:
  status: "UNDETERMINED"
  currentStateMessage: "The bucket Versioning field has an unexpected value."
