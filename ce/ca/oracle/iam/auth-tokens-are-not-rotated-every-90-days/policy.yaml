---
names:
  full: "Oracle IAM Auth Tokens are not rotated every 90 days"
  contextual: "IAM Auth Tokens are not rotated every 90 days"
description: >
  Oracle IAM auth tokens should be rotated at least every 90 days. Stale
  auth tokens increase the exposure window for compromised long-term
  credentials used by services that do not support OCI signature-based
  authentication.
type: "COMPLIANCE_POLICY"
