names:
  full: "Oracle IAM DB Credentials are not rotated every 90 days"
  contextual: "DB Credentials are not rotated every 90 days"
description: >
  Oracle IAM DB Credentials should be rotated at least every 90 days.
  Stale database passwords increase the exposure window for compromised
  long-term credentials used to access supported Oracle databases.
type: "COMPLIANCE_POLICY"
