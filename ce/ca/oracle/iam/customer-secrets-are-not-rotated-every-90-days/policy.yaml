names:
  full: "Oracle IAM Customer Secret Keys are not rotated every 90 days"
  contextual: "IAM Customer Secret Keys are not rotated every 90 days"
description: >
  Oracle IAM customer secret keys should be rotated before they are more than
  90 days old. Stale customer secret keys increase the exposure window for
  compromised long-term credentials.
