---
inputType: "CA10__CaAzureVmScaleSetInstance__c"
testData:
  - file: test-data.json
conditions:
  - status: "INCOMPLIANT"
    currentStateMessage: "The instance has a network interface with an NSG that allows HTTP access from the Internet."
    remediationMessage: "Restrict inbound HTTP access from the Internet."
    check:
      RELATED_LIST_HAS:
        status: "INCOMPLIANT"
        relationshipName: "CA10Z1__Azure_VM_Scale_Set_Instance_Network_Ints__r"
otherwise:
  status: "COMPLIANT"
  currentStateMessage: "The instance does not allow HTTP access from the Internet."
relatedLists:
  - relationshipName: "CA10Z1__Azure_VM_Scale_Set_Instance_Network_Ints__r"
    importExtracts:
      - file: "/types/CA10__CaAzureNetworkSecurityGroupRule__c/object.extracts.yaml"
    conditions:
      - status: "INCOMPLIANT"
        currentStateMessage: "Network interface with a publicly accessible Network Security Group."
        check:
          RELATED_LIST_HAS:
            status: "INCOMPLIANT"
            relationshipName:  "CA10Z1__networkSecurityGroup__r.CA10__Azure_Network_Security_Group_Rules__r"
    otherwise:
      status: "COMPLIANT"
      currentStateMessage: "Network interface is not publicly accessible."
    relatedLists:
      - relationshipName: "CA10Z1__networkSecurityGroup__r.CA10__Azure_Network_Security_Group_Rules__r"
        importExtracts:
          - file: "/types/CA10__CaAzureNetworkSecurityGroupRule__c/object.extracts.yaml"
        conditions:
# sort public group rules
          - status: "INAPPLICABLE"
            currentStateMessage: "NSG Outbound Rule."
            check:
              NOT_EQUAL:
                left:
                  EXTRACT: "CA10__direction__c"
                right:
                  TEXT: "Inbound"
          - status: "INAPPLICABLE"
            currentStateMessage: "NSG Deny Rule."
            check:
              NOT_EQUAL:
                left:
                  EXTRACT: "CA10__access__c"
                right:
                  TEXT: "Allow"
          - status: "INAPPLICABLE"
            currentStateMessage: "NSG Rule with the port other than TCP or Any."
            check:
              NOT:
                arg:
                  OR:
                    args:
                      - IS_EQUAL:
                          left:
                            EXTRACT: "CA10__protocol__c"
                          right:
                            TEXT: "Tcp"
                      - IS_EQUAL:
                          left:
                            EXTRACT: "CA10__protocol__c"
                          right:
                            TEXT: "*"
                      - IS_EQUAL:
                          left:
                            EXTRACT: "CA10__protocol__c"
                          right:
                            TEXT: "null"
          - status: "INAPPLICABLE"
            currentStateMessage: "NSG Rule source is not any address."
            check:
              NOT:
                arg:
                  OR:
                    args:
                      - IS_EQUAL:
                          left:
                            EXTRACT: "CA10__sourceAddressPrefix__c"
                          right:
                            TEXT: "Internet"
                      - IS_EQUAL:
                          left:
                            EXTRACT: "CA10__sourceAddressPrefix__c"
                          right:
                            TEXT: "*"
                      - IS_EQUAL:
                          left:
                            EXTRACT: "CA10__sourceAddressPrefix__c"
                          right:
                            TEXT: "0.0.0.0"
                      - IS_EQUAL:
                          left:
                            EXTRACT: "CA10__sourceAddressPrefix__c"
                          right:
                            TEXT: "Any"
                      - CONTAINS:
                          arg:
                            EXTRACT: "CA10__sourceAddressPrefix__c"
                          search:
                            TEXT: "/0"
          - status: "INCOMPLIANT"
            currentStateMessage: "NSG rule allows public access on the HTTP port."
            remediationMessage: "Close HTTPS port."
            check:
                # PORT 80, 443
              OR:
                args:
                  - IS_EQUAL:
                      left:
                        EXTRACT: "CA10__destinationPortRange__c"
                      right:
                          TEXT: "80"
                  - AND:
                      args:
                        - LESS_THAN_EQUAL:
                            left:
                              EXTRACT: "CA10__destinationPortFrom__c"
                            right:
                              NUMBER: 80.0
                        - GREATER_THAN_EQUAL:
                              left:
                                EXTRACT: "CA10__destinationPortTo__c"
                              right:
                                NUMBER: 80.0
                  - IS_EQUAL:
                      left:
                        EXTRACT: "CA10__destinationPortRange__c"
                      right:
                          TEXT: "443"
                  - AND:
                      args:
                        - LESS_THAN_EQUAL:
                            left:
                              EXTRACT: "CA10__destinationPortFrom__c"
                            right:
                              NUMBER: 443.0
                        - GREATER_THAN_EQUAL:
                              left:
                                EXTRACT: "CA10__destinationPortTo__c"
                              right:
                                NUMBER: 443.0
        otherwise:
          status: "COMPLIANT"
          currentStateMessage: "NSG rule without public access on the HTTP port."


