---
inputObject: "CA10__CaAzureActiveDirectory__c"
testData:
  - file: "test-data.json"
conditions:
      - status: "INCOMPLIANT"
        currentStateMessage: "Users other than members of Global Administrator,\
          \ User Administrator, and Guest Inviter roles are allowed to invite guests."
        remediationMessage: "Consider restricting who can invite guests to the organization."
        condition:
          RELATED_LIST_HAS:
            status: "INCOMPLIANT"
            relationshipName: "CA10Z1__Azure_Active_Directory_Auth_Policies__r"
      - status: "COMPLIANT"
        currentStateMessage: "Guest invite settings are restricted."
        condition:
          RELATED_LIST_HAS:
            status: "COMPLIANT"
            relationshipName: "CA10Z1__Azure_Active_Directory_Auth_Policies__r"
      - status: "UNDETERMINED"
        currentStateMessage: "Unable to determine Guest invite settings."
        condition:
          RELATED_LIST_HAS:
            status: "UNDETERMINED"
            relationshipName: "CA10Z1__Azure_Active_Directory_Auth_Policies__r"
otherwise:
  status: "UNDETERMINED"
  currentStateMessage: "The Authorization Policy for Microsoft Entra is not present in the CMDB."
relatedLists:
  - relationshipName: "CA10Z1__Azure_Active_Directory_Auth_Policies__r"
    importExtracts:
      - file: "/types/CA10Z1__CaAzureActiveDirectoryAuthPolicy__c/object.extracts.yaml"
    conditions:
      - status: "INCOMPLIANT"
        currentStateMessage: "Everyone in the organization, including guests,\
          \ is allowed to invite guests."
        remediationMessage: "Consider restricting who can invite guests to the organization."
        condition:
          IS_EQUAL:
            left:
              EXTRACT: "CA10Z1__invitesFromState__c"
            right:
              TEXT: "everyone"
      - status: "INCOMPLIANT"
        currentStateMessage: "All User role members are allowed to invite guests."
        remediationMessage: "Consider restricting who can invite guests to the organization."
        condition:
          IS_EQUAL:
            left:
              EXTRACT: "CA10Z1__invitesFromState__c"
            right:
              TEXT: "adminsGuestInvitersAndAllMembers"
      - status: "COMPLIANT"
        currentStateMessage: "Only members of Global Administrator, User Administrator,\
          \ and Guest Inviter roles are allowed to invite guests."
        condition:
          IS_EQUAL:
            left:
              EXTRACT: "CA10Z1__invitesFromState__c"
            right:
              TEXT: "adminsAndGuestInviters"
      - status: "COMPLIANT"
        currentStateMessage: "Everyone is prevented, including admins, from inviting guests."
        condition:
          IS_EQUAL:
            left:
              EXTRACT: "CA10Z1__invitesFromState__c"
            right:
              TEXT: "None"
    otherwise:
      status: "UNDETERMINED"
      currentStateMessage: "Unexpected value in the field."
