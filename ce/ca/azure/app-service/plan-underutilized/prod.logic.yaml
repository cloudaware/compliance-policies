---
inputType: "CA10__CaAzureAppServicePlan__c"
testData:
  - file: test-data.json
importExtracts:
  - file: /types/CA10__CaAzureAppServicePlan__c/object.extracts.yaml
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "The App Service Plan tier has no paid capacity to rightsize."
    check:
      OR:
        args:
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__skuTier__c"
              right:
                TEXT: "Free"
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__skuTier__c"
              right:
                TEXT: "Shared"
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__skuTier__c"
              right:
                TEXT: "Dynamic"
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__skuTier__c"
              right:
                TEXT: "WorkflowStandard"
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__skuTier__c"
              right:
                TEXT: "FlexConsumption"
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__numberOfSites__c"
              right:
                NUMBER: 0.0
  - status: "UNDETERMINED"
    currentStateMessage: "Tier, site count, or 30-day metrics are unavailable."
    check:
      OR:
        args:
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__skuTier__c"
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__numberOfSites__c"
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__monitorCpuAvg30Day__c"
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__monitorMemoryAvg30Day__c"
  - status: "INCOMPLIANT"
    currentStateMessage: "Average CPU is below 20% and memory is below 40% over 30 days."
    remediationMessage: "Review peak demand and rightsize the plan or worker count."
    check:
      AND:
        args:
          - LESS_THAN:
              left:
                EXTRACT: "CA10__monitorCpuAvg30Day__c"
              right:
                NUMBER: 20.0
          - LESS_THAN:
              left:
                EXTRACT: "CA10__monitorMemoryAvg30Day__c"
              right:
                NUMBER: 40.0
otherwise:
  status: "COMPLIANT"
  currentStateMessage: "The App Service Plan is not underutilized."
