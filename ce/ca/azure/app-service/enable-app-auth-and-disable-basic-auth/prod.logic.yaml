---
inputType: "CA10__CaAzureAppService__c"
importExtracts:
  - file: "/types/CA10__CaAzureAppService__c/object.extracts.yaml"
testData:
  - file: "test-data.json"
conditions:
  - status: "INCOMPLIANT"
    currentStateMessage: "App Service authentication is disabled and basic auth publishing credentials are enabled."
    remediationMessage: "Enable App Service authentication and disabling basic auth publishing credentials."
    check:
      AND:
        args:
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__authStatus__c"
              right:
                TEXT: "Disabled"
          - OR:
              args:
                - IS_EQUAL:
                    left:
                      EXTRACT: "CA10__basicPublishingCredentialsFtpState__c"
                    right:
                      TEXT: "Enabled"
                - IS_EQUAL:
                    left:
                      EXTRACT: "CA10__basicPublishingCredentialsScmState__c"
                    right:
                      TEXT: "Enabled"
  - status: "INCOMPLIANT"
    currentStateMessage: "App Service authentication is disabled."
    remediationMessage: "Enable App Service authentication."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10__authStatus__c"
        right:
          TEXT: "Disabled"
  - status: "INCOMPLIANT"
    currentStateMessage: "Basic auth publishing credentials are enabled."
    remediationMessage: "Disable basic auth publishing credentials."
    check:
      OR:
        args:
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__basicPublishingCredentialsFtpState__c"
              right:
                TEXT: "Enabled"
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__basicPublishingCredentialsScmState__c"
              right:
                TEXT: "Enabled"
  - status: "COMPLIANT"
    currentStateMessage: "App Service authentication is enabled and basic auth publishing credentials are disabled."
    check:
      AND:
        args:
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__authStatus__c"
              right:
                TEXT: "Enabled"
          - OR:
              args:
                - IS_EQUAL:
                    left:
                      EXTRACT: "CA10__basicPublishingCredentialsFtpState__c"
                    right:
                      TEXT: "Disabled"
                - IS_EQUAL:
                    left:
                      EXTRACT: "CA10__basicPublishingCredentialsScmState__c"
                    right:
                      TEXT: "Disabled"
otherwise:
  status: "UNDETERMINED"
  currentStateMessage: "Unexpected values in the fields."
