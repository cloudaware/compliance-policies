---
inputType: "CA10__CaAzureStorageAccount__c"
importExtracts:
  - file: "/types/CA10__CaAzureStorageAccount__c/object.extracts.yaml"
testData:
  - file: "test-data.json"
conditions:
  - status: "INCOMPLIANT"
    currentStateMessage: "The soft delete configuration for Azure Storage Containers is not enabled."
    remediationMessage: "Enable soft delete for containers."
    check:
      OR:
        args:
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__containerRetentionPolicyState__c"
              right:
                TEXT: "Disabled"
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__containerRetentionPolicyState__c"
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__containerRetentionPolicyDays__c"
otherwise:
  status: "COMPLIANT"
  currentStateMessage: "Soft delete for Azure Storage containers is enabled."
