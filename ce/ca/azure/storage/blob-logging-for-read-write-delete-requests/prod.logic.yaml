    currentStateMessage: "Storage logging for the Blob service is disabled."
    remediationMessage: "Enable storage logging for read, write, and delete requests."
    check:
      OR:
        args:
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__blobLoggingReadState__c"
              right: 
                TEXT: "Disabled"
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__blobLoggingWriteState__c"
              right: 
                TEXT: "Disabled"
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__blobLoggingDeleteState__c"
              right: 
                TEXT: "Disabled"
otherwise:
