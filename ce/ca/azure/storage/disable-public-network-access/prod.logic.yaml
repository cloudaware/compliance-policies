---
inputType: CA10__CaAzureStorageAccount__c
testData:
- file: test-data.json
importExtracts:
- file: /types/CA10__CaAzureStorageAccount__c/object.extracts.yaml
conditions:
- status: COMPLIANT
  currentStateMessage: Public network access is disabled.
  check:
    IS_EQUAL:
      left:
        EXTRACT: CA10__publicNetworkAccessState__c
      right:
        TEXT: Disabled
- status: INCOMPLIANT
  currentStateMessage: Public network access is enabled or secured by a perimeter rather than disabled.
  check:
    OR:
      args:
      - CONTAINS:
          arg:
            SET:
              itemType: TEXT
              items:
              - Enabled
              - SecuredByPerimeter
          search:
            EXTRACT: CA10__publicNetworkAccessState__c
      - IS_EMPTY:
          arg:
            EXTRACT: CA10__publicNetworkAccessState__c
  remediationMessage: Set Public Network Access to Disabled after verifying private connectivity.
otherwise:
  status: UNDETERMINED
  currentStateMessage: The public network access setting is unexpected.
