---
inputType: "CA10__CaAzureStorageAccount__c"
testData:
  - file: "test-data.json"
importExtracts:
  - file: "/types/CA10__CaAzureStorageAccount__c/object.extracts.yaml"
conditions:
  - status: "INCOMPLIANT"
    currentStateMessage: "This storage account uses legacy TLS 1.0."
    remediationMessage: "Set the minimum TLS version to TLS 1.2."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10__minimumTlsVersion__c"
        right:
          TEXT: "TLS1_0"
  - status: "INCOMPLIANT"
    currentStateMessage: "This storage account uses legacy TLS 1.1."
    remediationMessage: "Set the minimum TLS version to TLS 1.2."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10__minimumTlsVersion__c"
        right:
          TEXT: "TLS1_1"
  - status: "COMPLIANT"
    currentStateMessage: "The minimum TLS version is set to TLS 1.2."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10__minimumTlsVersion__c"
        right:
          TEXT: "TLS1_2"
otherwise:
