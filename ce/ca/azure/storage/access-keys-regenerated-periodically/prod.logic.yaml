---
inputType: "CA10__CaAzureStorageAccount__c"
testData:
  - file: test-data.json
importExtracts:
  - file: /types/CA10__CaAzureStorageAccount__c/object.extracts.yaml
conditions:
  - status: "UNDETERMINED"
    currentStateMessage: "Key creation time is missing."
    check:
      OR:
        args:
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__primaryKeyCreationTime__c"
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__secondaryKeyCreationTime__c"
  - status: "INCOMPLIANT"
    currentStateMessage: "Access keys have not been rotated in over 90 days."
    remediationMessage: "Rotate access keys at least every 90 days."
    check:
      OR:
        args:
          - NOT:
              arg:
                IS_WITHIN_LAST_DAYS:
                  offsetDays: 90
                  arg:
                    EXTRACT: "CA10__primaryKeyCreationTime__c"
          - NOT:
              arg:
                IS_WITHIN_LAST_DAYS:
                  offsetDays: 90
                  arg:
                    EXTRACT: "CA10__secondaryKeyCreationTime__c"
otherwise:
  status: "COMPLIANT"
  currentStateMessage: "Access keys have been rotated within the last 90 days."
