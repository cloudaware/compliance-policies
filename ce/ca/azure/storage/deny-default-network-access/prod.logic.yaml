---
inputType: CA10__CaAzureStorageAccount__c
testData:
  - file: test-data.json
importExtracts:
  - file: /types/CA10__CaAzureStorageAccount__c/object.extracts.yaml
conditions:
  - status: COMPLIANT
    currentStateMessage: Public access is disabled or secured by a network perimeter.
    check:
      CONTAINS:
        arg:
          SET:
            itemType: TEXT
            items:
              - Disabled
              - SecuredByPerimeter
        search:
          EXTRACT: CA10__publicNetworkAccessState__c
  - status: COMPLIANT
    currentStateMessage: The default network action denies unlisted traffic.
    check:
      IS_EQUAL:
        left:
          EXTRACT: CA10__networkAclsDefaultAction__c
        right:
          TEXT: Deny
  - status: INCOMPLIANT
    currentStateMessage: Public access is enabled and the default network action allows unlisted traffic.
    remediationMessage: Set the default network action to Deny or restrict public access.
    check:
      AND:
        args:
          - OR:
              args:
                - IS_EQUAL:
                    left:
                      EXTRACT: CA10__publicNetworkAccessState__c
                    right:
                      TEXT: Enabled
                - IS_EMPTY:
                    arg:
                      EXTRACT: CA10__publicNetworkAccessState__c
          - IS_EQUAL:
              left:
                EXTRACT: CA10__networkAclsDefaultAction__c
              right:
                TEXT: Allow
otherwise:
  status: UNDETERMINED
  currentStateMessage: Unexpected value in the field.
