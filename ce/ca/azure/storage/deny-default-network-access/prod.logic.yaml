---
inputType: "CA10__CaAzureStorageAccount__c"
testData:
  - file: "test-data.json"
importExtracts:
  - file: "/types/CA10__CaAzureStorageAccount__c/object.extracts.yaml"
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "This recommendation applies only when public network access is not disabled by necessity or exception."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10__publicNetworkAccessState__c"
        right:
          TEXT: "Disabled"  
  - status: "INCOMPLIANT"
    currentStateMessage: "The Default network access is not restricted."
    remediationMessage: "Set the default action to deny access from all networks."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10__networkAclsDefaultAction__c"
        right:
          TEXT: "Allow"
  - status: "COMPLIANT"
    currentStateMessage: "The default action is set to deny access from all networks."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10__networkAclsDefaultAction__c"
        right:
          TEXT: "Deny"
otherwise:
  status: "UNDETERMINED"
  currentStateMessage: "Unexpected value in the field."
