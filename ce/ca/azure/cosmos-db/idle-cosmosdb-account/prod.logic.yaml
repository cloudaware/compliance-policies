---
inputType: "CA10__CaAzureCosmosDbAccount__c"
testData:
  - file: "test-data.json"
importExtracts:
  - file: /types/CA10__CaAzureCosmosDbAccount__c/object.extracts.yaml
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "This is an Azure Cosmos DB serverless account."
    check:
      CONTAINS:
        arg:
          EXTRACT: "CA10__capabilities__c"
        search:
          TEXT: "EnableServerless"
  - status: "INCOMPLIANT"
    currentStateMessage: "The Cosmos DB account has zero total request units for the past 30 days."
    remediationMessage: "Delete the Cosmos DB account or switching to the serverless option."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10__monitorTotalRequestUnitsSum30Day__c"
        right:
          NUMBER: 0.0
otherwise:
  status: "COMPLIANT"
  currentStateMessage: "The Cosmos DB account has total request units for the past 30 days."
