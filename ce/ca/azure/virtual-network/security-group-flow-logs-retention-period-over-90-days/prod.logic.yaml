---
inputType: "CA10__CaAzureNetworkSecurityGroup__c"
importExtracts:
  - file: /types/CA10__CaAzureNetworkSecurityGroup__c/object.extracts.yaml
testData:
  - file: "test-data.json"
conditions:
  - status: "INCOMPLIANT"
    currentStateMessage: "Network Security Group flow logs are disabled."
    remediationMessage: "Enable Network Security Group flow logs and set retention to 0 or at least 90 days."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10__flowLogsEnabled__c"
        right:
          BOOLEAN: false
  - status: "INCOMPLIANT"
    currentStateMessage: "Network Security Group flow logs retention period is not configured."
    remediationMessage: "Set the retention period to 0 or at least 90 days."
    check:
      IS_EMPTY:
        arg:
          EXTRACT: "CA10__flowLogsRetentionPolicyDays__c"
  - status: "COMPLIANT"
    currentStateMessage: "Network Security Group flow logs are enabled and the retention period is set to 0 or at least 90 days."
    check:
      OR:
        args:
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__flowLogsRetentionPolicyDays__c"
              right:
                NUMBER: 0.0
          - AND:
              args:
                - IS_EQUAL:
                    left:
                      EXTRACT: "CA10__flowLogsRetentionPolicyEnabled__c"
                    right:
                      BOOLEAN: true
                - GREATER_THAN_EQUAL:
                    left:
                      EXTRACT: "CA10__flowLogsRetentionPolicyDays__c"
                    right:
                      NUMBER: 90.0
otherwise:
  status: "INCOMPLIANT"
  currentStateMessage: "Network Security Group flow logs retention period is less than 90 days."
  remediationMessage: "Set the retention period to 0 or at least 90 days."
