---
inputType: "CA10__CaAzureAuthorizationRole__c"
testData:
  - file: "test-data.json"
importExtracts:
  - file: "/types/CA10__CaAzureAuthorizationRole__c/object.extracts.yaml"
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "The policy applies only to the Owner role."
    check:
      NOT_EQUAL:
        left:
          EXTRACT: "Name"
        right:
          TEXT: "Owner"
  - status: "UNDETERMINED"
    currentStateMessage: "The Owner role is assigned to a group."
    remediationMessage: "Verify the number of members in the group."
    check:
      RELATED_LIST_HAS:
        status: "UNDETERMINED"
        relationshipName: "CA10__Azure_Authorization_Role_Assignments__r"
  - status: "INCOMPLIANT"
    currentStateMessage: "The Owner role is assigned to fewer than 2 users."
    remediationMessage: "Assign at least 2 users."
    check:
      LESS_THAN:
        left:
          RELATED_LIST_COUNT:
            status: "INCOMPLIANT"
            relationshipName: "CA10__Azure_Authorization_Role_Assignments__r"
        right:
          NUMBER: 2.0
  - status: "INCOMPLIANT"
    currentStateMessage: "The Owner role is assigned to more than 3 users."
    remediationMessage: "Reduce the number of users to 2 or 3."
    check:
      GREATER_THAN:
        left:
          RELATED_LIST_COUNT:
            status: "INCOMPLIANT"
            relationshipName: "CA10__Azure_Authorization_Role_Assignments__r"
        right:
          NUMBER: 3.0
otherwise:
  status: "COMPLIANT"
  currentStateMessage: "The Owner role is assigned to 2 or 3 users."
relatedLists:
  - relationshipName: "CA10__Azure_Authorization_Role_Assignments__r"
    conditions:
      - status: "UNDETERMINED"
        currentStateMessage: "The role is assigned to a group."
        check:
          NOT_EMPTY_LOOKUP: "CA10__groupPrincipal__r"
    otherwise: 
      status: "INCOMPLIANT"
      currentStateMessage: "An Owner role assignment exists."

