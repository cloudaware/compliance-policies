---
inputType: "CA10__CaAzureAccount__c"
testData:
  - file: "test-data.json"
conditions:
  - status: "COMPLIANT"
    currentStateMessage: "This subscription has an Activity Log Alert for Delete Network Security Group."
    check:
      RELATED_LIST_HAS:
        status: "COMPLIANT"
        relationshipName: "CA10__Azure_Activity_Log_Alerts__r"
otherwise:
  status: "INCOMPLIANT"
  currentStateMessage: "This subscription does not have an Activity Log Alert for Delete Network Security Group."
  remediationMessage: "Create an Activity Log Alert for Delete Network Security Group."
relatedLists:
  - relationshipName: "CA10__Azure_Activity_Log_Alerts__r"
    importExtracts:
      - file: "/types/CA10__CaAzureActivityLogAlert__c/object.extracts.yaml"
    conditions:
      - status: "INAPPLICABLE"
        currentStateMessage: "This Activity Log Alert is disabled."
        check:
          NOT_EQUAL:
            left:
              EXTRACT: "CA10__enabledStatus__c"
            right:
              TEXT: "Enabled"
      - status: "COMPLIANT"
        currentStateMessage: "This Activity Log Alert is for Delete Network Security Group."
        check:
          AND:
            args:
              - JSON_QUERY_BOOLEAN:
                  arg:
                    EXTRACT: "caJsonFrom__conditionJson__c"
                  expression: "contains(allOf[*].equals, 'Microsoft.Network/networkSecurityGroups/delete')"
                  undeterminedIf:
                    evaluationError: "The JSON query has failed."
                    resultTypeMismatch: "The JSON query did not return boolean type."
              - JSON_QUERY_BOOLEAN:
                  arg:
                    EXTRACT: "caJsonFrom__conditionJson__c"
                  expression: "contains(allOf[*].equals, 'Administrative')"
                  undeterminedIf:
                    evaluationError: "The JSON query has failed."
                    resultTypeMismatch: "The JSON query did not return boolean type."
              - CONTAINS:
                  arg:
                    EXTRACT: "CA10__scopes__c"
                  search:
                    TEXT: "/subscriptions/"
              - NOT:
                  arg:
                    CONTAINS:
                      arg:
                        EXTRACT: "CA10__scopes__c"
                      search:
                        TEXT: "/resourceGroups/"
    otherwise:
      status: "INAPPLICABLE"
      currentStateMessage: "This Activity Log Alert is unrelated."


