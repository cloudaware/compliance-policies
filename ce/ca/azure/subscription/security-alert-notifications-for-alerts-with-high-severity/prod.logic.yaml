---
inputType: "CA10__CaAzureAccount__c"
testData:
  - file: "test-data.json"
importExtracts:
  - file: "/types/CA10__CaAzureAccount__c/object.extracts.yaml"
conditions:
  - status: "INCOMPLIANT"
    currentStateMessage: "Security notifications emailing is not enabled."
    remediationMessage: "Consider enabling security notifications emailing to the subscription owner or other designated security contact."
# Extract only for the default contact
    check:
      IS_EMPTY:
        arg:
          EXTRACT: "caJsonText__securityCenterContactsDefaultAlertNotifications__c"
  - status: "INCOMPLIANT"
    currentStateMessage: "Security notifications emailing is not enabled."
    remediationMessage: "Consider enabling security notifications emailing to the subscription owner or other designated security contact."
# Extract only for the default contact
    check:
      NOT_EQUAL:
        left:
          EXTRACT: "caJsonText__securityCenterContactsDefaultAlertNotifications__c"
        right: 
          TEXT: "On"
  - status: "INCOMPLIANT"
    currentStateMessage: "Security notifications for alerts with High or Critical severity is not set."
    remediationMessage: "Consider enabling security notifications for alerts with High severity."
# Extract only for the default contact
    check:
      NOT:
        arg:
          CONTAINS:
            arg:
              SET:
                itemType: TEXT
                items:
                  - "High"
                  - "Critical"
            search:
              EXTRACT: "caJsonText__securityCenterContactsDefaultAlertNotificationsSeverity__c"
  - status: "COMPLIANT"
    currentStateMessage: "Security alerts emailing is enabled."
# Extract only for the default contact
    check:
      AND:
        args:
          - CONTAINS:
              arg:
                SET:
                  itemType: TEXT
                  items:
                    - "High"
                    - "Critical"
              search:
                EXTRACT: "caJsonText__securityCenterContactsDefaultAlertNotificationsSeverity__c"
          - IS_EQUAL:
              left:
                EXTRACT: "caJsonText__securityCenterContactsDefaultAlertNotifications__c"
              right: 
                TEXT: "On"
otherwise:
  status: "UNDETERMINED"
  currentStateMessage: "Unexpected values in the fields." 