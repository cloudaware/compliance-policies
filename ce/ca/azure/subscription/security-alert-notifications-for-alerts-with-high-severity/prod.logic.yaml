---
inputType: "CA10__CaAzureAccount__c"
testData:
  - file: "test-data.json"
importExtracts:
  - file: "/types/CA10__CaAzureAccount__c/object.extracts.yaml"
conditions:
  - status: "INCOMPLIANT"
    currentStateMessage: "Security notification emails are not enabled."
    remediationMessage: "Enable security notification emails for the subscription owner or a designated security contact."
# Extract only for the default contact
    check:
      IS_EMPTY:
        arg:
          EXTRACT: "caJsonText__securityCenterContactsDefaultAlertNotifications__c"
  - status: "INCOMPLIANT"
    currentStateMessage: "Security notification emails are not enabled."
    remediationMessage: "Enable security notification emails for the subscription owner or a designated security contact."
# Extract only for the default contact
    check:
      NOT_EQUAL:
        left:
          EXTRACT: "caJsonText__securityCenterContactsDefaultAlertNotifications__c"
        right: 
          TEXT: "On"
  - status: "INCOMPLIANT"
    currentStateMessage: "Security notifications do not include high severity alerts."
    remediationMessage: "Set the notification severity threshold to High, Medium, or Low."
# Extract only for the default contact
    check:
      NOT:
        arg:
          CONTAINS:
            arg:
              SET:
                itemType: TEXT
                items:
                  - "Low"
                  - "Medium"
                  - "High"
            search:
              EXTRACT: "caJsonText__securityCenterContactsDefaultAlertNotificationsSeverity__c"
  - status: "COMPLIANT"
    currentStateMessage: "Security notification emails are enabled."
# Extract only for the default contact
    check:
      AND:
        args:
          - CONTAINS:
              arg:
                SET:
                  itemType: TEXT
                  items:
                    - "Low"
                    - "Medium"
                    - "High"
              search:
                EXTRACT: "caJsonText__securityCenterContactsDefaultAlertNotificationsSeverity__c"
          - IS_EQUAL:
              left:
                EXTRACT: "caJsonText__securityCenterContactsDefaultAlertNotifications__c"
              right: 
                TEXT: "On"
otherwise:
  status: "UNDETERMINED"
  currentStateMessage: "Unexpected values in the fields."

