      NOT_EQUAL:
        left:
          EXTRACT: "CA10Z1__deploymentMode__c"
        right:
          TEXT: "Single"
  - status: "INCOMPLIANT"
    currentStateMessage: "PostgreSQL single server SSL enforcement is disabled."
    remediationMessage: "Enable SSL enforcement on the PostgreSQL server."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10Z1__sslEnforcement__c"
        right:
          TEXT: "Disabled"
  - status: "COMPLIANT"
    currentStateMessage: "PostgreSQL single server SSL enforcement is enabled."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10Z1__sslEnforcement__c"
        right:
          TEXT: "Enabled"
otherwise:
