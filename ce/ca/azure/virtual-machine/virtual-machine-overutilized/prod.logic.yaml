---
inputType: "CA10__CaAzureVirtualMachine__c"
testData:
  - file: test-data.json
importExtracts:
  - file: /types/CA10__CaAzureVirtualMachine__c/object.extracts.yaml
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "Applicable only to running virtual machines."
    check:
      NOT_EQUAL:
        left:
          EXTRACT: "CA10__powerState__c"
        right:
          TEXT: "VM running"
  - status: "INAPPLICABLE"
    currentStateMessage: "The virtual machine has been running for less than 14 days."
    check:
      NOT:
        arg:
          IS_BEYOND_LAST_DAYS:
            offsetDays: 14
            arg:
              EXTRACT: "CA10__timeCreated__c"
  - status: "UNDETERMINED"
    currentStateMessage: "There is not enough data in the CMDB to determine whether the virtual machine is overutilized."
    check:
      OR:
        args:
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__monitorCpuAvg14Day__c"
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__monitorCpuMax14Day__c"
          - AND:
              args:
                - NOT_EMPTY:
                    arg:
                      EXTRACT: "CA10N__newRelicHost__c"
                - IS_EMPTY:
                    arg:
                      EXTRACT: "CA10N__newRelicHostMemoryUsed14Day__c"
  - status: "INCOMPLIANT"
    currentStateMessage: "The virtual machine is overutilized with average CPU utilization\
      \ > 80%, max CPU utilization > 95%, and memory utilization > 80%."
    remediationMessage: "Scale up the virtual machine or implement autoscaling."
    check:
      AND:
        args:
          - NOT_EMPTY:
              arg:
                EXTRACT: "CA10N__newRelicHost__c"
          - GREATER_THAN:
              left:
                EXTRACT: "CA10__monitorCpuAvg14Day__c"
              right:
                NUMBER: 80.0
          - GREATER_THAN:
              left:
                EXTRACT: "CA10__monitorCpuMax14Day__c"
              right:
                NUMBER: 95.0
          - GREATER_THAN:
              left:
                EXTRACT: "CA10N__newRelicHostMemoryUsed14Day__c"
              right:
                NUMBER: 80.0
  - status: "INCOMPLIANT"
    currentStateMessage: "The virtual machine is overutilized with average CPU utilization > 80% and max CPU utilization > 95%."
    remediationMessage: "Scale up the virtual machine or implement autoscaling."
    check:
      AND:
        args:
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10N__newRelicHost__c"
          - GREATER_THAN:
              left:
                EXTRACT: "CA10__monitorCpuAvg14Day__c"
              right:
                NUMBER: 80.0
          - GREATER_THAN:
              left:
                EXTRACT: "CA10__monitorCpuMax14Day__c"
              right:
                NUMBER: 95.0
otherwise:
  status: "COMPLIANT"
  currentStateMessage: "The virtual machine is not overutilized."
