---
inputType: "CA10__CaAzureManagedDisk__c"
importExtracts:
  - file: "/types/CA10__CaAzureManagedDisk__c/object.extracts.yaml"
testData:
  - file: "test-data.json"
conditions:
  - status: "INCOMPLIANT"
    currentStateMessage: "Managed disk data is publicly accessible from the Internet and can be exported or uploaded from any network."
    remediationMessage: "Restrict managed disk public access."
    check:
      AND:
        args:
        - IS_EQUAL:
            left:
              EXTRACT: "CA10__networkAccessPolicy__c"
            right:
              TEXT: "AllowAll"
        - IS_EQUAL:
            left:
              EXTRACT: "CA10__publicNetworkAccess__c"
            right:
              TEXT: "Enabled"
  - status: "INCOMPLIANT"
    currentStateMessage: "Managed disk public access is not disabled."
    remediationMessage: "Disable managed disk public access."
    check:
      NOT_EQUAL:
        left:
          EXTRACT: "CA10__publicNetworkAccess__c"
        right:
          TEXT: "Disabled"
  - status: "INCOMPLIANT"
    currentStateMessage: "The managed disk network access policy allows access from any network."
    remediationMessage: "Restrict the managed disk network access policy."
    check:
      IS_EQUAL:
        left:
          EXTRACT: "CA10__networkAccessPolicy__c"
        right:
          TEXT: "AllowAll"
  - status: "COMPLIANT"
    currentStateMessage: "Managed disk public access is restricted."
    check:
      AND:
        args:
          - OR:
              args:
                - IS_EQUAL:
                    left:
                      EXTRACT: "CA10__networkAccessPolicy__c"
                    right:
                      TEXT: "AllowPrivate"
                - IS_EQUAL:
                    left:
                      EXTRACT: "CA10__networkAccessPolicy__c"
                    right:
                      TEXT: "DenyAll"
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__publicNetworkAccess__c"
              right:
                TEXT: "Disabled"
otherwise:
  status: "UNDETERMINED"
  currentStateMessage: "Unexpected value in the fields."
