---
inputType: "CA10__CaAzureVirtualMachine__c"
testData:
  - file: test-data.json
conditions:
  - status: "INCOMPLIANT"
    currentStateMessage: "The virtual machine has a network interface with an NSG that allows SMTP access from the Internet."
    remediationMessage: "Restrict inbound SMTP access from the Internet."
    check:
      RELATED_LIST_HAS:
        status: "INCOMPLIANT"
        relationshipName: "CA10__Azure_Network_Interfaces__r"
otherwise:
  status: "COMPLIANT"
  currentStateMessage: "The virtual machine does not allow SMTP access from the Internet."
relatedLists:
  - relationshipName: "CA10__Azure_Network_Interfaces__r"
    importExtracts:
      - file: "/types/CA10__CaAzureNetworkSecurityGroupRule__c/object.extracts.yaml"
    conditions:
      - status: "INCOMPLIANT"
        currentStateMessage: "Network interface with a publicly accessible network security group."
        check:
          RELATED_LIST_HAS:
            status: "INCOMPLIANT"
            relationshipName:  "CA10__networkSecurityGroup__r.CA10__Azure_Network_Security_Group_Rules__r"
    otherwise:
      status: "COMPLIANT"
      currentStateMessage: "Network interface is not publicly accessible."
    relatedLists:
      - relationshipName: "CA10__networkSecurityGroup__r.CA10__Azure_Network_Security_Group_Rules__r"
        importExtracts:
          - file: "/types/CA10__CaAzureNetworkSecurityGroupRule__c/object.extracts.yaml"
        conditions:
# sort public group rules
          - status: "INAPPLICABLE"
            currentStateMessage: "NSG outbound rule."
            check:
              NOT_EQUAL:
                left:
                  EXTRACT: "CA10__direction__c"
                right:
                  TEXT: "Inbound"
          - status: "INAPPLICABLE"
            currentStateMessage: "NSG deny rule."
            check:
              NOT_EQUAL:
                left:
                  EXTRACT: "CA10__access__c"
                right:
                  TEXT: "Allow"
          - status: "INAPPLICABLE"
            currentStateMessage: "NSG rule with a protocol other than TCP, UDP, or Any."
            check:
              NOT:
                arg:
                  OR:
                    args:
                      - IS_EQUAL:
                          left:
                            EXTRACT: "CA10__protocol__c"
                          right:
                            TEXT: "Tcp"
                      - IS_EQUAL:
                          left:
                            EXTRACT: "CA10__protocol__c"
                          right:
                            TEXT: "*"
                      - IS_EQUAL:
                          left:
                            EXTRACT: "CA10__protocol__c"
                          right:
                            TEXT: "null"
          - status: "INAPPLICABLE"
            currentStateMessage: "NSG rule source is not any address."
            check:
              NOT:
                arg:
                  OR:
                    args:
                      - IS_EQUAL:
                          left:
                            EXTRACT: "CA10__sourceAddressPrefix__c"
                          right:
                            TEXT: "Internet"
                      - IS_EQUAL:
                          left:
                            EXTRACT: "CA10__sourceAddressPrefix__c"
                          right:
                            TEXT: "*"
                      - IS_EQUAL:
                          left:
                            EXTRACT: "CA10__sourceAddressPrefix__c"
                          right:
                            TEXT: "0.0.0.0"
                      - IS_EQUAL:
                          left:
                            EXTRACT: "CA10__sourceAddressPrefix__c"
                          right:
                            TEXT: "Any"
                      - CONTAINS:
                          arg:
                            EXTRACT: "CA10__sourceAddressPrefix__c"
                          search:
                            TEXT: "/0"
          - status: "INCOMPLIANT"
            currentStateMessage: "NSG rule allows public access on the SMTP port."
            remediationMessage: "Restrict public access to the SMTP port."
            check:
                # PORT 25
              OR:
                args:
                  - IS_EQUAL:
                      left:
                        EXTRACT: "CA10__destinationPortRange__c"
                      right:
                          TEXT: "25"
                  - AND:
                      args:
                        - LESS_THAN_EQUAL:
                            left:
                              EXTRACT: "CA10__destinationPortFrom__c"
                            right:
                              NUMBER: 25.0
                        - GREATER_THAN_EQUAL:
                              left:
                                EXTRACT: "CA10__destinationPortTo__c"
                              right:
                                NUMBER: 25.0
        otherwise:
          status: "COMPLIANT"
          currentStateMessage: "NSG rule without public access on the SMTP port."



