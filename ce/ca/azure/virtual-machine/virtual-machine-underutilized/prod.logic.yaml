---
inputType: "CA10__CaAzureVirtualMachine__c"
testData:
  - file: test-data.json
importExtracts:
  - file: /types/CA10__CaAzureVirtualMachine__c/object.extracts.yaml
conditions:
  - status: "INAPPLICABLE"
    currentStateMessage: "Applicable only to running virtual machines."
    check:
      NOT_EQUAL:
        left:
          EXTRACT: "CA10__powerState__c"
        right:
          TEXT: "VM running"
  - status: "INAPPLICABLE"
    currentStateMessage: "The virtual machine has been running for less than 14 days."
    check:
      NOT:
        arg:
          IS_BEYOND_LAST_DAYS:
            offsetDays: 14
            arg:
              EXTRACT: "CA10__timeCreated__c"
  - status: "UNDETERMINED"
    currentStateMessage: "There is not enough data in the CMDB to determine whether the virtual machine is underutilized."
    check:
      OR:
        args:
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__monitorCpuAvg14Day__c"
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10__monitorCpuMax14Day__c"
          - AND:
              args:
                - NOT_EMPTY:
                    arg:
                      EXTRACT: "CA10N__newRelicHost__c"
                - IS_EMPTY:
                    arg:
                      EXTRACT: "CA10N__newRelicHostMemoryUsed14Day__c"
  - status: "INAPPLICABLE"
    currentStateMessage: "The virtual machine is idle and considered by the 'Azure Virtual Machine is idle' policy."
    check:
      AND:
        args:
          - NOT_EMPTY:
              arg:
                EXTRACT: "CA10N__newRelicHost__c"
          - LESS_THAN:
              left:
                EXTRACT: CA10N__newRelicHostMemoryUsed14Day__c
              right:
                NUMBER: 20.0
          - LESS_THAN:
              left:
                EXTRACT: CA10N__newRelicHostDiskReadUtilization__c
              right:
                NUMBER: 5.0
          - LESS_THAN:
              left:
                EXTRACT: CA10N__newRelicHostDiskWriteUtilization__c
              right:
                NUMBER: 5.0
          - LESS_THAN:
              left:
                EXTRACT: CA10__monitorCpuAvg14Day__c
              right:
                NUMBER: 5.0
          - LESS_THAN:
              left:
                EXTRACT: CA10__monitorCpuMax14Day__c
              right:
                NUMBER: 15.0
          - LESS_THAN:
              left:
                EXTRACT: CA10__monitorNetworkInMbSum14Day__c
              right:
                NUMBER: 100.0
          - LESS_THAN:
              left:
                EXTRACT: CA10__monitorNetworkOutMbSum14Day__c
              right:
                NUMBER: 100.0
  - status: "INAPPLICABLE"
    currentStateMessage: "The virtual machine is idle and considered by the 'Azure Virtual Machine is idle' policy."
    check:
      AND:
        args:
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10N__newRelicHost__c"
          - LESS_THAN:
              left:
                EXTRACT: CA10__monitorCpuAvg14Day__c
              right:
                NUMBER: 5.0
          - LESS_THAN:
              left:
                EXTRACT: CA10__monitorCpuMax14Day__c
              right:
                NUMBER: 15.0
          - LESS_THAN:
              left:
                EXTRACT: CA10__monitorNetworkInMbSum14Day__c
              right:
                NUMBER: 100.0
          - LESS_THAN:
              left:
                EXTRACT: CA10__monitorNetworkOutMbSum14Day__c
              right:
                NUMBER: 100.0
  - status: "INCOMPLIANT"
    currentStateMessage: "The virtual machine is underutilized with average CPU utilization\
      \ < 40%, max CPU utilization < 50%, and memory utilization < 40%."
    remediationMessage: "Rightsize, consolidate, or terminate the virtual machine."
    check:
      AND:
        args:
          - NOT_EMPTY:
              arg:
                EXTRACT: "CA10N__newRelicHost__c"
          - LESS_THAN:
              left:
                EXTRACT: "CA10__monitorCpuAvg14Day__c"
              right:
                NUMBER: 40.0
          - LESS_THAN:
              left:
                EXTRACT: "CA10N__newRelicHostMemoryUsed14Day__c"
              right:
                NUMBER: 40.0
          - LESS_THAN:
              left:
                EXTRACT: "CA10__monitorCpuMax14Day__c"
              right:
                NUMBER: 50.0
  - status: "INCOMPLIANT"
    currentStateMessage: "The virtual machine is underutilized with average CPU utilization\
      \ < 40%, max CPU utilization < 50%."
    remediationMessage: "Rightsize, consolidate, or terminate the virtual machine."
    check:
      AND:
        args:
          - IS_EMPTY:
              arg:
                EXTRACT: "CA10N__newRelicHost__c"
          - LESS_THAN:
              left:
                EXTRACT: "CA10__monitorCpuAvg14Day__c"
              right:
                NUMBER: 40.0
          - LESS_THAN:
              left:
                EXTRACT: "CA10__monitorCpuMax14Day__c"
              right:
                NUMBER: 50.0
otherwise:
  status: "COMPLIANT"
  currentStateMessage: "The virtual machine is not underutilized."
