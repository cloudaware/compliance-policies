---
inputType: "CA10__CaAzureVirtualMachine__c"
testData:
  - file: "test-data.json"
conditions:
  - status: "INCOMPLIANT"
    currentStateMessage: "This virtual machine uses VHD disks."
    remediationMessage: "Migrate to managed disks."
    check:
      RELATED_LIST_HAS:
        relationshipName: "CA10__Azure_Virtual_Machine_Disks__r"
        status: "INCOMPLIANT"
  - status: "COMPLIANT"
    currentStateMessage: "This virtual machine uses managed disks."
    check:
      RELATED_LIST_HAS:
        relationshipName: "CA10__Azure_Virtual_Machine_Disks__r"
        status: "COMPLIANT"
  - status: "UNDETERMINED"
    currentStateMessage: "Unable to determine the disk type."
    check:
      RELATED_LIST_HAS:
        relationshipName: "CA10__Azure_Virtual_Machine_Disks__r"
        status: "UNDETERMINED"
otherwise:
  status: "UNDETERMINED"
  currentStateMessage: "This virtual machine does not have disks."
relatedLists:
  - relationshipName: "CA10__Azure_Virtual_Machine_Disks__r"
    importExtracts:
      - file: "/types/CA10__CaAzureVirtualMachineDisk__c/object.extracts.yaml"
    conditions:
      - status: "COMPLIANT"
        currentStateMessage: "This is a managed disk."
        check:
          NOT_EMPTY:
            arg:
              EXTRACT: "CA10__managedDiskId__c"
      - status: "INCOMPLIANT"
        currentStateMessage: "This is a VHD disk."
        check:
          NOT_EMPTY:
            arg:
              EXTRACT: "CA10__vhdUri__c"
    otherwise:
      status: "UNDETERMINED"
      currentStateMessage: "Unable to determine the disk."
