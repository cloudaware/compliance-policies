---
inputType: "CA10__CaAzureVirtualMachine__c"
importExtracts:
  - file: "/types/CA10__CaAzureVirtualMachine__c/object.extracts.yaml"
testData:
  - file: "test-data.json"
conditions:
  - status: "INCOMPLIANT"
    currentStateMessage: "Security type is not set."
    remediationMessage: "Set the security type for the virtual machine to enable UEFI settings."
    check:
      IS_EMPTY:
        arg:
          EXTRACT: "CA10__securityProfileSecurityType__c"
  - status: "INCOMPLIANT"
    currentStateMessage: "Secure Boot and vTPM are disabled."
    remediationMessage: "Enable Secure Boot and vTPM."
    check:
      AND:
        args:
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__uefiSettingsVTpm__c"
              right:
                TEXT: "Disabled"
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__uefiSettingsSecureBoot__c"
              right:
                TEXT: "Disabled"
  - status: "INCOMPLIANT"
    currentStateMessage: "Secure Boot is disabled."
    remediationMessage: "Enable Secure Boot."
    check:
      AND:
        args:
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__uefiSettingsVTpm__c"
              right:
                TEXT: "Enabled"
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__uefiSettingsSecureBoot__c"
              right:
                TEXT: "Disabled"
  - status: "INCOMPLIANT"
    currentStateMessage: "vTPM is disabled."
    remediationMessage: "Enable vTPM."
    check:
      AND:
        args:
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__uefiSettingsVTpm__c"
              right:
                TEXT: "Disabled"
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__uefiSettingsSecureBoot__c"
              right:
                TEXT: "Enabled"
  - status: "COMPLIANT"
    currentStateMessage: "Secure Boot and vTPM are enabled."
    check:
      AND:
        args:
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__uefiSettingsVTpm__c"
              right:
                TEXT: "Enabled"
          - IS_EQUAL:
              left:
                EXTRACT: "CA10__uefiSettingsSecureBoot__c"
              right:
                TEXT: "Enabled"
otherwise:
  status: "UNDETERMINED"
  currentStateMessage: "Unexpected values in the fields."
